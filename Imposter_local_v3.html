        if (myPrivateCard.imageUrl) {
          const img = el("img", { class: "secret-photo", src: myPrivateCard.imageUrl, alt: myPrivateCard.word });
          img.onerror = function () { this.style.display = "none"; if (this.nextSibling) this.nextSibling.style.display = "block"; };
          back.appendChild(img);
          const fallbackEmoji = el("div", { class: "big-emoji", style: "display:none" }, [document.createTextNode(myPrivateCard.emoji || "🥥")]);
          back.appendChild(fallbackEmoji);
        } else {
          back.appendChild(el("div", { class: "big-emoji" }, [document.createTextNode(myPrivateCard.emoji || "🥥")]));
        }

        back.appendChild(el("div", { class: "secret-word" }, [document.createTextNode(myPrivateCard.word)]));
        back.appendChild(el("div", { class: "secret-category" }, [document.createTextNode("Category: " + myPrivateCard.category)]));
        card.appendChild(back);

        wrap.appendChild(card);
        wrap.addEventListener("click", () => {
          card.classList.toggle("flipped");
          playBeep(card.classList.contains("flipped") ? 580 : 440, 'sine', 0.08);
        });
        screen.appendChild(wrap);

        // Ready button
        if (!myPrivateCard.revealed) {
          screen.appendChild(el("button", {
            class: "primary",
            onclick: markMyCardReady
          }, [document.createTextNode("✓ I Saw My Word (I'm Ready)")]));
        } else {
          const readyBanner = el("div", { class: "outcome-banner success", style: "margin-bottom:0" }, [
            document.createTextNode("✓ You are ready! Waiting for other players...")
          ]);
          screen.appendChild(readyBanner);
        }

        if (voiceUiOn) {
          screen.appendChild(el("div", { class: "chat-notice warn" }, [
            document.createTextNode("🎙 Voice is auto-muted while you view your secret card. It resumes when discussion starts.")
          ]));
        }

        // Ready progress among active alive players
        const activeAlivePlayers = gameState.players.filter(p => p.online !== false && p.alive);
        const readyCount = activeAlivePlayers.filter(p => p.ready).length;
        screen.appendChild(el("div", { class: "hint" }, [
          document.createTextNode("Ready Players: " + readyCount + " / " + activeAlivePlayers.length)
        ]));

        // Host can advance when ready
        if (isHost) {
          screen.appendChild(el("button", {
            class: "secondary",
            style: "margin-top:6px",
            onclick: hostProceedToDiscussion
          }, [document.createTextNode("Proceed to Discussion Phase →")]));
        }

        app.appendChild(screen);
      }

      // ---------- Discussion Screen ----------
      let peekWordVisible = true;

      function renderSecretWordReminder() {
        if (!myPrivateCard || !myPrivateCard.word) return null;
        const wrap = el("div", {
          class: "word-reminder-box",
          title: "Tap to hide/show your secret word",
          onclick: () => {
            peekWordVisible = !peekWordVisible;
            render();
          }
        });

        const eyeIcon = el("span", { style: "font-size:.85rem; line-height:1;" }, [
          document.createTextNode(peekWordVisible ? "👁️" : "🙈")
        ]);
        wrap.appendChild(eyeIcon);

        const lbl = el("span", { style: "opacity:.75; font-size:.78rem;" }, [
          document.createTextNode("Your Word:")
        ]);
        wrap.appendChild(lbl);

        if (peekWordVisible) {
          const val = el("span", { class: "word-reminder-highlight" }, [
            document.createTextNode((myPrivateCard.emoji ? (myPrivateCard.emoji + " ") : "") + myPrivateCard.word)
          ]);
          wrap.appendChild(val);
          if (myPrivateCard.category) {
            wrap.appendChild(el("span", { style: "opacity:.6; font-size:.72rem; margin-left:2px;" }, [
              document.createTextNode("(" + myPrivateCard.category + ")")
            ]));
          }
        } else {
          wrap.appendChild(el("span", { style: "letter-spacing:2px; opacity:.65; font-size:.78rem; font-weight:600;" }, [
            document.createTextNode("•••••• (Tap to reveal)")
          ]));
        }

        return wrap;
      }

      function renderMultiplayerDiscuss(app) {
        const screen = el("div", { class: "screen" });

        // First player spotlight banner (Round 1)
        if (gameState.roundNumber === 1 && gameState.firstPlayerName) {
          const banner = el("div", { class: "outcome-banner success" }, [
            el("div", { style: "font-size:1.5rem" }, [document.createTextNode("👑")]),
            el("div", { style: "font-weight:bold; font-size:1.1rem; margin-top:2px" }, [
              document.createTextNode(gameState.firstPlayerName + " gives the first clue!")
            ]),
            el("div", { style: "font-size:.8rem; opacity:.85" }, [document.createTextNode("Describe your word without saying it.")])
          ]);
          screen.appendChild(banner);
        }

        const panel = el("div", { class: "panel", style: "width:100%; text-align:center" });
        panel.appendChild(el("div", { style: "font-size:.8rem; text-transform:uppercase; letter-spacing:1px; color:var(--gold); opacity:.9;" }, [
          document.createTextNode("Round " + (gameState.roundNumber || 1) + " Discussion")
        ]));
        panel.appendChild(el("div", { class: "timer-box", id: "timerVal" }, [document.createTextNode(formatTime(gameState.timerSeconds))]));
        panel.appendChild(el("p", { style: "font-size:.85rem; opacity:.85; margin:0" }, [
          document.createTextNode("Listen to clues, look for suspicious behavior, and discuss before voting.")
        ]));

        // Discreet Secret Word Reminder Badge
        const reminder = renderSecretWordReminder();
        if (reminder) panel.appendChild(reminder);

        screen.appendChild(panel);

        // Host control to proceed to vote
        if (isHost) {
          screen.appendChild(el("button", {
            class: "primary",
            onclick: hostProceedToVoting
          }, [document.createTextNode("🗳️ Open Live Voting Ballot ▶")]));
        } else {
          screen.appendChild(el("div", { class: "hint" }, [document.createTextNode("Waiting for host to open voting...")]));
        }

        app.appendChild(screen);
      }

      // ---------- Voting Screen ----------
      function renderMultiplayerVote(app) {
        const screen = el("div", { class: "screen" });

        const alivePlayers = gameState.players.filter(p => p.online !== false && p.alive);
        const votesMap = gameState.votes || {};
        const totalVotes = Object.keys(votesMap).length;
        const me = gameState.players.find(p => p.id === myPlayerId);
        const isAlive = me && me.alive;

        const panel = el("div", { class: "panel", style: "width:100%" });
        panel.appendChild(el("h3", { style: "margin:0 0 4px; color:var(--gold); text-align:center" }, [
          document.createTextNode("Round " + (gameState.roundNumber || 1) + " · Cast Your Vote")
        ]));

        let promptText = "Tap a player suspected of being the Imposter:";
        if (!isAlive) {
          promptText = "You are eliminated. Watching alive players vote:";
        } else if (myVotedId) {
          const votedPlayer = gameState.players.find(p => p.id === myVotedId);
          promptText = "✓ You voted for " + (votedPlayer ? votedPlayer.name : "a player") + ". Tap another card to change vote:";
        }

        panel.appendChild(el("p", { style: "font-size:.85rem; opacity:.85; text-align:center; margin:0 0 10px" }, [
          document.createTextNode(promptText)
        ]));

        // Live votes progress
        const progBox = el("div", { style: "margin-bottom:10px; text-align:center;" });
        progBox.appendChild(el("div", { class: "hint", style: "margin:0 0 4px; font-weight:600; color:var(--gold); font-size:.85rem;" }, [
          document.createTextNode("Votes Cast: " + totalVotes + " / " + alivePlayers.length + " alive players")
        ]));

        // Discreet Secret Word Reminder Badge
        const reminder = renderSecretWordReminder();
        if (reminder) progBox.appendChild(reminder);

        panel.appendChild(progBox);

        const vGrid = el("div", { class: "vote-grid" });
        alivePlayers.forEach(p => {
          const pVotes = p.votesReceived || 0;
          const pct = totalVotes > 0 ? Math.round((pVotes / totalVotes) * 100) : 0;
          const isSelected = myVotedId === p.id;
          const row = el("div", {
            class: "vote-card" + (isSelected ? " selected" : ""),
            onclick: () => {
              if (isAlive) castVoteOnPhone(p.id);
            }
          });

          row.appendChild(el("div", { class: "vote-fill", style: "width:" + pct + "%" }));

          const info = el("div", { class: "vote-info" });
          info.appendChild(el("span", { style: "font-size:1.35rem; line-height:1;" }, [document.createTextNode(p.avatar || "👤")]));
          info.appendChild(el("span", { style: "font-weight:600; font-size:.95rem" }, [
            document.createTextNode(p.name + (p.id === myPlayerId ? " (You)" : ""))
          ]));
          if (isSelected) {
            info.appendChild(el("span", { class: "my-vote-tag" }, [document.createTextNode("YOUR VOTE")]));
          }
          row.appendChild(info);

          row.appendChild(el("div", { class: "vote-count-badge" }, [
            document.createTextNode(String(pVotes))
          ]));
          vGrid.appendChild(row);
        });
        panel.appendChild(vGrid);
        screen.appendChild(panel);

        // Host action to reveal outcome
        if (isHost) {
          const allIn = totalVotes >= alivePlayers.length;
          screen.appendChild(el("button", {
            class: "primary",
            onclick: hostCalculateVoteOutcome
          }, [document.createTextNode("⚡ Reveal Voting Outcome (" + totalVotes + "/" + alivePlayers.length + " Votes) ▶")]));
        } else {
          screen.appendChild(el("div", { class: "hint" }, [document.createTextNode("Waiting for host to reveal results...")]));
        }

        app.appendChild(screen);
      }

      // ---------- Tie / No Ejection Screen ----------
      function renderMultiplayerVoteTie(app) {
        const screen = el("div", { class: "screen" });
        const panel = el("div", { class: "panel" });
        const o = gameState.voteOutcome || {};

        let titleIcon = "⚖️";
        let titleText = "Vote Tie — No Ejection";
        let bannerText = "";

        if (!o.total || o.total === 0) {
          titleIcon = "🤷";
          titleText = "No Votes Cast";
          bannerText = "No votes were cast. No player was ejected!";
        } else if (o.topNames && o.topNames.length > 1) {
          titleIcon = "⚖️";
          titleText = "Tie for Most Votes";
          bannerText = o.topNames.join(" and ") + " tied with " + o.maxVotes + " votes each! No one was ejected.";
        } else {
          bannerText = "No single player had the most votes. No one was ejected.";
        }

        const banner = el("div", { class: "vote-banner neutral" });
        banner.appendChild(el("div", { style: "font-size:1.8rem" }, [document.createTextNode(titleIcon)]));
        banner.appendChild(el("div", {}, [
          el("div", { style: "font-weight:700; font-size:1.05rem;" }, [document.createTextNode(titleText)]),
          el("div", { style: "font-size:.85rem; opacity:.9; margin-top:2px;" }, [document.createTextNode(bannerText)])
        ]));
        panel.appendChild(banner);

        panel.appendChild(el("p", { style: "text-align:center; opacity:.85; font-size:.85rem; margin:10px 0 0;" }, [
          document.createTextNode(o.aliveCount + " players remain. Keep discussing clues and vote again in Round " + ((gameState.roundNumber || 1) + 1) + "!")
        ]));

        const reminder = renderSecretWordReminder();
        if (reminder) panel.appendChild(el("div", { style: "text-align:center; margin-top:8px;" }, [reminder]));

        screen.appendChild(panel);

        if (isHost) {
          screen.appendChild(el("button", {
            class: "primary",
            onclick: hostProceedToDiscussion
          }, [document.createTextNode("Continue Discussion (Round " + ((gameState.roundNumber || 1) + 1) + ") →")]));
        } else {
          screen.appendChild(el("div", { class: "hint" }, [document.createTextNode("Waiting for host to continue discussion...")]));
        }

        app.appendChild(screen);
      }

      // ---------- Round Result Screen ----------
      function renderMultiplayerRoundResult(app) {
        const screen = el("div", { class: "screen" });
        const panel = el("div", { class: "panel" });
        const o = gameState.voteOutcome || {};
        const name = o.name || "Player";

        const banner = el("div", { class: "vote-banner " + (o.wasImposter ? "correct" : "wrong") });
        banner.appendChild(el("div", { style: "font-size:1.8rem" }, [document.createTextNode(o.wasImposter ? "✅" : "❌")]));
        banner.appendChild(el("div", {}, [
          el("div", { style: "font-weight:700; font-size:1.05rem;" }, [
            document.createTextNode(name + " was ejected with " + (o.maxVotes || 1) + " vote" + (o.maxVotes > 1 ? "s" : "") + "!")
          ]),
          el("div", { style: "font-size:.88rem; opacity:.9; margin-top:2px;" }, [
            document.createTextNode(o.wasImposter ? (name + " WAS an Imposter! 🤫") : (name + " was NOT the Imposter. 🛡️"))
          ])
        ]));
        panel.appendChild(banner);

        const msg = o.wasImposter
          ? (o.remainingImposters + " imposter" + (o.remainingImposters > 1 ? "s" : "") + " still remain among the " + o.aliveCount + " players left. Keep going!")
          : (o.aliveCount + " players remain. Catch the imposter before too many crew are eliminated!");
        panel.appendChild(el("p", { style: "text-align:center; opacity:.9; font-size:.88rem; margin:8px 0 0;" }, [document.createTextNode(msg)]));

        const reminder = renderSecretWordReminder();
        if (reminder) panel.appendChild(el("div", { style: "text-align:center; margin-top:8px;" }, [reminder]));

        screen.appendChild(panel);

        if (isHost) {
          screen.appendChild(el("button", {
            class: "primary",
            onclick: hostProceedToDiscussion
          }, [document.createTextNode("Continue Discussion (Round " + ((gameState.roundNumber || 1) + 1) + ") →")]));
        } else {
          screen.appendChild(el("div", { class: "hint" }, [document.createTextNode("Waiting for host to continue discussion...")]));
        }

        app.appendChild(screen);
      }

      // ---------- Game Over Results Screen ----------
      function renderMultiplayerResults(app) {
        const screen = el("div", { class: "screen" });
        const panel = el("div", { class: "panel" });
        const o = gameState.voteOutcome || {};
        const name = o.name || "Player";

        let icon = "🎉", text = "", bannerClass = "correct";
        if (gameState.gameOverReason === "crewWin") {
          icon = "🎉"; bannerClass = "correct";
          text = name + " was ejected and WAS an imposter — all imposters caught! Crew wins! (+10 pts to Crew)";
        } else if (gameState.winner === "imposter") {
          icon = "😈"; bannerClass = "wrong";
          text = o.wasImposter
            ? (name + " was ejected and was an imposter, but other imposters remain — too few crew left. Imposters win! (+10 victory bonus)")
            : (name + " was ejected but was NOT an imposter — too few crew left. Imposters win! (+10 victory bonus)");
        } else {
          icon = "🏆"; bannerClass = "correct";
          text = "Game Finished!";
        }

        const banner = el("div", { class: "vote-banner " + bannerClass });
        banner.appendChild(el("div", { style: "font-size:1.8rem" }, [document.createTextNode(icon)]));
        banner.appendChild(el("div", { style: "font-size:.95rem;" }, [document.createTextNode(text)]));
        panel.appendChild(banner);

        // Points earned summary
        if (o.scoreEvents && o.scoreEvents.length > 0) {
          const eventsBox = el("div", { class: "score-events-box" });
          o.scoreEvents.forEach(ev => {
            const item = el("div", { class: "score-event-item" });
            item.appendChild(el("span", {}, [
              document.createTextNode((ev.avatar || "👤") + " " + ev.name + " · " + ev.reason)
            ]));
            item.appendChild(el("span", { class: "score-event-pts" }, [
              document.createTextNode("+" + ev.pts + " pts")
            ]));
            eventsBox.appendChild(item);
          });
          panel.appendChild(eventsBox);
        }

        panel.appendChild(el("div", { style: "opacity:.7; font-size:.85rem; text-align:center; margin-top:10px;" }, [document.createTextNode("Crew's Word")]));
        const crewDiv = el("div", { style: "text-align:center; margin:6px 0 14px;" }, [
          gameState.secretImageUrl ? el("img", { class: "secret-photo", src: gameState.secretImageUrl, alt: gameState.secretWord }) : el("div", { class: "big-emoji" }, [document.createTextNode(gameState.secretEmoji || "🥥")]),
          el("div", { class: "secret-word" }, [document.createTextNode(gameState.secretWord)])
        ]);
        panel.appendChild(crewDiv);

        panel.appendChild(el("div", { style: "opacity:.7; font-size:.85rem; text-align:center;" }, [document.createTextNode("Imposter's Word")]));
        const impDiv = el("div", { style: "text-align:center; margin:6px 0 14px;" }, [
          gameState.decoyImageUrl ? el("img", { class: "secret-photo", src: gameState.decoyImageUrl, alt: gameState.decoyWord }) : el("div", { class: "big-emoji" }, [document.createTextNode(gameState.decoyEmoji || "🥥")]),
          el("div", { class: "secret-word", style: "color:var(--danger)" }, [document.createTextNode(gameState.decoyWord)])
        ]);
        panel.appendChild(impDiv);

        const imposterPlayers = (gameState.players || []).filter(p => (gameState.imposterIds || []).includes(p.id));
        const imposterNames = imposterPlayers.map(p => p.name);
        const listDiv = el("div", { style: "text-align:center; margin-top:8px; font-size:.95rem;" }, [
          document.createTextNode(imposterNames.length > 1 ? "The imposters were: " : "The imposter was: "),
          el("b", { style: "color:var(--gold)" }, [document.createTextNode(imposterNames.join(", "))])
        ]);
        panel.appendChild(listDiv);

        screen.appendChild(panel);

        // Full Scorecard Table
        screen.appendChild(createScorecardElement({ showResetBtn: true }));

        if (isHost) {
          screen.appendChild(el("button", {
            class: "primary",
            onclick: () => {
              gameState.screen = "lobby";
              gameState.secretWord = "";
              gameState.decoyWord = "";
              gameState.secretImageUrl = null;
              gameState.decoyImageUrl = null;
              gameState.imposterIds = [];
              gameState.votes = {};
              gameState.voteOutcome = null;
              gameState.gameOverReason = null;
              gameState.winner = null;
              gameState.roundNumber = 1;
              gameState.players.forEach(p => {
                p.ready = false;
                p.votesReceived = 0;
                if (p.online !== false) p.alive = true;
              });
              myPrivateCard = {
                role: "crew",
                word: "",
                emoji: "🥥",
                category: "",
                imageUrl: null,
                revealed: false
              };
              broadcastGameState();
              render();
            }
          }, [document.createTextNode("🔄 Play Again (Same Lobby & Scores) ▶")]));
        }

        screen.appendChild(el("button", {
          class: "secondary",
          onclick: exitToMenu
        }, [document.createTextNode("Main Menu")]));

        app.appendChild(screen);
      }

      // ==========================================
      // Navigation & Back-button Safety Guard
      // ==========================================
      window.addEventListener("popstate", () => {
        if (showEmojiModal) {
          showEmojiModal = false;
          pushInGameState();
          render();
          return;
        }
        if (showScoreModal) {
          showScoreModal = false;
          pushInGameState();
          render();
          return;
        }
        if (appMode === "multiplayer" && roomCode) {
          if (confirm("You are currently in game room " + roomCode + ".\n\nDo you really want to exit the game?")) {
            exitToMenu(false);
          } else {
            pushInGameState();
          }
        }
      });

      window.addEventListener("beforeunload", (e) => {
        if (appMode === "multiplayer" && roomCode) {
          e.preventDefault();
          e.returnValue = "You have an active game in progress (" + roomCode + "). Leaving will disconnect you.";
          return e.returnValue;
        }
      });

      // ==========================================
      // Startup
      // ==========================================
      window.addEventListener("DOMContentLoaded", () => {
        const params = new URLSearchParams(window.location.search);
        const roomParam = params.get("room");
        const modeParam = params.get("mode"); // "internet" or null/undefined
        if (roomParam) {
          appMode = "menu";
          // Auto-join if room code in URL (for shared invite links).
          // For internet mode, wait for WebSocket support; for LAN, wait for PeerJS.
          let waited = 0;
          const tryJoin = () => {
            const hasWS = (typeof WebSocket !== "undefined");
            const hasPeer = (typeof Peer !== "undefined");
            if (modeParam === "internet" && hasWS) {
              initClientJoin(roomParam, { mode: "internet" });
              return;
            }
            if (modeParam !== "internet" && hasPeer) {
              initClientJoin(roomParam, { mode: "lan" });
              return;
            }
            if ((modeParam === "internet" && !hasWS) || waited > 12000) {
              netDiag("Required features unavailable — cannot auto-join " + roomParam + ".");
              render();
              return;
            }
            waited += 500;
            setTimeout(tryJoin, 500);
          };
          tryJoin();
        }
        render();
      });

    })();
  </script>
</body>

</html>
