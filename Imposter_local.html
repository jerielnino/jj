<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Imposter · Multiplayer Party Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕵️</text></svg>">
<meta name="theme-color" content="#e8b93a">
<!-- PeerJS for zero-server WebRTC Multiplayer on GitHub Pages -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<!-- QRCode.js for instant LAN join -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
  :root{
    --black:#050505;
    --black-soft:#141414;
    --black-softer:#1e1e1e;
    --gold:#e8b93a;
    --gold-dark:#b8860b;
    --cream:#f2efe6;
    --ink:#161616;
    --success:#2ecc71;
    --danger:#e74c3c;
    --cyan:#00d2d3;
    --purple:#9b59b6;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    font-family:'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(circle at 50% -10%, rgba(232,185,58,.12), transparent 55%),
      linear-gradient(160deg,#000000,var(--black-soft) 60%,var(--black-softer));
    color:var(--cream);
    overflow-x:hidden;
  }
  #app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:16px 14px 40px;
  }
  h1{
    font-size:1.6rem;
    text-align:center;
    margin:4px 0 2px;
    color:var(--gold);
    text-shadow:0 0 14px rgba(232,185,58,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .subtitle{
    text-align:center;
    opacity:.85;
    font-size:.85rem;
    margin-bottom:14px;
  }
  .screen{
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    animation:fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .panel{
    width:100%;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    border-radius:18px;
    padding:16px;
    backdrop-filter:blur(6px);
  }
  label{
    display:block;
    font-size:.85rem;
    margin-bottom:6px;
    opacity:.9;
  }
  input[type=text], input[type=number]{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.2);
    font-size:1rem;
    background:var(--black-softer);
    color:var(--cream);
    outline:none;
    transition:border-color 0.2s;
  }
  input[type=text]:focus{
    border-color:var(--gold);
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:10px;
    justify-content:center;
  }
  .stepper button{
    width:42px; height:42px;
    border-radius:50%;
    border:none;
    font-size:1.3rem;
    background:var(--gold);
    color:var(--ink);
    font-weight:bold;
    cursor:pointer;
    transition:transform 0.1s;
  }
  .stepper button:active{ transform:scale(0.92); }
  .stepper .value{
    min-width:60px;
    text-align:center;
    font-size:1.4rem;
    font-weight:bold;
  }
  .hint{
    font-size:.78rem;
    opacity:.75;
    text-align:center;
    margin-top:4px;
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }
  .chip{
    padding:8px 14px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.06);
    color:var(--cream);
    font-size:.82rem;
    cursor:pointer;
    transition:all 0.2s;
  }
  .chip.active{
    background:linear-gradient(135deg,var(--gold),var(--gold-dark));
    color:var(--ink);
    border-color:var(--gold);
    font-weight:600;
  }
  button.primary{
    width:100%;
    padding:14px;
    font-size:1.02rem;
    font-weight:600;
    border:none;
    border-radius:14px;
    background:linear-gradient(135deg,var(--gold),var(--gold-dark));
    color:var(--ink);
    cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,.3);
    transition:transform 0.15s, filter 0.15s;
  }
  button.primary:active{ transform:scale(.98); }
  button.secondary{
    width:100%;
    padding:12px;
    font-size:.95rem;
    border-radius:14px;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.05);
    color:var(--cream);
    cursor:pointer;
    transition:background 0.2s;
  }
  button.secondary:active{ background:rgba(255,255,255,.12); }
  button.accent-btn{
    background:linear-gradient(135deg,var(--cyan),#0984e3);
    color:#fff;
  }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  
  .top-bar{
    width:100%;
    max-width:440px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
    gap:6px;
  }
  .top-bar button{
    background:none;
    border:none;
    color:var(--cream);
    opacity:.8;
    font-size:.85rem;
    cursor:pointer;
    padding:4px 6px;
  }
  .net-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:4px 10px;
    border-radius:12px;
    font-size:.75rem;
    background:rgba(0,0,0,.4);
    border:1px solid rgba(255,255,255,.15);
  }
  .net-badge.online{ color:var(--success); border-color:var(--success); }
  .net-badge.connecting{ color:var(--gold); border-color:var(--gold); }
  .net-badge.error{ color:var(--danger); border-color:var(--danger); }
  .dot{
    width:7px; height:7px; border-radius:50%; background:currentColor;
  }

  .reconnect-btn-top{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:4px 10px;
    border-radius:12px;
    font-size:.78rem;
    background:rgba(231,76,60,.2);
    border:1px solid var(--danger);
    color:var(--cream);
    cursor:pointer;
    font-weight:600;
    animation:pulse 1.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* Mascot and Title */
  .title-mascot{
    width:120px;
    height:120px;
    border-radius:24px;
    object-fit:cover;
    box-shadow:0 8px 24px rgba(0,0,0,.6), 0 0 24px rgba(232,185,58,.3);
    border:2px solid rgba(232,185,58,.4);
    margin:0 auto 6px;
    display:block;
    transition:transform .2s ease;
  }
  .title-mascot:hover{ transform:scale(1.04); }
  .header-icon{
    width:26px; height:26px;
    border-radius:6px;
    object-fit:cover;
    vertical-align:middle;
    border:1px solid rgba(232,185,58,.4);
  }
  .title-heading{
    text-align:center;
    color:var(--gold);
    margin:2px 0 0;
    font-size:1.4rem;
  }
  .title-tagline{
    text-align:center;
    opacity:.8;
    font-size:.85rem;
    margin:0 0 12px;
  }

  /* Room & Lobby styles */
  .room-code-box{
    text-align:center;
    padding:12px;
    background:rgba(232,185,58,.1);
    border:2px dashed var(--gold);
    border-radius:14px;
    margin-bottom:12px;
  }
  .room-code-text{
    font-size:2rem;
    letter-spacing:4px;
    font-weight:900;
    color:var(--gold);
    user-select:all;
  }
  #qrcodeContainer{
    display:flex;
    justify-content:center;
    padding:10px;
    background:#fff;
    border-radius:12px;
    margin:10px auto;
    width:160px;
    height:160px;
  }
  #qrcodeContainer img{
    width:100%; height:100%;
  }

  .player-lobby-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(120px, 1fr));
    gap:8px;
    width:100%;
    margin-top:10px;
    max-height:220px;
    overflow-y:auto;
  }
  .player-pill{
    padding:8px 10px;
    border-radius:12px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.15);
    display:flex;
    align-items:center;
    gap:6px;
    font-size:.85rem;
    position:relative;
    transition:all 0.2s ease;
  }
  .player-pill.is-host{
    border-color:var(--gold);
    background:rgba(232,185,58,.15);
  }
  .player-pill.is-me{
    border-color:var(--cyan);
    font-weight:bold;
    background:rgba(0,210,211,.12);
  }
  .player-pill.offline{
    opacity:0.6;
    border-style:dashed;
    border-color:rgba(231,76,60,.5);
    background:rgba(231,76,60,.06);
  }
  .player-avatar{
    font-size:1.25rem;
    line-height:1;
  }
  .player-offline-badge{
    font-size:.68rem;
    color:var(--danger);
    font-weight:bold;
    margin-left:auto;
  }
  .kick-btn{
    position:absolute;
    right:4px; top:4px;
    background:none; border:none;
    color:var(--danger);
    cursor:pointer;
    font-size:.8rem;
    padding:2px;
  }

  /* Avatar Picker Styles */
  .avatar-picker-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .avatar-select-btn{
    width:56px;
    height:56px;
    border-radius:16px;
    border:2px solid var(--gold);
    background:rgba(232,185,58,.15);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:2rem;
    cursor:pointer;
    position:relative;
    transition:transform .15s, background .15s;
    flex-shrink:0;
    padding:0;
  }
  .avatar-select-btn:hover{
    transform:scale(1.05);
    background:rgba(232,185,58,.25);
  }
  .avatar-edit-badge{
    position:absolute;
    bottom:-3px;
    right:-3px;
    background:var(--gold);
    color:var(--ink);
    font-size:.7rem;
    border-radius:50%;
    width:18px;
    height:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    box-shadow:0 2px 6px rgba(0,0,0,.6);
  }
  .emoji-preset-grid{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:8px;
    margin:12px 0;
    max-height:210px;
    overflow-y:auto;
    padding:4px;
  }
  .emoji-item-btn{
    width:100%;
    aspect-ratio:1/1;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.05);
    font-size:1.6rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:transform .12s, border-color .12s, background .12s;
  }
  .emoji-item-btn:hover{
    transform:scale(1.12);
    border-color:var(--gold);
    background:rgba(232,185,58,.2);
  }
  .emoji-item-btn.selected{
    border-color:var(--gold);
    background:rgba(232,185,58,.35);
    box-shadow:0 0 10px rgba(232,185,58,.4);
  }

  /* 3D Card styles */
  .card-wrap{
    perspective:900px;
    width:100%;
    max-width:320px;
    height:380px;
    margin:10px auto;
  }
  .card{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.55s cubic-bezier(.4,.2,.2,1);
    cursor:pointer;
  }
  .card.flipped{
    transform:rotateY(180deg);
  }
  .face{
    position:absolute;
    width:100%;
    height:100%;
    backface-visibility:hidden;
    border-radius:22px;
    padding:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    box-shadow:0 12px 30px rgba(0,0,0,.6);
    border:2px solid rgba(255,255,255,.2);
  }
  .face.front{
    background:
      radial-gradient(circle at 50% 30%, rgba(232,185,58,.25), transparent 70%),
      linear-gradient(145deg, #1c1c1c, #0a0a0a);
    border-color:var(--gold);
  }
  .face.back{
    background:
      radial-gradient(circle at 50% 30%, rgba(0,210,211,.2), transparent 70%),
      linear-gradient(145deg, #141414, #080808);
    transform:rotateY(180deg);
  }
  .card-role-badge{
    font-size:.8rem;
    text-transform:uppercase;
    letter-spacing:1.5px;
    padding:4px 12px;
    border-radius:20px;
    background:rgba(255,255,255,.1);
    margin-bottom:10px;
  }
  .secret-photo{
    width:140px;
    height:140px;
    border-radius:18px;
    object-fit:cover;
    margin:10px 0;
    box-shadow:0 6px 18px rgba(0,0,0,.5);
    border:2px solid rgba(255,255,255,.2);
  }
  .big-emoji{
    font-size:4.5rem;
    margin:10px 0;
    line-height:1;
  }
  .secret-word{
    font-size:1.6rem;
    font-weight:bold;
    color:var(--gold);
    text-align:center;
    margin:4px 0;
  }
  .secret-category{
    font-size:.85rem;
    opacity:.8;
  }

  /* Timer & Discussion */
  .timer-box{
    font-size:3.2rem;
    font-weight:bold;
    color:var(--gold);
    text-shadow:0 0 20px rgba(232,185,58,.4);
    text-align:center;
    font-variant-numeric:tabular-nums;
    margin:8px 0;
  }

  /* Voting ballot */
  .vote-grid{
    display:flex;
    flex-direction:column;
    gap:8px;
    width:100%;
    margin-top:8px;
  }
  .vote-card{
    position:relative;
    padding:12px 14px;
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.15);
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    overflow:hidden;
    transition:all 0.15s;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .vote-card:active{ transform:scale(0.98); }
  .vote-card.selected{
    border-color:var(--gold);
    background:rgba(232,185,58,.22);
    box-shadow:0 0 16px rgba(232,185,58,.4);
  }
  .vote-fill{
    position:absolute;
    left:0; top:0; bottom:0;
    background:rgba(232,185,58,.25);
    z-index:0;
    transition:width 0.3s ease;
  }
  .vote-info{
    position:relative;
    z-index:1;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .vote-count-badge{
    position:relative;
    z-index:1;
    font-weight:bold;
    font-size:1.1rem;
    color:var(--gold);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .my-vote-tag{
    font-size:.72rem;
    padding:2px 8px;
    border-radius:8px;
    background:var(--gold);
    color:var(--ink);
    font-weight:700;
  }

  /* Vote & Outcome Banners */
  .vote-banner{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 16px;
    border-radius:14px;
    margin-bottom:12px;
    font-size:.95rem;
    font-weight:600;
    text-align:left;
  }
  .vote-banner.correct{
    background:rgba(46,204,113,.2);
    border:1px solid var(--success);
    color:var(--cream);
  }
  .vote-banner.wrong{
    background:rgba(192,57,43,.25);
    border:1px solid var(--danger);
    color:var(--cream);
  }
  .vote-banner.neutral{
    background:rgba(232,185,58,.2);
    border:1px solid var(--gold);
    color:var(--cream);
  }

  .outcome-banner{
    padding:16px;
    border-radius:16px;
    text-align:center;
    width:100%;
    margin-bottom:10px;
    animation:slideDown 0.3s ease;
  }
  @keyframes slideDown{
    from{ opacity:0; transform:translateY(-12px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .outcome-banner.success{
    background:rgba(46,204,113,.2);
    border:1px solid var(--success);
    color:#2ecc71;
  }
  .outcome-banner.danger{
    background:rgba(231,76,60,.2);
    border:1px solid var(--danger);
    color:#e74c3c;
  }
  .role-reveal-tag{
    font-size:1.3rem;
    font-weight:bold;
    margin-top:6px;
  }

  /* Scorecard & Leaderboard */
  .scorecard-panel{
    width:100%;
    margin-top:10px;
  }
  .scorecard-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }
  .scorecard-table{
    width:100%;
    border-collapse:collapse;
    margin-top:4px;
    font-size:.88rem;
  }
  .scorecard-table th{
    text-align:left;
    padding:6px 8px;
    border-bottom:1px solid rgba(255,255,255,.2);
    color:var(--gold);
    font-size:.75rem;
    text-transform:uppercase;
    letter-spacing:.5px;
  }
  .scorecard-table td{
    padding:8px 8px;
    border-bottom:1px solid rgba(255,255,255,.07);
    vertical-align:middle;
  }
  .scorecard-row.is-me{
    background:rgba(0,210,211,.1);
    font-weight:600;
  }
  .score-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:3px 8px;
    border-radius:10px;
    font-weight:700;
    font-size:.85rem;
    background:rgba(232,185,58,.2);
    color:var(--gold);
    border:1px solid rgba(232,185,58,.4);
  }
  .rank-badge{
    font-weight:bold;
    min-width:24px;
    display:inline-block;
    text-align:center;
    font-size:.95rem;
  }
  .score-events-box{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:6px;
    margin:10px 0;
  }
  .score-event-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 12px;
    border-radius:10px;
    background:rgba(46,204,113,.15);
    border:1px solid rgba(46,204,113,.4);
    font-size:.85rem;
    color:var(--cream);
  }
  .score-event-pts{
    font-weight:bold;
    color:#2ecc71;
  }
  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(6px);
    z-index:999;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px;
    animation:fadeIn 0.2s ease;
  }
  .modal-panel{
    width:100%;
    max-width:420px;
    max-height:85vh;
    overflow-y:auto;
    background:#121212;
    border:2px solid var(--gold);
    border-radius:20px;
    padding:18px;
    box-shadow:0 12px 36px rgba(0,0,0,.8);
  }
  .score-btn-top{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:4px 10px;
    border-radius:12px;
    font-size:.78rem;
    background:rgba(232,185,58,.15);
    border:1px solid var(--gold);
    color:var(--gold);
    cursor:pointer;
    font-weight:600;
  }

  footer{
    margin-top:20px;
    opacity:.55;
    font-size:.72rem;
    text-align:center;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  "use strict";
  const MASCOT_IMG = "https://raw.githubusercontent.com/jerielnino/jj/main/media/icons/boy_hoodie_specs_imposter.png";

  // ==========================================
  // KERALA WORD BANK
  // ==========================================
  const WORDS = [
    {word:"Appam", emoji:"🥞", cat:"Food"},
    {word:"Puttu", emoji:"🍙", cat:"Food"},
    {word:"Kadala Curry", emoji:"🍛", cat:"Food"},
    {word:"Idiyappam", emoji:"🍜", cat:"Food"},
    {word:"Kanji", emoji:"🥣", cat:"Food"},
    {word:"Sadya", emoji:"🍛", cat:"Food"},
    {word:"Payasam", emoji:"🍮", cat:"Food"},
    {word:"Avial", emoji:"🥗", cat:"Food"},
    {word:"Thoran", emoji:"🥬", cat:"Food"},
    {word:"Olan", emoji:"🍲", cat:"Food"},
    {word:"Erissery", emoji:"🍲", cat:"Food"},
    {word:"Pachadi", emoji:"🥗", cat:"Food"},
    {word:"Meen Curry", emoji:"🐟", cat:"Food"},
    {word:"Karimeen Fry", emoji:"🐠", cat:"Food"},
    {word:"Meen Pollichathu", emoji:"🐟", cat:"Food"},
    {word:"Beef Fry", emoji:"🥩", cat:"Food"},
    {word:"Nadan Kozhi Curry", emoji:"🍗", cat:"Food"},
    {word:"Malabar Biryani", emoji:"🍚", cat:"Food"},
    {word:"Kappa", emoji:"🥔", cat:"Food"},
    {word:"Kappa Biriyani", emoji:"🍚", cat:"Food"},

  // Sound Synth (Web Audio API)
  const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;
  function playBeep(freq, type, dur){
    if (!audioCtx) return;
    try {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq || 440, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.15));
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + (dur || 0.15));
    } catch(e){}
  }
  function vibrate(ms){
    if (navigator.vibrate) navigator.vibrate(ms || 40);
  }

  function el(tag, attrs, children){
    const e = document.createElement(tag);
    if (attrs) for (const k in attrs){
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k === "disabled") {
        if (attrs[k]) {
          e.setAttribute("disabled", "disabled");
          e.disabled = true;
        } else {
          e.removeAttribute("disabled");
          e.disabled = false;
        }
      }
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
    (children || []).forEach(c => { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }

  function generateRoomCode(){
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let code = "IMP-";
    for (let i = 0; i < 4; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
    return code;
  }

  function getWordPool(){
    if (gameState.categoryFilter === "All") return WORDS;
    return WORDS.filter(w => w.cat === gameState.categoryFilter);
  }

  function pickDecoy(secret){
    const cands = WORDS.filter(w => w.cat === secret.cat && w.word !== secret.word);
    return cands.length ? cands[Math.floor(Math.random() * cands.length)] : secret;
  }

  function fetchWikipediaThumbnail(word, callback){
    try {
      fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(word))
        .then(r => r.ok ? r.json() : null)
        .then(d => {
          if (d && d.thumbnail && d.thumbnail.source) callback(d.thumbnail.source);
          else callback(null);
        }).catch(() => callback(null));
    } catch(e){ callback(null); }
  }

  function formatTime(s){
    const m = Math.floor(s / 60), sec = s % 60;
    return String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
  }

  function setPlayerAvatar(emoji){
    if (!emoji || !emoji.trim()) return;
    myAvatar = emoji.trim();
    localStorage.setItem("imposter_my_avatar", myAvatar);
    
    // If in room, update in state and inform host/peers
    if (appMode === "multiplayer"){
      if (isHost){
        const hostPlayer = gameState.players.find(p => p.id === myPlayerId);
        if (hostPlayer) hostPlayer.avatar = myAvatar;
        broadcastGameState();
      } else if (hostConn && hostConn.open){
        hostConn.send({ type: "UPDATE_AVATAR", id: myPlayerId, avatar: myAvatar });
      }
    }
    render();
  }

  function createScorecardElement(options){
    options = options || {};

    const header = el("div", {class:"scorecard-header"});
    header.appendChild(el("label", {style:"margin:0; font-weight:700; color:var(--gold); font-size:.95rem;"}, [

        onclick: () => {

            gameState.players.forEach(p => {
              p.score = 0;
              p.roundsSurvived = 0;
              p.gamesWon = 0;
            });
            broadcastGameState();
            render();
          }
        }
      }, [document.createTextNode("Reset Scores")]));
    }
    wrap.appendChild(header);

    const sorted = [...(gameState.players || [])].sort((a, b) => (b.score || 0) - (a.score || 0));
    
    if (sorted.length === 0){
      wrap.appendChild(el("div", {class:"hint", style:"margin:8px 0;"}, [document.createTextNode("No players yet.")]));
      return wrap;
    }

    const table = el("table", {class:"scorecard-table"});
    const thead = el("thead");
    const trHead = el("tr");
    trHead.appendChild(el("th", {style:"width:38px; text-align:center;"}, [document.createTextNode("Rank")]));
    trHead.appendChild(el("th", {}, [document.createTextNode("Player")]));
    trHead.appendChild(el("th", {style:"text-align:center; width:55px;"}, [document.createTextNode("Survived")]));
    trHead.appendChild(el("th", {style:"text-align:center; width:45px;"}, [document.createTextNode("Wins")]));
    trHead.appendChild(el("th", {style:"text-align:right; width:70px;"}, [document.createTextNode("Points")]));
    thead.appendChild(trHead);
    table.appendChild(thead);

    const tbody = el("tbody");
    sorted.forEach((p, idx) => {
      const isMe = p.id === myPlayerId;
      const row = el("tr", {class:"scorecard-row" + (isMe ? " is-me" : "")});
      
      // Rank badge
      const rankCell = el("td", {style:"text-align:center;"});
      const rankText = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : String(idx + 1);
      rankCell.appendChild(el("span", {class:"rank-badge"}, [document.createTextNode(rankText)]));
      row.appendChild(rankCell);

      // Player info
      const nameCell = el("td");
      nameCell.appendChild(el("span", {style:"margin-right:6px; font-size:1.1rem;"}, [document.createTextNode(p.avatar || "👤")]));
      nameCell.appendChild(el("span", {style:"font-weight:" + (isMe ? "700" : "500")}, [
        document.createTextNode(p.name + (isMe ? " (You)" : "") + (p.isHost ? " 👑" : "") + (!p.online ? " [Offline]" : ""))
      ]));
      row.appendChild(nameCell);

      // Imposter Rounds Survived
      const survCell = el("td", {style:"text-align:center; opacity:.85;"}, [
        document.createTextNode(String(p.roundsSurvived || 0))
      ]);
      row.appendChild(survCell);

      // Games Won
      const winCell = el("td", {style:"text-align:center; opacity:.85;"}, [
        document.createTextNode(String(p.gamesWon || 0))

        document.createTextNode(String(p.score || 0) + " pts")

      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);

    wrap.appendChild(el("div", {class:"hint", style:"margin-top:8px; text-align:left; font-size:.74rem; opacity:.75;"}, [
      document.createTextNode("⭐ Scoring: Imposters earn +10 pts for every voting round survived! +10 pts for match victory.")

  const PEER_OPTS = {
    debug: 1,
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },

  function pushInGameState(){
    try {
      if (window.history && window.history.pushState){
        window.history.pushState({ inGame: true, room: roomCode }, "");
      }
    } catch(e){}
  }

  function startHeartbeat(){
    if (heartbeatInterval) clearInterval(heartbeatInterval);
    heartbeatInterval = setInterval(() => {
      if (isHost && appMode === "multiplayer"){
        clientConns.forEach((conn) => {
          if (conn && conn.open){
            try { conn.send({ type: "PING" }); } catch(e){}
          }
        });
      }
    }, 3500);
  }

  function initHostRoom(){
    isHost = true;
    roomCode = generateRoomCode();
    myPlayerId = getOrCreatePersistentPlayerId();
    netStatus = "connecting";
    netStatusMsg = "Setting up room...";
    pushInGameState();
    render();

    const peerId = "imposter-p2p-" + roomCode.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
    
    if (peer) { try { peer.destroy(); } catch(e){} }
    peer = new Peer(peerId, PEER_OPTS);

    peer.on('open', () => {
      netStatus = "connected";
      netStatusMsg = "Room Live!";
      gameState.players = [{
        id: myPlayerId,
        connId: "host",
        name: (myPlayerName || "Host").trim(),
        avatar: myAvatar,
        isHost: true,
        online: true,
        ready: false,
        alive: true,
        votesReceived: 0,
        score: 0,
        roundsSurvived: 0,
        gamesWon: 0
      }];
      startHeartbeat();
      render();
    });

    peer.on('connection', (conn) => {
      clientConns.set(conn.peer, conn);

      conn.on('data', (data) => {
        handleHostReceivedData(conn.peer, data, conn);
      });

      conn.on('open', () => {
        clientConns.set(conn.peer, conn);
      });

      conn.on('close', () => {
        clientConns.delete(conn.peer);
        // Mark player as offline, but preserve their score, role, alive status & voting history
        const p = gameState.players.find(x => x.connId === conn.peer);
        if (p){
          p.online = false;
          p.connId = null;
          broadcastGameState();
          render();
        }
      });

      conn.on('error', (err) => {
        console.warn("Host connection error with peer:", conn.peer, err);
      });
    });

    peer.on('disconnected', () => {
      if (peer && !peer.destroyed){
        try { peer.reconnect(); } catch(e){}
      }
    });

    peer.on('error', (err) => {
      netStatus = "error";
      netStatusMsg = "Room error: " + (err.message || err.type);
      render();
    });
  }

  function initClientJoin(targetCode){
    isHost = false;
    roomCode = targetCode.toUpperCase().trim();
    myPlayerId = getOrCreatePersistentPlayerId();
    netStatus = "connecting";
    netStatusMsg = "Connecting to room " + roomCode + "...";
    pushInGameState();
    render();

    if (peer) { try { peer.destroy(); } catch(e){} }
    peer = new Peer(null, PEER_OPTS);

    peer.on('open', () => {
      connectToHost();
    });

    peer.on('disconnected', () => {
      if (peer && !peer.destroyed){
        try { peer.reconnect(); } catch(e){}
      }
    });

    peer.on('error', (err) => {
      netStatus = "error";
      netStatusMsg = "Connection error: " + (err.message || err.type);
      render();
      triggerClientAutoReconnect();
    });
  }

  function connectToHost(){
    const targetPeerId = "imposter-p2p-" + roomCode.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
    if (hostConn) { try { hostConn.close(); } catch(e){} }
    
    hostConn = peer.connect(targetPeerId, { reliable: true });

    hostConn.on('open', () => {
      netStatus = "connected";
      netStatusMsg = "Connected!";
      reconnectAttempts = 0;
      if (reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer = null; }

      // Send join handshake with persistent identity
      hostConn.send({
        type: "JOIN",
        id: myPlayerId,
        name: (myPlayerName || "Player").trim(),
        avatar: myAvatar
      });
      render();
    });

    hostConn.on('data', (data) => {
      handleClientReceivedData(data);
    });

    hostConn.on('close', () => {
      netStatus = "connecting";
      netStatusMsg = "Connection lost. Reconnecting...";
      render();
      triggerClientAutoReconnect();
    });

    hostConn.on('error', () => {
      triggerClientAutoReconnect();
    });
  }

  function triggerClientAutoReconnect(){
    if (appMode !== "multiplayer" || isHost || !roomCode) return;
    if (reconnectTimer) return;

    reconnectAttempts++;
    if (reconnectAttempts > 25){
      netStatus = "error";
      netStatusMsg = "Disconnected from room " + roomCode;
      render();
      return;
    }

    netStatus = "connecting";
    netStatusMsg = "Reconnecting to Host (attempt " + reconnectAttempts + ")...";
    render();

    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      if (appMode === "multiplayer" && !isHost && roomCode){
        if (peer && !peer.destroyed && peer.open){
          connectToHost();
        } else {
          initClientJoin(roomCode);
        }
      }
    }, Math.min(2500, 1000 + reconnectAttempts * 200));
  }

  // Host: Process incoming messages from clients
  function handleHostReceivedData(peerId, data, conn){
    if (data.type === "JOIN"){
      const incomingId = data.id || peerId;
      const incomingName = (data.name || "Player").trim();
      const normName = incomingName.toLowerCase();
      
      // 1. Check if this is an existing player rejoining (by persistent ID or normalized username)
      let existing = gameState.players.find(p => p.id === incomingId || (p.name && p.name.trim().toLowerCase() === normName));
      
      if (existing){
        // RE-ATTACH EXISTING PLAYER WITH PRESERVED SCORES, POINTS & ROLE
        existing.id = incomingId;
        existing.connId = peerId;
        existing.name = incomingName;
        if (data.avatar) existing.avatar = data.avatar;
        existing.online = true;

        clientConns.set(peerId, conn);

        // Send state sync
        conn.send({ type: "STATE_SYNC", state: gameState });

        // If game is in progress, re-send their private role card so their screen recovers immediately!
        if (gameState.screen !== "lobby"){
          const isImp = (gameState.imposterIds || []).includes(existing.id);
          const card = {
            role: isImp ? "imposter" : "crew",
            word: isImp ? gameState.decoyWord : gameState.secretWord,
            emoji: isImp ? gameState.decoyEmoji : gameState.secretEmoji,
            category: gameState.secretCategory,
            imageUrl: isImp ? gameState.decoyImageUrl : gameState.secretImageUrl,
            revealed: true
          };
          conn.send({ type: "PRIVATE_CARD", card: card });
        }

        broadcastGameState();
        render();
        return;
      }

      // 2. NEW PLAYER: Check if username is already taken by an active connected player
      const activeConflict = gameState.players.find(p => p.online && p.name && p.name.trim().toLowerCase() === normName);
      if (activeConflict){
        conn.send({
          type: "JOIN_REJECT",
          reason: "The username \"" + incomingName + "\" is already taken in this room. Please choose another username."
        });
        return;
      }

      // 3. Register New Player
      const isGameActive = gameState.screen !== "lobby";
      gameState.players.push({
        id: incomingId,
        connId: peerId,
        name: incomingName,
        avatar: data.avatar || "👤",
        isHost: false,
        online: true,
        ready: isGameActive,
        alive: !isGameActive, // Spectator if joined mid-match
        votesReceived: 0,
        score: 0,
        roundsSurvived: 0,
        gamesWon: 0
      });

      clientConns.set(peerId, conn);
      conn.send({ type: "STATE_SYNC", state: gameState });
      playBeep(600, 'sine', 0.1);
      broadcastGameState();
      render();

    } else if (data.type === "UPDATE_AVATAR"){
      const p = gameState.players.find(x => x.id === data.id);
      if (p && data.avatar){
        p.avatar = data.avatar;
        broadcastGameState();
        render();
      }
    } else if (data.type === "PLAYER_READY"){
      const p = gameState.players.find(x => x.id === data.id);
      if (p) p.ready = true;
      broadcastGameState();
      render();
    } else if (data.type === "CAST_VOTE"){
      handlePlayerVote(data.voterId, data.targetId);
    } else if (data.type === "PING"){
      try { conn.send({ type: "PONG" }); } catch(e){}
    }
  }

  // Client: Process incoming messages from host
  function handleClientReceivedData(data){
    if (data.type === "STATE_SYNC"){
      gameState = data.state;
      // Sync local player's registered vote from host authoritative registry
      if (gameState.screen === "vote"){
        myVotedId = (gameState.votes && gameState.votes[myPlayerId]) ? gameState.votes[myPlayerId] : null;
      } else {
        myVotedId = null;
      }
      render();
    } else if (data.type === "PRIVATE_CARD"){
      myPrivateCard = data.card;
      myVotedId = null;
      render();
    } else if (data.type === "JOIN_REJECT"){
      alert(data.reason || "Could not join room.");
      exitToMenu(false);
    } else if (data.type === "ANNOUNCE_BEEP"){
      playBeep(data.freq || 520, 'sine', 0.18);
      vibrate(50);
    } else if (data.type === "PING"){
      if (hostConn && hostConn.open){
        try { hostConn.send({ type: "PONG" }); } catch(e){}
      }
    }
  }

  function broadcastGameState(){
    const payload = { type: "STATE_SYNC", state: gameState };
    clientConns.forEach(conn => {
      if (conn && conn.open) {
        try { conn.send(payload); } catch(e){}
      }
    });
  }

  function sendToPlayer(playerId, payload){
    const p = gameState.players.find(x => x.id === playerId);
    if (!p) return;
    if (p.isHost){
      if (payload.type === "PRIVATE_CARD") myPrivateCard = payload.card;
    } else if (p.connId && clientConns.has(p.connId)){
      const conn = clientConns.get(p.connId);
      if (conn && conn.open) {
        try { conn.send(payload); } catch(e){}
      }
    }
  }

  // ==========================================
  // MULTIPLAYER GAME FLOW (Authoritative on Host)
  // ==========================================
  function hostStartMultiplayerGame(){
    const activePlayers = gameState.players.filter(p => p.online);
    if (activePlayers.length < 3) {
      alert("Need at least 3 online players to start!");
      return;
    }
    const pool = getWordPool();
    const secret = pool[Math.floor(Math.random() * pool.length)];
    const decoy = pickDecoy(secret);

    // Randomize first clue giver from active online players
    const firstP = activePlayers[Math.floor(Math.random() * activePlayers.length)];
    gameState.firstPlayerName = firstP ? firstP.name : "First Player";

    // Pick imposters randomly
    const shuffled = [...gameState.players].sort(() => 0.5 - Math.random());
    const imposterCount = Math.min(gameState.numImposters, Math.max(1, Math.floor((gameState.players.length - 1) / 2)));
    const chosenImposters = shuffled.slice(0, imposterCount).map(p => p.id);
    gameState.imposterIds = chosenImposters;
    const imposterIds = new Set(chosenImposters);

    gameState.secretWord = secret.word;
    gameState.secretEmoji = secret.emoji;
    gameState.secretCategory = secret.cat;
    gameState.decoyWord = decoy.word;
    gameState.decoyEmoji = decoy.emoji;
    gameState.winner = null;
    gameState.gameOverReason = null;
    gameState.voteOutcome = null;
    gameState.roundNumber = 1;
    gameState.votes = {};
    gameState.voteRoundId = 1;

    // Reset round properties while preserving scores & tournament wins
    gameState.players.forEach(p => {
      p.ready = false;
      p.alive = true;
      p.votesReceived = 0;
      p.score = p.score || 0;
      p.roundsSurvived = p.roundsSurvived || 0;
      p.gamesWon = p.gamesWon || 0;
    });

    myVotedId = null;
    gameState.screen = "card";

    // Fetch images and send private cards to each player's screen
    fetchWikipediaThumbnail(secret.word, (secImg) => {
      gameState.secretImageUrl = secImg;
      fetchWikipediaThumbnail(decoy.word, (decImg) => {
        gameState.decoyImageUrl = decImg;

        gameState.players.forEach(p => {
          const isImp = imposterIds.has(p.id);
          sendToPlayer(p.id, {
            type: "PRIVATE_CARD",
            card: {
              role: isImp ? "imposter" : "crew",
              word: isImp ? decoy.word : secret.word,
              emoji: isImp ? decoy.emoji : secret.emoji,
              category: secret.cat,
              imageUrl: isImp ? decImg : secImg,
              revealed: false
            }
          });
        });

        broadcastGameState();
        render();
      });
    });
  }

  function markMyCardReady(){
    myPrivateCard.revealed = true;
    vibrate(40);
    playBeep(640, 'triangle', 0.1);
    if (isHost){
      const me = gameState.players.find(p => p.id === myPlayerId);
      if (me) me.ready = true;
      broadcastGameState();
      render();
    } else if (hostConn && hostConn.open){
      hostConn.send({ type: "PLAYER_READY", id: myPlayerId });
      render();
    }
  }

  function hostProceedToDiscussion(){
    if (gameState.screen === "voteTie" || gameState.screen === "roundResult"){
      gameState.roundNumber = (gameState.roundNumber || 1) + 1;
    }
    gameState.screen = "discuss";
    gameState.timerSeconds = 0;
    gameState.timerRunning = true;
    gameState.votes = {};
    gameState.players.forEach(p => p.votesReceived = 0);
    myVotedId = null;
    startSyncTimer();
    broadcastGameState();
    render();
  }

  function startSyncTimer(){
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (gameState.timerRunning && gameState.screen === "discuss"){
        gameState.timerSeconds++;
        const disp = document.getElementById("timerVal");
        if (disp) disp.textContent = formatTime(gameState.timerSeconds);
        // Sync timer periodically
        if (gameState.timerSeconds % 4 === 0 && isHost) broadcastGameState();
      }
    }, 1000);
  }

  function hostProceedToVoting(){
    if (timerInterval) clearInterval(timerInterval);
    gameState.timerRunning = false;
    gameState.votes = {};
    gameState.voteRoundId = (gameState.voteRoundId || 0) + 1;
    gameState.players.forEach(p => p.votesReceived = 0);
    gameState.screen = "vote";
    myVotedId = null;
    broadcastGameState();
    render();
  }

  // Authoritative Single-Vote Enforcement on Host
  function handlePlayerVote(voterId, targetId){
    if (!isHost) return;
    const voter = gameState.players.find(p => p.id === voterId);
    const target = gameState.players.find(p => p.id === targetId);

    // Only alive voters and alive targets are accepted
    if (voter && voter.alive && target && target.alive){
      gameState.votes = gameState.votes || {};
      
      // Overwrite/register voter's single selection
      gameState.votes[voterId] = targetId;

      // Recalculate votesReceived for all players
      gameState.players.forEach(p => {
        p.votesReceived = Object.values(gameState.votes).filter(tid => tid === p.id).length;
      });

      playBeep(480, 'sine', 0.08);
      broadcastGameState();
      render();
    }
  }

  function castVoteOnPhone(targetId){
    const me = gameState.players.find(p => p.id === myPlayerId);
    if (!me || !me.alive) return; // Spectators/Eliminated cannot vote

    // Allow changing vote or selecting new target
    myVotedId = targetId;
    vibrate(40);
    playBeep(700, 'sine', 0.12);

    if (isHost){
      handlePlayerVote(myPlayerId, targetId);
    } else if (hostConn && hostConn.open){
      hostConn.send({ type: "CAST_VOTE", voterId: myPlayerId, targetId: targetId });
    }
    render();
  }

  // ==========================================
  // VOTE OUTCOME (Authoritative on Host)
  // Maximum voted person is ejected (Plurality)
  // Surviving Imposter gets +10 points per round!
  // ==========================================
  function hostCalculateVoteOutcome(){
    if (!isHost) return;
    const alivePlayers = gameState.players.filter(p => p.alive);
    const totalVotes = Object.keys(gameState.votes || {}).length;
    const maxVotes = Math.max(...alivePlayers.map(p => p.votesReceived || 0), 0);
    
    // Players tied for the maximum votes (must have at least 1 vote)
    const topPlayers = (totalVotes > 0 && maxVotes > 0)
      ? alivePlayers.filter(p => (p.votesReceived || 0) === maxVotes)
      : [];

    const scoreEvents = [];

    if (topPlayers.length !== 1){
      // TIE or 0 votes => NO EJECTION!
      // Surviving Imposters earn +10 points for surviving this voting round!
      const aliveImposters = alivePlayers.filter(p => (gameState.imposterIds || []).includes(p.id));
      aliveImposters.forEach(imp => {
        imp.score = (imp.score || 0) + 10;
        imp.roundsSurvived = (imp.roundsSurvived || 0) + 1;
        scoreEvents.push({
          id: imp.id,
          name: imp.name,
          avatar: imp.avatar,
          pts: 10,
          reason: "Survived Round " + (gameState.roundNumber || 1) + " as Imposter 🤫"
        });
      });

      gameState.voteOutcome = {
        ejected: false,
        isTie: topPlayers.length > 1,
        total: totalVotes,
        maxVotes: maxVotes,
        topNames: topPlayers.map(p => p.name),
        scoreEvents: scoreEvents,
        aliveCount: alivePlayers.length
      };
      gameState.screen = "voteTie";
    } else {
      // Single player has highest votes => EJECTED!
      const accused = topPlayers[0];
      const wasImposter = (gameState.imposterIds || []).includes(accused.id);
      accused.alive = false;

      const aliveAfter = gameState.players.filter(p => p.alive);
      const aliveImpostersAfter = aliveAfter.filter(p => (gameState.imposterIds || []).includes(p.id));
      const remainingImposters = aliveImpostersAfter.length;

      // Surviving imposters earn +10 points
      aliveImpostersAfter.forEach(imp => {
        imp.score = (imp.score || 0) + 10;
        imp.roundsSurvived = (imp.roundsSurvived || 0) + 1;
        scoreEvents.push({
          id: imp.id,
          name: imp.name,
          avatar: imp.avatar,
          pts: 10,
          reason: "Survived Round " + (gameState.roundNumber || 1) + " as Imposter 🤫"
        });
      });

      gameState.voteOutcome = {
        ejected: true,
        name: accused.name,
        avatar: accused.avatar,
        wasImposter: wasImposter,
        remainingImposters: remainingImposters,
        aliveCount: aliveAfter.length,
        maxVotes: maxVotes,
        totalVotes: totalVotes,
        scoreEvents: scoreEvents
      };

      if (remainingImposters === 0){
        // All imposters caught => Crew Win!
        gameState.gameOverReason = "crewWin";
        gameState.winner = "crew";
        gameState.screen = "results";

        const crewMembers = gameState.players.filter(p => !(gameState.imposterIds || []).includes(p.id));
        crewMembers.forEach(c => {
          c.score = (c.score || 0) + 10;
          c.gamesWon = (c.gamesWon || 0) + 1;
          scoreEvents.push({
            id: c.id,
            name: c.name,
            avatar: c.avatar,
            pts: 10,
            reason: "Crew Victory 🛡️"
          });
        });
      } else if (aliveAfter.length <= remainingImposters * 2){
        // Parity reached => Imposters Win!
        gameState.gameOverReason = "floorReached";
        gameState.winner = "imposter";
        gameState.screen = "results";

        aliveImpostersAfter.forEach(imp => {
          imp.score = (imp.score || 0) + 10;
          imp.gamesWon = (imp.gamesWon || 0) + 1;
          scoreEvents.push({
            id: imp.id,
            name: imp.name,
            avatar: imp.avatar,
            pts: 10,
            reason: "Imposter Match Victory 🏆"
          });
        });
      } else {
        // Continue to next discussion round
        gameState.screen = "roundResult";
      }
    }

    broadcastGameState();
    render();
  }

    render();

  // ---------- Voting Screen ----------
  function renderMultiplayerVote(app){
    const screen = el("div", {class:"screen"});

    const alivePlayers = gameState.players.filter(p => p.alive);
    const votesMap = gameState.votes || {};
    const totalVotes = Object.keys(votesMap).length;
    const me = gameState.players.find(p => p.id === myPlayerId);
    const isAlive = me && me.alive;

    const panel = el("div", {class:"panel", style:"width:100%"});
    panel.appendChild(el("h3", {style:"margin:0 0 4px; color:var(--gold); text-align:center"}, [
      document.createTextNode("Round " + (gameState.roundNumber || 1) + " · Cast Your Vote")
    ]));

    let promptText = "Tap a player suspected of being the Imposter:";
    if (!isAlive){
      promptText = "You are eliminated. Watching alive players vote:";
    } else if (myVotedId){
      const votedPlayer = gameState.players.find(p => p.id === myVotedId);
      promptText = "✓ You voted for " + (votedPlayer ? votedPlayer.name : "a player") + ". Tap another card to change vote:";
    }

    panel.appendChild(el("p", {style:"font-size:.85rem; opacity:.85; text-align:center; margin:0 0 10px"}, [
      document.createTextNode(promptText)
    ]));

    // Live votes progress
    const progBox = el("div", {style:"margin-bottom:10px; text-align:center;"});
    progBox.appendChild(el("div", {class:"hint", style:"margin:0 0 4px; font-weight:600; color:var(--gold); font-size:.85rem;"}, [
      document.createTextNode("Votes Cast: " + totalVotes + " / " + alivePlayers.length + " alive players")
    ]));
    panel.appendChild(progBox);

    const vGrid = el("div", {class:"vote-grid"});
    alivePlayers.forEach(p => {
      const pVotes = p.votesReceived || 0;
      const pct = totalVotes > 0 ? Math.round((pVotes / totalVotes) * 100) : 0;
      const isSelected = myVotedId === p.id;
      const row = el("div", {
        class:"vote-card" + (isSelected ? " selected" : ""),
        onclick: () => {
          if (isAlive) castVoteOnPhone(p.id);
        }
      });

      row.appendChild(el("div", {class:"vote-fill", style:"width:" + pct + "%"}));
      
      const info = el("div", {class:"vote-info"});
      info.appendChild(el("span", {style:"font-size:1.35rem; line-height:1;"}, [document.createTextNode(p.avatar || "👤")]));
      info.appendChild(el("span", {style:"font-weight:600; font-size:.95rem"}, [
        document.createTextNode(p.name + (p.id === myPlayerId ? " (You)" : ""))
      ]));
      if (isSelected){
        info.appendChild(el("span", {class:"my-vote-tag"}, [document.createTextNode("YOUR VOTE")]));
      }
      row.appendChild(info);

      row.appendChild(el("div", {class:"vote-count-badge"}, [
        document.createTextNode(String(pVotes))
      ]));
      vGrid.appendChild(row);
    });
    panel.appendChild(vGrid);
    screen.appendChild(panel);

    // Host action to reveal outcome
    if (isHost){
      const allIn = totalVotes >= alivePlayers.length;
      screen.appendChild(el("button", {
        class:"primary",
        onclick: hostCalculateVoteOutcome
      }, [document.createTextNode("⚡ Reveal Voting Outcome (" + totalVotes + "/" + alivePlayers.length + " Votes) ▶")]));
    } else {
      screen.appendChild(el("div", {class:"hint"}, [document.createTextNode("Waiting for host to reveal results...")]));
    }

    app.appendChild(screen);
  }

      }, [document.createTextNode("🔄 Play Again (Same Lobby & Scores) ▶")]));
    }

    screen.appendChild(el("button", {
      class:"secondary",
      onclick: exitToMenu
    }, [document.createTextNode("Main Menu")]));

    app.appendChild(screen);
  }

  // ==========================================
  // Navigation & Back-button Safety Guard
  // ==========================================
  window.addEventListener("popstate", () => {
    if (showEmojiModal){
      showEmojiModal = false;
      pushInGameState();
      render();
      return;
    }
    if (showScoreModal){
      showScoreModal = false;
      pushInGameState();
      render();
      return;
    }
    if (appMode === "multiplayer" && roomCode){
      if (confirm("You are currently in game room " + roomCode + ".\n\nDo you really want to exit the game?")){
        exitToMenu(false);
      } else {
        pushInGameState();
      }
    }
  });

  window.addEventListener("beforeunload", (e) => {
    if (appMode === "multiplayer" && roomCode){
      e.preventDefault();
      e.returnValue = "You have an active game in progress (" + roomCode + "). Leaving will disconnect you.";
      return e.returnValue;
    }
  });

  // ==========================================
  // Startup
  // ==========================================
  window.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const roomParam = params.get("room");
    if (roomParam){
      appMode = "menu";
    }
    render();
  });

})();
</script>
</body>
</html>
