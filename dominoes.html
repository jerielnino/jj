<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dominoes · Multiplayer Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🁠</text></svg>">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root {
  --gold: #e8b93a;
  --gold-dark: #b8860b;
  --cream: #f2efe6;
  --green-board: #0d6f45;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, system-ui; background: linear-gradient(160deg, #000, #141414 60%); color: var(--cream); }

#app { width: 100%; min-height: 100vh; display: flex; flex-direction: column; }
.setup-screen { width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
.setup-screen.hidden { display: none; }

.screen { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; margin: auto; }
h1 { font-size: 1.6rem; text-align: center; margin: 0; color: var(--gold); }
.subtitle { text-align: center; opacity: 0.85; font-size: 0.85rem; margin: 0 0 14px 0; }

.panel { width: 100%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 18px; padding: 16px; }
label { display: block; font-size: 0.85rem; margin-bottom: 6px; opacity: 0.9; }
input[type=text] { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2); font-size: 1rem; background: #1e1e1e; color: var(--cream); }
input[type=text]:focus { border-color: var(--gold); outline: none; }

.chip-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { padding: 8px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); color: var(--cream); font-size: 0.82rem; cursor: pointer; }
.chip.active { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; border-color: var(--gold); font-weight: 600; }

button.primary { width: 100%; padding: 14px; font-size: 1.02rem; font-weight: 600; border: none; border-radius: 14px; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; cursor: pointer; }
button.primary:active { transform: scale(.98); }
button.primary:disabled { opacity: 0.45; cursor: not-allowed; }

#qrCode { display: flex; justify-content: center; margin: 16px 0; }
.join-code { font-size: 1.8rem; font-weight: bold; color: var(--gold); font-family: monospace; letter-spacing: 2px; margin: 8px 0 16px; text-align: center; }
.players-waiting { background: rgba(0,0,0,.3); border-radius: 12px; padding: 12px; margin: 12px 0; max-height: 120px; overflow-y: auto; min-height: 40px; }
.waiting-player { padding: 8px 12px; background: rgba(255,255,255,.08); border-radius: 8px; margin-bottom: 6px; font-size: 0.9rem; }

.game-screen { width: 100%; min-height: 100vh; display: flex; flex-direction: column; background: linear-gradient(135deg, var(--green-board) 0%, #0d5a3d 100%); padding: 12px; gap: 12px; overflow-y: auto; }
.game-screen.hidden { display: none; }

.top-bar { display: flex; justify-content: space-between; padding: 12px; background: rgba(0,0,0,.3); border-radius: 10px; font-size: 0.9rem; }
.board-area { min-height: 200px; display: flex; align-items: center; justify-content: center; overflow-x: auto; overflow-y: hidden; border-radius: 10px; background: rgba(0,0,0,.2); }
.board-inner { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; padding: 20px; max-width: 95%; }

.domino-played { width: 60px; height: 120px; background: linear-gradient(135deg, #f5f1e8 0%, #e8dcc8 100%); border-radius: 8px; border: 2px solid #c8b8a0; box-shadow: 0 8px 16px rgba(0,0,0,.6); display: flex; flex-direction: column; position: relative; overflow: hidden; }
.domino-played::after { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #999, transparent); }

.domino-half-top, .domino-half-bottom { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }

.players-section { background: rgba(0,0,0,.3); border-radius: 10px; padding: 12px; display: flex; gap: 10px; overflow-x: auto; flex-wrap: wrap; justify-content: center; }
.player-status { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 10px; padding: 10px 14px; font-size: 0.85rem; min-width: 100px; text-align: center; }
.player-status.current { background: rgba(232,185,58,.15); border-color: var(--gold); font-weight: 600; }

.hand-area { background: rgba(0,0,0,.3); border-radius: 10px; padding: 12px; display: flex; gap: 8px; overflow-x: auto; flex-wrap: wrap; align-content: flex-start; min-height: 120px; padding-bottom: 20px; }

.hand-domino { width: 50px; height: 100px; background: linear-gradient(135deg, #f5f1e8 0%, #e8dcc8 100%); border-radius: 6px; border: 2px solid #c8b8a0; box-shadow: 0 4px 10px rgba(0,0,0,.5); cursor: pointer; display: flex; flex-direction: column; transition: all 0.2s; position: relative; overflow: hidden; }
.hand-domino::after { content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 1.5px; background: linear-gradient(90deg, transparent, #999, transparent); }
.hand-domino:hover { transform: translateY(-12px); border-color: var(--gold); }

.hand-half-top, .hand-half-bottom { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }

.action-buttons { background: rgba(0,0,0,.3); border-radius: 10px; padding: 12px; display: flex; gap: 10px; justify-content: center; }
.draw-btn { padding: 10px 20px; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
.draw-btn:hover { transform: scale(1.05); }
.draw-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.waiting-message { text-align: center; color: var(--gold); font-size: 1.2rem; padding: 40px; }
</style>
<!-- Domino tile colours -->
<style>
:root {
  --dot-0: #1e1e1e;
  --dot-1: #ff4d4d;
  --dot-2: #ffad33;
  --dot-3: #ffff66;
  --dot-4: #a6e22e;
  --dot-5: #66d9ef;
  --dot-6: #ae81ff;
}
/* Sprite sheet for domino tiles */
.domino-tile {
  width: 80px;
  height: 40px;
  background-image: url('file:///C:/Users/Asus/.gemini/antigravity-ide/brain/1b5149cb-9ee6-4997-9c3e-e4d9f39c0791/domino_sheet_1792917705091.jpg');
  background-size: 700% 400%; /* 7 columns, 4 rows */
  background-repeat: no-repeat;
}
.domino-tile.horizontal { transform: none; }
.domino-tile.vertical { transform: rotate(90deg); transform-origin: center; }
.kick-btn {
  background: transparent;
  border: none;
  color: #ff4d4d;
  font-size: 1rem;
  margin-left: 6px;
  cursor: pointer;
}
.kick-btn:hover { opacity: 0.8; }
</style>
</head>
<body>

<div id="app">
  <div id="setupScreen" class="setup-screen">
    <div class="screen">
      <h1>🁠 Dominoes</h1>
      <p class="subtitle">Play with friends on LAN</p>

      <div class="panel">
        <label>Your Name</label>
        <input type="text" id="playerName" placeholder="Enter your name" value="Player">
      </div>

      <div class="panel">
        <label>Game Mode</label>
        <div class="chip-row">
          <div class="chip active" onclick="setMode('host')">Host Game</div>
          <div class="chip" onclick="setMode('join')">Join Game</div>
        </div>
      </div>

      <div id="hostPanel" class="panel">
        <label>Players Needed</label>
        <div class="chip-row">
          <div class="chip active" onclick="setPlayers(2)">2</div>
          <div class="chip" onclick="setPlayers(3)">3</div>
          <div class="chip" onclick="setPlayers(4)">4</div>
          <div class="chip" onclick="setPlayers(5)">5</div>
          <div class="chip" onclick="setPlayers(6)">6</div>
          <div class="chip" onclick="setPlayers(7)">7</div>
          <div class="chip" onclick="setPlayers(8)">8</div>
        </div>

        <div id="qrCode"></div>
        <div class="join-code" id="gameCode">DOM-XXXX</div>

        <div class="players-waiting" id="playersList">Waiting for players...</div>
        <button class="primary" id="startBtn" onclick="startGame()" disabled>Start Game</button>
      </div>

      <div id="joinPanel" class="panel" style="display: none;">
        <label>Enter Game Code</label>
        <input type="text" id="gameCodeInput" placeholder="DOM-ABCD" maxlength="8">
        <button class="primary" id="joinGameBtn" onclick="joinGame()">Join Game</button>
      </div>
    </div>
  </div>

  <div id="gameScreen" class="game-screen hidden">
    <div class="top-bar">
      <div>Current: <span id="currentPlayer">Player 1</span></div>
      <div>Stock: <span id="stockCount">0</span></div>
    </div>
    <div class="board-area"><div id="scoreBoard" class="score-board"></div><div id="board" class="board"></div></div>
    <div class="players-section" id="playersList"></div>
    <div class="hand-area" id="handArea"></div>
    <div class="action-buttons"><button class="draw-btn" onclick="drawDomino()">Draw</button></div>
  </div>
</div>

<script>
const STUN = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun2.l.google.com:19302' }
]};

let gameMode = 'host';
let maxPlayers = 2;
let myName = 'Player';
let gameCode = '';
let peer = null;
let hostConn = null;
let clientConns = new Map();
let isHost = false;
let game = null;
let isJoining = false; // Prevent multiple join attempts

class Dominoes {
  constructor(n) {
    this.players = Array(n).fill(0).map((_, i) => ({ name: `P${i+1}`, hand: [] }));
    this.stock = [];
    this.played = [];
    this.current = 0;

    let all = [];
    for (let i = 0; i <= 6; i++)
      for (let j = i; j <= 6; j++)
        all.push([i, j]);

    for (let p of all) all.sort(() => Math.random() - 0.5);
    for (let p of this.players) {
      for (let i = 0; i < 7; i++) p.hand.push(all.pop());
    }
    this.stock = all;
    this.played.push(this.stock.pop());
  }

  canPlay(d) {
    const l = this.played[0][0], r = this.played[this.played.length-1][1];
    return d[0]===l || d[1]===l || d[0]===r || d[1]===r;
  }

  play(d, p) {
    this.players[p].hand = this.players[p].hand.filter(x => x!==d);
    const l = this.played[0][0], r = this.played[this.played.length-1][1];
    if ((d[0]===l && d[1]!==l) || d[1]===l) this.played.unshift([d[1], d[0]]);
    else if (d[0]===r) this.played.push(d);
    else this.played.push([d[1], d[0]]);
    this.current = (this.current + 1) % this.players.length;
  }

  draw(p) {
    if (this.stock.length > 0) this.players[p].hand.push(this.stock.pop());
    this.current = (this.current + 1) % this.players.length;
  }
}

function setMode(m) {
  gameMode = m;
  document.querySelectorAll('.chip-row .chip').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('hostPanel').style.display = m === 'host' ? 'block' : 'none';
  document.getElementById('joinPanel').style.display = m === 'join' ? 'block' : 'none';
  if (m === 'host') initHost();
}

function setPlayers(n) {
  maxPlayers = n;
  document.querySelectorAll('#hostPanel .chip-row .chip').forEach((c, i) => {
    c.classList.toggle('active', i === n - 2);
  });
}

function initHost() {
  isHost = true;
  gameCode = 'DOM-' + Math.random().toString(36).substr(2, 4).toUpperCase();
  const peerId = gameCode.replace(/-/g, '').toLowerCase();

  if (peer) try { peer.destroy(); } catch(e) {}
  peer = new Peer(peerId, { config: STUN });

  const url = window.location.href.split('?')[0];
  document.getElementById('qrCode').innerHTML = '';
  new QRCode(document.getElementById('qrCode'), `${url}?join=${gameCode}`);
  document.getElementById('gameCode').textContent = gameCode;

  peer.on('connection', conn => {
    clientConns.set(conn.peer, conn);
    console.log('Client joined:', conn.peer);
    updatePlayersList();

    conn.on('data', msg => {
      if (msg.type === 'join') {
        updatePlayersList();
      } else if (msg.type === 'play' && game) {
        game.play(msg.domino, msg.player);
        broadcast({ type: 'update', state: gameState() });
      } else if (msg.type === 'draw' && game) {
        game.draw(msg.player);
        broadcast({ type: 'update', state: gameState() });
      } else if (msg.type === 'kick') {
        // host asked to remove a player
        game.players.splice(msg.idx, 1);
        if (game.current >= msg.idx) game.current = Math.max(0, game.current - 1);
        render();
      }
    });
  });
}

function joinGame() {
  if (isJoining) return;

  const code = document.getElementById('gameCodeInput').value.toUpperCase();
  if (!code || code.length < 3) { alert('Enter code'); return; }

  isJoining = true;
  document.getElementById('joinGameBtn').disabled = true;

  gameCode = code;
  const peerId = code.replace(/-/g, '').toLowerCase();

  if (peer) try { peer.destroy(); } catch(e) {}
  peer = new Peer({ config: STUN });

  peer.on('open', () => {
    console.log('Connecting to', peerId);
    hostConn = peer.connect(peerId);

    hostConn.on('open', () => {
      console.log('Connected!');
      hostConn.send({ type: 'join', name: myName });

      // Show game screen with waiting message
      document.getElementById('setupScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      document.getElementById('boardInner').innerHTML = '<div class="waiting-message">⏳ Waiting for host to start...</div>';

      hostConn.on('data', msg => {
        console.log('Received:', msg.type);
        if (msg.type === 'gameStart') {
          game = new Dominoes(msg.state.players.length);
          loadState(msg.state);
          render();
        } else if (msg.type === 'update') {
          loadState(msg.state);
          render();
        }
      });
    });

    hostConn.on('error', e => {
      console.error('Error:', e);
      isJoining = false;
      document.getElementById('joinGameBtn').disabled = false;
      alert('Connection failed');
    });
  });
}

function startGame() {
  if (!game) {
    game = new Dominoes(maxPlayers);
  }
  console.log('Starting game with', clientConns.size, 'clients');
  broadcast({ type: 'gameStart', state: gameState() });
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  render();
}

function gameState() {
  if (!game) return null;
  return { players: game.players, played: game.played, stock: game.stock, current: game.current };
}

function loadState(s) {
  if (!game) {
    // Initialize a new game with the correct number of players
    game = new Dominoes(s.players.length);
  }
  game.players = s.players;
  game.played = s.played;
  game.stock = s.stock;
  game.current = s.current;
}

function broadcast(msg) {
  for (let conn of clientConns.values()) {
    if (conn.open) conn.send(msg);
  }
}

function playDomino(d) {
  if (!game) return;
  if (!game.canPlay(d)) return;
  if (isHost) {
    game.play(d, 0);
    broadcast({ type: 'update', state: gameState() });
  } else {
    hostConn.send({ type: 'play', domino: d, player: 0 });
  }
  render();
}

function drawDomino() {
  if (!game) return;
  if (isHost) {
    game.draw(0);
    broadcast({ type: 'update', state: gameState() });
  } else {
    hostConn.send({ type: 'draw', player: 0 });
  }
  render();
}

function render() {
  if (!game) return;
  renderBoard();
  renderPlayers();
  renderHand();
  attachBoardEvents();
  document.getElementById('currentPlayer').textContent = game.players[game.current].name;
  document.getElementById('stockCount').textContent = game.stock.length;
  updateScoreBoard();
}

function renderBoard() {
  const html = game.played.map(d => `<div class="domino-played">
    <div class="domino-half-top" data-val="${d[0]}"></div>
    <div class="domino-half-bottom" data-val="${d[1]}"></div>
  </div>`).join('');
  document.getElementById('boardInner').innerHTML = html;
}

function renderPlayers() {
  const html = game.players.map((p, i) => `
    <div class="player-status ${i===game.current?'current':''}">
      ${p.name} (${p.hand.length})
      ${isHost ? `<button class="kick-btn" onclick="kickPlayer(${i})">✖</button>` : ''}
    </div>`).join('');
  document.getElementById('playersList').innerHTML = html;
}

function renderHand() {
  const html = game.players[0].hand.map(d => {
    const can = game.canPlay(d);
    return `<div class="hand-domino" style="opacity:${can?1:0.6}" onclick="${can?`playDomino([${d[0]},${d[1]}])`:''}"
      ><div class="hand-half-top">${'●'.repeat(d[0])}</div><div class="hand-half-bottom">${'●'.repeat(d[1])}</div></div>`;
  }).join('');
  document.getElementById('handArea').innerHTML = html;
}

function updatePlayersList() {
  if (isHost && !game) {
    const html = Array(clientConns.size).fill(0).map((_, i) =>
      `<div class="waiting-player">Player ${i + 2} joined</div>`
    ).join('');
    document.getElementById('playersList').innerHTML = html || 'Waiting for players...';
    document.getElementById('startBtn').disabled = clientConns.size < maxPlayers - 1;
  }
}

// utility functions for sprite handling and drag‑and‑drop
function getSpriteIndex([a,b]) {
  const min = Math.min(a,b);
  const max = Math.max(a,b);
  return min * 7 - (min*(min-1))/2 + (max - min);
}
function spritePos(idx) {
  const col = idx % 7;
  const row = Math.floor(idx / 7);
  const x = -(col * 100/7) + "%";
  const y = -(row * 100/4) + "%";
  return `${x} ${y}`;
}
function dragStart(ev, domino) {
  ev.dataTransfer.setData('application/json', JSON.stringify(domino));
}
function allowDrop(ev) { ev.preventDefault(); }
function dropTile(ev) {
  ev.preventDefault();
  const domino = JSON.parse(ev.dataTransfer.getData('application/json'));
  if (!game.canPlay(domino)) return alert('Illegal move');
  if (isHost) {
    const playerIdx = 0;
    game.play(domino, playerIdx);
    broadcast({type:'play', domino, player:playerIdx});
    render();
    updateScoreBoard();
  } else {
    hostConn.send({type:'play', domino, player:0});
  }
}
function attachBoardEvents() {
  const board = document.getElementById('board');
  board.ondragover = allowDrop;
  board.ondrop = dropTile;
}
function updateScoreBoard() {
  const html = game.players.map(p => `<div>${p.name}: ${p.hand.length} tiles</div>`).join('');
  document.getElementById('scoreBoard').innerHTML = html;
}


document.getElementById('playerName').addEventListener('change', e => myName = e.target.value || 'Player');

const params = new URLSearchParams(window.location.search);
if (params.has('join')) {
  setTimeout(() => {
    document.querySelectorAll('.chip')[1].click();
    document.getElementById('gameCodeInput').value = params.get('join');
  }, 100);
}
</script>
</body>
</html>
