<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Uno · Multiplayer Card Game</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎴</text></svg>">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
:root {
  --gold: #e8b93a;
  --gold-dark: #b8860b;
  --cream: #f2efe6;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, system-ui; background: linear-gradient(160deg, #000, #141414 60%); color: var(--cream); }

#app { width: 100%; min-height: 100vh; display: flex; flex-direction: column; }
.setup-screen { width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
.setup-screen.hidden { display: none; }

.screen { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 14px; margin: auto; }
h1 { font-size: 1.6rem; text-align: center; margin: 0; color: var(--gold); }
.subtitle { text-align: center; opacity: 0.85; font-size: 0.85rem; margin: 0 0 14px 0; }

.panel { width: 100%; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 18px; padding: 16px; }
label { display: block; font-size: 0.85rem; margin-bottom: 6px; opacity: 0.9; }
input[type=text] { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2); font-size: 1rem; background: #1e1e1e; color: var(--cream); }
input[type=text]:focus { border-color: var(--gold); outline: none; }

.chip-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { padding: 8px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); color: var(--cream); font-size: 0.82rem; cursor: pointer; }
.chip.active { background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; border-color: var(--gold); font-weight: 600; }

button.primary { width: 100%; padding: 14px; font-size: 1.02rem; font-weight: 600; border: none; border-radius: 14px; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; cursor: pointer; }
button.primary:disabled { opacity: 0.45; cursor: not-allowed; }

#qrCode { display: flex; justify-content: center; margin: 16px 0; }
.join-code { font-size: 1.8rem; font-weight: bold; color: var(--gold); font-family: monospace; letter-spacing: 2px; margin: 8px 0 16px; text-align: center; }
.players-waiting { background: rgba(0,0,0,.3); border-radius: 12px; padding: 12px; margin: 12px 0; max-height: 120px; overflow-y: auto; min-height: 40px; }
.waiting-player { padding: 8px 12px; background: rgba(255,255,255,.08); border-radius: 8px; margin-bottom: 6px; font-size: 0.9rem; }

.game-screen { width: 100%; min-height: 100vh; display: flex; flex-direction: column; background: linear-gradient(135deg, #1a1f2e 0%, #242b3d 100%); padding: 12px; gap: 12px; overflow-y: auto; }
.game-screen.hidden { display: none; }

.top-bar { display: flex; justify-content: space-between; padding: 12px; background: rgba(255,255,255,.08); border-radius: 10px; font-size: 0.9rem; }
.play-area { min-height: 180px; display: flex; flex-direction: column; gap: 20px; align-items: center; justify-content: center; background: rgba(0,0,0,.3); border-radius: 10px; padding: 20px; overflow-x: auto; }

@media (min-width: 600px) {
  .play-area { flex-direction: row; min-height: 160px; }
}

.pile { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.pile-label { font-size: 0.8rem; opacity: 0.7; font-weight: 600; }

.card-stack { position: relative; width: 90px; height: 130px; cursor: grab; }
.uno-card { position: absolute; width: 90px; height: 130px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2rem; font-weight: 700; box-shadow: 0 8px 16px rgba(0,0,0,.6); border: 1.5px solid rgba(0,0,0,.3); }

.uno-card.red { background: linear-gradient(135deg, #e6261f 0%, #d91e0f 100%); color: #fff; }
.uno-card.blue { background: linear-gradient(135deg, #3d7dd5 0%, #2d5ab5 100%); color: #fff; }
.uno-card.green { background: linear-gradient(135deg, #2eb82e 0%, #1d9d1d 100%); color: #fff; }
.uno-card.yellow { background: linear-gradient(135deg, #f9d423 0%, #f0b500 100%); color: #000; }
.uno-card.black { background: linear-gradient(135deg, #1a1a1a 0%, #000 100%); color: #fff; }

.draw-pile .uno-card:nth-child(1) { z-index: 10; top: 0; left: 0; }
.draw-pile .uno-card:nth-child(2) { z-index: 5; top: 3px; left: 4px; }
.draw-pile .uno-card:nth-child(3) { z-index: 0; top: 6px; left: 8px; }
.draw-pile:hover .uno-card { transform: translateY(-10px); }

.discard-pile .uno-card { z-index: 1; top: 0; left: 0; }

.players-section { min-height: 80px; background: rgba(0,0,0,.3); border-radius: 10px; padding: 12px; display: flex; gap: 8px; overflow-x: auto; flex-wrap: wrap; justify-content: center; }
.player-card { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; min-width: 90px; text-align: center; }
.player-card.current { background: rgba(232,185,58,.15); border-color: var(--gold); font-weight: 600; }

.hand-section { min-height: 130px; background: rgba(0,0,0,.3); border-radius: 10px; padding: 12px; display: flex; gap: 6px; overflow-x: auto; flex-wrap: wrap; align-content: flex-start; padding-bottom: 20px; }

.hand-card { width: 76px; height: 110px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 700; box-shadow: 0 6px 12px rgba(0,0,0,.5); cursor: pointer; border: 1.5px solid rgba(0,0,0,.3); transition: all 0.2s; }
.hand-card:hover:not(.disabled) { transform: translateY(-16px) scale(1.08); }
.hand-card.disabled { opacity: 0.4; cursor: not-allowed; }

.hand-card.red { background: linear-gradient(135deg, #e6261f 0%, #d91e0f 100%); color: #fff; }
.hand-card.blue { background: linear-gradient(135deg, #3d7dd5 0%, #2d5ab5 100%); color: #fff; }
.hand-card.green { background: linear-gradient(135deg, #2eb82e 0%, #1d9d1d 100%); color: #fff; }
.hand-card.yellow { background: linear-gradient(135deg, #f9d423 0%, #f0b500 100%); color: #000; }
.hand-card.black { background: linear-gradient(135deg, #1a1a1a 0%, #000 100%); color: #fff; }

.actions-bar { background: rgba(0,0,0,.3); border-radius: 10px; padding: 12px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.action-btn { padding: 10px 20px; background: linear-gradient(135deg, var(--gold), var(--gold-dark)); color: #000; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
.action-btn:hover { transform: scale(1.05); }

.color-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.8); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
.color-modal.active { display: flex; }
.color-modal-content { background: #141414; border: 2px solid var(--gold); border-radius: 16px; padding: 32px; max-width: 300px; text-align: center; }
.color-modal h2 { margin: 0 0 20px 0; font-size: 1.3rem; }
.color-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.color-btn { padding: 20px; border-radius: 10px; border: 2px solid rgba(0,0,0,.3); font-size: 1.5rem; cursor: pointer; font-weight: 700; }
.color-btn.red { background: linear-gradient(135deg, #e6261f 0%, #d91e0f 100%); color: #fff; }
.color-btn.blue { background: linear-gradient(135deg, #3d7dd5 0%, #2d5ab5 100%); color: #fff; }
.color-btn.green { background: linear-gradient(135deg, #2eb82e 0%, #1d9d1d 100%); color: #fff; }
.color-btn.yellow { background: linear-gradient(135deg, #f9d423 0%, #f0b500 100%); color: #000; }

.waiting-message { text-align: center; color: var(--gold); font-size: 1.2rem; padding: 40px; }
</style>
</head>
<body>

<div id="app">
  <div id="setupScreen" class="setup-screen">
    <div class="screen">
      <h1>🎴 Uno</h1>
      <p class="subtitle">Play with friends on LAN</p>

      <div class="panel">
        <label>Your Name</label>
        <input type="text" id="playerName" placeholder="Enter your name" value="Player">
      </div>

      <div class="panel">
        <label>Game Mode</label>
        <div class="chip-row">
          <div class="chip active" onclick="setMode('host')">Host Game</div>
          <div class="chip" onclick="setMode('join')">Join Game</div>
        </div>
      </div>

      <div id="hostPanel" class="panel">
        <label>Players Needed</label>
        <div class="chip-row">
          <div class="chip active" onclick="setPlayers(2)">2</div>
          <div class="chip" onclick="setPlayers(3)">3</div>
          <div class="chip" onclick="setPlayers(4)">4</div>
          <div class="chip" onclick="setPlayers(5)">5</div>
          <div class="chip" onclick="setPlayers(6)">6</div>
          <div class="chip" onclick="setPlayers(7)">7</div>
          <div class="chip" onclick="setPlayers(8)">8</div>
        </div>

        <div id="qrCode"></div>
        <div class="join-code" id="gameCode">UNO-XXXX</div>

        <div class="players-waiting" id="playersList">Waiting for players...</div>
        <button class="primary" id="startBtn" onclick="startGame()" disabled>Start Game</button>
      </div>

      <div id="joinPanel" class="panel" style="display: none;">
        <label>Enter Game Code</label>
        <input type="text" id="gameCodeInput" placeholder="UNO-ABCD" maxlength="8">
        <button class="primary" id="joinGameBtn" onclick="joinGame()">Join Game</button>
      </div>
    </div>
  </div>

  <div id="gameScreen" class="game-screen hidden">
    <div class="top-bar">
      <div>Current: <span id="currentPlayer">Player 1</span></div>
      <div>Deck: <span id="deckCount">0</span> | Discard: <span id="discardCount">0</span></div>
    </div>

    <div class="play-area">
      <div class="pile">
        <div class="pile-label">Draw Pile</div>
        <div class="card-stack draw-pile" onclick="drawCard()">
          <div class="uno-card black"></div>
          <div class="uno-card black"></div>
          <div class="uno-card black"></div>
        </div>
      </div>

      <div class="pile">
        <div class="pile-label">Discard</div>
        <div class="card-stack discard-pile">
          <div class="uno-card" id="discardCard"></div>
        </div>
      </div>
    </div>

    <div class="players-section" id="playersList"></div>
    <div class="hand-section" id="handSection"></div>

    <div class="actions-bar">
      <button class="action-btn" onclick="drawCard()">Draw Card</button>
    </div>
  </div>
</div>

<div id="colorModal" class="color-modal">
  <div class="color-modal-content">
    <h2>Choose Color</h2>
    <div class="color-buttons">
      <button class="color-btn red" onclick="selectColor('red')"></button>
      <button class="color-btn blue" onclick="selectColor('blue')"></button>
      <button class="color-btn green" onclick="selectColor('green')"></button>
      <button class="color-btn yellow" onclick="selectColor('yellow')"></button>
    </div>
  </div>
</div>

<script>
const STUN = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun2.l.google.com:19302' }
]};

let gameMode = 'host';
let maxPlayers = 2;
let myName = 'Player';
let gameCode = '';
let peer = null;
let hostConn = null;
let clientConns = new Map();
let isHost = false;
let game = null;
let isJoining = false;

const COLORS = ['red', 'blue', 'green', 'yellow'];
const SYM = { skip: '⏭️', reverse: '↩️', draw2: '+2', wild: '🌈', wilddraw4: '+4' };

class Uno {
  constructor(n) {
    this.players = Array(n).fill(0).map((_, i) => ({ name: `P${i+1}`, hand: [] }));
    this.deck = [];
    this.discard = [];
    this.current = 0;

    for (let c of COLORS) {
      this.deck.push({ color: c, value: '0' });
      for (let v of ['1','2','3','4','5','6','7','8','9','skip','reverse','draw2']) {
        this.deck.push({ color: c, value: v });
        this.deck.push({ color: c, value: v });
      }
    }
    for (let i = 0; i < 4; i++) {
      this.deck.push({ color: 'wild', value: 'wild' });
      this.deck.push({ color: 'black', value: 'wilddraw4' });
    }

    for (let p of this.deck) this.deck.sort(() => Math.random() - 0.5);
    for (let p of this.players) {
      for (let i = 0; i < 7; i++) p.hand.push(this.deck.pop());
    }

    do { this.discard.push(this.deck.pop()); } while (this.discard[0].value === 'wild' || this.discard[0].value === 'wilddraw4');
  }

  canPlay(c) {
    const t = this.discard[this.discard.length - 1];
    if (c.value === 'wild' || c.value === 'wilddraw4') return true;
    return c.color === t.color || c.value === t.value;
  }

  play(c, color) {
    const p = this.players[this.current];
    p.hand = p.hand.filter(x => x !== c);
    if (color) c.color = color;
    this.discard.push(c);
    this.current = (this.current + 1) % this.players.length;
  }

  draw(pi) {
    if (this.deck.length === 0) {
      while (this.discard.length > 1) this.deck.push(this.discard.shift());
      for (let p of this.deck) this.deck.sort(() => Math.random() - 0.5);
    }
    if (this.deck.length > 0) this.players[pi].hand.push(this.deck.pop());
    this.current = (this.current + 1) % this.players.length;
  }
}

function setMode(m) {
  gameMode = m;
  document.querySelectorAll('.chip-row .chip').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('hostPanel').style.display = m === 'host' ? 'block' : 'none';
  document.getElementById('joinPanel').style.display = m === 'join' ? 'block' : 'none';
  if (m === 'host') initHost();
}

function setPlayers(n) {
  maxPlayers = n;
  document.querySelectorAll('#hostPanel .chip-row .chip').forEach((c, i) => {
    c.classList.toggle('active', i === n - 2);
  });
}

function initHost() {
  isHost = true;
  gameCode = 'UNO-' + Math.random().toString(36).substr(2, 4).toUpperCase();
  const peerId = gameCode.replace(/-/g, '').toLowerCase();

  if (peer) try { peer.destroy(); } catch(e) {}
  peer = new Peer(peerId, { config: STUN });

  const url = window.location.href.split('?')[0];
  document.getElementById('qrCode').innerHTML = '';
  new QRCode(document.getElementById('qrCode'), `${url}?join=${gameCode}`);
  document.getElementById('gameCode').textContent = gameCode;

  peer.on('connection', conn => {
    clientConns.set(conn.peer, conn);
    console.log('Client joined:', conn.peer);
    updatePlayersList();

    conn.on('data', msg => {
      if (msg.type === 'join') {
        updatePlayersList();
      } else if (msg.type === 'play' && game) {
        game.play(msg.card, msg.color);
        broadcast({ type: 'update', state: getState() });
      } else if (msg.type === 'draw' && game) {
        game.draw(msg.player);
        broadcast({ type: 'update', state: getState() });
      }
    });
  });
}

function joinGame() {
  if (isJoining) return;

  const code = document.getElementById('gameCodeInput').value.toUpperCase();
  if (!code || code.length < 3) { alert('Enter code'); return; }

  isJoining = true;
  document.getElementById('joinGameBtn').disabled = true;

  gameCode = code;
  const peerId = code.replace(/-/g, '').toLowerCase();

  if (peer) try { peer.destroy(); } catch(e) {}
  peer = new Peer({ config: STUN });

  peer.on('open', () => {
    console.log('Connecting to', peerId);
    hostConn = peer.connect(peerId);

    hostConn.on('open', () => {
      console.log('Connected!');
      hostConn.send({ type: 'join', name: myName });

      document.getElementById('setupScreen').classList.add('hidden');
      document.getElementById('gameScreen').classList.remove('hidden');
      document.getElementById('boardInner').innerHTML = '<div class="waiting-message">⏳ Waiting for host to start...</div>';

      hostConn.on('data', msg => {
        console.log('Received:', msg.type);
        if (msg.type === 'gameStart') {
          game = new Uno(msg.state.players.length);
          loadState(msg.state);
          render();
        } else if (msg.type === 'update') {
          loadState(msg.state);
          render();
        }
      });
    });

    hostConn.on('error', e => {
      console.error('Error:', e);
      isJoining = false;
      document.getElementById('joinGameBtn').disabled = false;
      alert('Connection failed');
    });
  });
}

function startGame() {
  if (!game) {
    game = new Uno(maxPlayers);
  }
  console.log('Starting game with', clientConns.size, 'clients');
  broadcast({ type: 'gameStart', state: getState() });
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('gameScreen').classList.remove('hidden');
  render();
}

function getState() {
  if (!game) return null;
  return { players: game.players, deck: game.deck, discard: game.discard, current: game.current };
}

function loadState(s) {
  if (!game) return;
  game.players = s.players;
  game.deck = s.deck;
  game.discard = s.discard;
  game.current = s.current;
}

function broadcast(msg) {
  for (let conn of clientConns.values()) {
    if (conn.open) conn.send(msg);
  }
}

function playCard(c) {
  if (!game || game.current !== 0) return;
  if (!game.canPlay(c)) return;

  if (c.value === 'wild' || c.value === 'wilddraw4') {
    window.pendingCard = c;
    document.getElementById('colorModal').classList.add('active');
  } else {
    if (isHost) {
      game.play(c);
      broadcast({ type: 'update', state: getState() });
    } else {
      hostConn.send({ type: 'play', card: c, color: null });
    }
    render();
  }
}

function selectColor(col) {
  const c = window.pendingCard;
  document.getElementById('colorModal').classList.remove('active');

  if (isHost) {
    game.play(c, col);
    broadcast({ type: 'update', state: getState() });
  } else {
    hostConn.send({ type: 'play', card: c, color: col });
  }
  window.pendingCard = null;
  render();
}

function drawCard() {
  if (!game || game.current !== 0) return;

  if (isHost) {
    game.draw(0);
    broadcast({ type: 'update', state: getState() });
  } else {
    hostConn.send({ type: 'draw', player: 0 });
  }
  render();
}

function render() {
  if (!game) return;

  const t = game.discard[game.discard.length - 1];
  const d = document.getElementById('discardCard');
  d.className = `uno-card ${t.color}`;
  d.textContent = t.value.length > 1 ? SYM[t.value] : t.value;

  const pl = document.getElementById('playersList');
  pl.innerHTML = game.players.map((p, i) => `<div class="player-card ${i === game.current ? 'current' : ''}">${p.name} (${p.hand.length})</div>`).join('');

  const h = document.getElementById('handSection');
  h.innerHTML = game.players[0].hand.map(c => {
    const can = game.canPlay(c);
    return `<div class="hand-card ${c.color} ${can?'':'disabled'}" ${can?`onclick="playCard([${c.color},'${c.value}'])"`:''}>
      ${c.value.length > 1 ? SYM[c.value] : c.value}
    </div>`;
  }).join('');

  document.getElementById('currentPlayer').textContent = game.players[game.current].name;
  document.getElementById('deckCount').textContent = game.deck.length;
  document.getElementById('discardCount').textContent = game.discard.length;
}

function updatePlayersList() {
  if (isHost && !game) {
    const html = Array(clientConns.size).fill(0).map((_, i) =>
      `<div class="waiting-player">Player ${i + 2} joined</div>`
    ).join('');
    document.getElementById('playersList').innerHTML = html || 'Waiting for players...';
    document.getElementById('startBtn').disabled = clientConns.size < maxPlayers - 1;
  }
}

document.getElementById('playerName').addEventListener('change', e => myName = e.target.value || 'Player');

const params = new URLSearchParams(window.location.search);
if (params.has('join')) {
  setTimeout(() => {
    document.querySelectorAll('.chip')[1].click();
    document.getElementById('gameCodeInput').value = params.get('join');
  }, 100);
}
</script>
</body>
</html>
