<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Imposter · Multiplayer Party Game</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕵️</text></svg>">
  <meta name="theme-color" content="#e8b93a">
  <!-- PeerJS for zero-server WebRTC Multiplayer on GitHub Pages -->
  <!-- Loaded with CDN fallbacks (unpkg → jsdelivr → cloudflare) so a blocked CDN can't break the game -->
  <script>
    window.PEER_CDNS = [
      "https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js",
      "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"
    ];
    window.peerJsFailed = false;
    window.peerJsLoaded = (typeof Peer !== "undefined");
    function __loadPeerJS(i) {
      if (i >= window.PEER_CDNS.length) {
        window.peerJsFailed = true;
        return;
      }
      var s = document.createElement("script");
      s.src = window.PEER_CDNS[i];
      s.async = false;
      s.onload = function () {
        window.peerJsLoaded = (typeof Peer !== "undefined");
        if (!window.peerJsLoaded) __loadPeerJS(i + 1);
      };
      s.onerror = function () { __loadPeerJS(i + 1); };
      document.head.appendChild(s);
    }
    // Kick off immediately; the game guards on window.peerJsLoaded before creating peers.
    __loadPeerJS(0);
  </script>
  <!-- QRCode.js for instant LAN join -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --black: #050505;
      --black-soft: #141414;
      --black-softer: #1e1e1e;
      --gold: #e8b93a;
      --gold-dark: #b8860b;
      --cream: #f2efe6;
      --ink: #161616;
      --success: #2ecc71;
      --danger: #e74c3c;
      --cyan: #00d2d3;
      --purple: #9b59b6;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 50% -10%, rgba(232, 185, 58, .12), transparent 55%),
        linear-gradient(160deg, #000000, var(--black-soft) 60%, var(--black-softer));
      color: var(--cream);
      overflow-x: hidden;
      overscroll-behavior-y: contain;
    }

    /* Guarantee the dark theme fills every overscroll / safe-area letterbox zone
     (white bars at the bottom usually come from iOS safe-area or overscroll) */
    html {
      background-color: #050505;
    }

    html,
    body {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    #app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: calc(16px + env(safe-area-inset-top));
      padding-right: 14px;
      padding-bottom: calc(40px + env(safe-area-inset-bottom));
      padding-left: 14px;
    }

    /* Games/menus render into this sub-container, which render() clears each time.
     The chat panel sits NEXT to it (direct child of #app) and is never cleared,
     so a focused input survives every re-render. */
    #screen {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 1.6rem;
      text-align: center;
      margin: 4px 0 2px;
      color: var(--gold);
      text-shadow: 0 0 14px rgba(232, 185, 58, .35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .subtitle {
      text-align: center;
      opacity: .85;
      font-size: .85rem;
      margin-bottom: 14px;
    }

    .screen {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .panel {
      width: 100%;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 18px;
      padding: 16px;
      backdrop-filter: blur(6px);
    }

    label {
      display: block;
      font-size: .85rem;
      margin-bottom: 6px;
      opacity: .9;
    }

    input[type=text],
    input[type=number] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, .2);
      font-size: 1rem;
      background: var(--black-softer);
      color: var(--cream);
      outline: none;
      transition: border-color 0.2s;
    }

    input[type=text]:focus {
      border-color: var(--gold);
    }

    .stepper {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }

    .stepper button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: none;
      font-size: 1.3rem;
      background: var(--gold);
      color: var(--ink);
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .stepper button:active {
      transform: scale(0.92);
    }

    .stepper .value {
      min-width: 60px;
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
    }

    .hint {
      font-size: .78rem;
      opacity: .75;
      text-align: center;
      margin-top: 4px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .chip {
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, .25);
      background: rgba(255, 255, 255, .06);
      color: var(--cream);
      font-size: .82rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip.active {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--ink);
      border-color: var(--gold);
      font-weight: 600;
    }

    .mode-seg {
      cursor: pointer;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .mode-seg:active {
      transform: scale(.98);
    }

    button.primary {
      width: 100%;
      padding: 14px;
      font-size: 1.02rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--ink);
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .3);
      transition: transform 0.15s, filter 0.15s;
    }

    button.primary:active {
      transform: scale(.98);
    }

    button.secondary {
      width: 100%;
      padding: 12px;
      font-size: .95rem;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, .3);
      background: rgba(255, 255, 255, .05);
      color: var(--cream);
      cursor: pointer;
      transition: background 0.2s;
    }

    button.secondary:active {
      background: rgba(255, 255, 255, .12);
    }

    button.accent-btn {
      background: linear-gradient(135deg, var(--cyan), #0984e3);
      color: #fff;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .top-bar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      gap: 6px;
    }

    .top-bar button {
      background: none;
      border: none;
      color: var(--cream);
      opacity: .8;
      font-size: .85rem;
      cursor: pointer;
      padding: 4px 6px;
    }

    .net-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: .75rem;
      background: rgba(0, 0, 0, .4);
      border: 1px solid rgba(255, 255, 255, .15);
    }

    .net-badge.online {
      color: var(--success);
      border-color: var(--success);
    }

    .net-badge.connecting {
      color: var(--gold);
      border-color: var(--gold);
    }

    .net-badge.error {
      color: var(--danger);
      border-color: var(--danger);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .reconnect-btn-top {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: .78rem;
      background: rgba(231, 76, 60, .2);
      border: 1px solid var(--danger);
      color: var(--cream);
      cursor: pointer;
      font-weight: 600;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.6;
      }
    }

    /* Mascot and Title */
    .title-mascot {
      width: 120px;
      height: 120px;
      border-radius: 24px;
      object-fit: cover;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .6), 0 0 24px rgba(232, 185, 58, .3);
      border: 2px solid rgba(232, 185, 58, .4);
      margin: 0 auto 6px;
      display: block;
      transition: transform .2s ease;
    }

    .title-mascot:hover {
      transform: scale(1.04);
    }

    .header-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      object-fit: cover;
      vertical-align: middle;
      border: 1px solid rgba(232, 185, 58, .4);
    }

    .title-heading {
      text-align: center;
      color: var(--gold);
      margin: 2px 0 0;
      font-size: 1.4rem;
    }

    .title-tagline {
      text-align: center;
      opacity: .8;
      font-size: .85rem;
      margin: 0 0 12px;
    }

    /* Room & Lobby styles */
    .room-code-box {
      text-align: center;
      padding: 12px;
      background: rgba(232, 185, 58, .1);
      border: 2px dashed var(--gold);
      border-radius: 14px;
      margin-bottom: 12px;
    }

    .room-code-text {
      font-size: 2rem;
      letter-spacing: 4px;
      font-weight: 900;
      color: var(--gold);
      user-select: all;
    }

    #qrcodeContainer {
      display: flex;
      justify-content: center;
      padding: 10px;
      background: #fff;
      border-radius: 12px;
      margin: 10px auto;
      width: 160px;
      height: 160px;
    }

    #qrcodeContainer img {
      width: 100%;
      height: 100%;
    }

    .player-lobby-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 8px;
      width: 100%;
      margin-top: 10px;
      max-height: 220px;
      overflow-y: auto;
    }

    .player-pill {
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .15);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .85rem;
      position: relative;
      transition: all 0.2s ease;
    }

    .player-pill.is-host {
      border-color: var(--gold);
      background: rgba(232, 185, 58, .15);
    }

    .player-pill.is-me {
      border-color: var(--cyan);
      font-weight: bold;
      background: rgba(0, 210, 211, .12);
    }

    .player-pill.offline {
      opacity: 0.6;
      border-style: dashed;
      border-color: rgba(231, 76, 60, .5);
      background: rgba(231, 76, 60, .06);
    }

    .player-avatar {
      font-size: 1.25rem;
      line-height: 1;
    }

    .player-offline-badge {
      font-size: .68rem;
      color: var(--danger);
      font-weight: bold;
      margin-left: auto;
    }

    .kick-btn {
      position: absolute;
      right: 4px;
      top: 4px;
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: .8rem;
      padding: 2px;
    }

    /* Avatar Picker Styles */
    .avatar-picker-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-select-btn {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      border: 2px solid var(--gold);
      background: rgba(232, 185, 58, .15);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      position: relative;
      transition: transform .15s, background .15s;
      flex-shrink: 0;
      padding: 0;
    }

    .avatar-select-btn:hover {
      transform: scale(1.05);
      background: rgba(232, 185, 58, .25);
    }

    .avatar-edit-badge {
      position: absolute;
      bottom: -3px;
      right: -3px;
      background: var(--gold);
      color: var(--ink);
      font-size: .7rem;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .6);
    }

    .emoji-preset-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin: 12px 0;
      max-height: 210px;
      overflow-y: auto;
      padding: 4px;
    }

    .emoji-item-btn {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, .15);
      background: rgba(255, 255, 255, .05);
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform .12s, border-color .12s, background .12s;
    }

    .emoji-item-btn:hover {
      transform: scale(1.12);
      border-color: var(--gold);
      background: rgba(232, 185, 58, .2);
    }

    .emoji-item-btn.selected {
      border-color: var(--gold);
      background: rgba(232, 185, 58, .35);
      box-shadow: 0 0 10px rgba(232, 185, 58, .4);
    }

    /* 3D Card styles */
    .card-wrap {
      perspective: 900px;
      width: 100%;
      max-width: 320px;
      height: 380px;
      margin: 10px auto;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(.4, .2, .2, 1);
      cursor: pointer;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 22px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .6);
      border: 2px solid rgba(255, 255, 255, .2);
    }

    .face.front {
      background:
        radial-gradient(circle at 50% 30%, rgba(232, 185, 58, .25), transparent 70%),
        linear-gradient(145deg, #1c1c1c, #0a0a0a);
      border-color: var(--gold);
    }

    .face.back {
      background:
        radial-gradient(circle at 50% 30%, rgba(0, 210, 211, .2), transparent 70%),
        linear-gradient(145deg, #141414, #080808);
      transform: rotateY(180deg);
    }

    .card-role-badge {
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, .1);
      margin-bottom: 10px;
    }

    .secret-photo {
      width: 140px;
      height: 140px;
      border-radius: 18px;
      object-fit: cover;
      margin: 10px 0;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .5);
      border: 2px solid rgba(255, 255, 255, .2);
    }

    .big-emoji {
      font-size: 4.5rem;
      margin: 10px 0;
      line-height: 1;
    }

    .secret-word {
      font-size: 1.6rem;
      font-weight: bold;
      color: var(--gold);
      text-align: center;
      margin: 4px 0;
    }

    .secret-category {
      font-size: .85rem;
      opacity: .8;
    }

    /* Timer & Discussion */
    .timer-box {
      font-size: 3.2rem;
      font-weight: bold;
      color: var(--gold);
      text-shadow: 0 0 20px rgba(232, 185, 58, .4);
      text-align: center;
      font-variant-numeric: tabular-nums;
      margin: 8px 0;
    }

    /* Discreet Secret Word Reminder Badge */
    .word-reminder-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .18);
      font-size: .82rem;
      color: var(--cream);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.2s ease;
      margin: 8px auto 0;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
    }

    .word-reminder-box:hover {
      background: rgba(232, 185, 58, .16);
      border-color: var(--gold);
      transform: translateY(-1px);
    }

    .word-reminder-box:active {
      transform: scale(0.97);
    }

    .word-reminder-highlight {
      font-weight: 700;
      color: var(--gold);
    }

    /* Voting ballot */
    .vote-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      margin-top: 8px;
    }

    .vote-card {
      position: relative;
      padding: 12px 14px;
      background: rgba(255, 255, 255, .07);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.15s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .vote-card:active {
      transform: scale(0.98);
    }

    .vote-card.selected {
      border-color: var(--gold);
      background: rgba(232, 185, 58, .22);
      box-shadow: 0 0 16px rgba(232, 185, 58, .4);
    }

    .vote-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      background: rgba(232, 185, 58, .25);
      z-index: 0;
      transition: width 0.3s ease;
    }

    .vote-info {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .vote-count-badge {
      position: relative;
      z-index: 1;
      font-weight: bold;
      font-size: 1.1rem;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .my-vote-tag {
      font-size: .72rem;
      padding: 2px 8px;
      border-radius: 8px;
      background: var(--gold);
      color: var(--ink);
      font-weight: 700;
    }

    /* Vote & Outcome Banners */
    .vote-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 12px;
      font-size: .95rem;
      font-weight: 600;
      text-align: left;
    }

    .vote-banner.correct {
      background: rgba(46, 204, 113, .2);
      border: 1px solid var(--success);
      color: var(--cream);
    }

    .vote-banner.wrong {
      background: rgba(192, 57, 43, .25);
      border: 1px solid var(--danger);
      color: var(--cream);
    }

    .vote-banner.neutral {
      background: rgba(232, 185, 58, .2);
      border: 1px solid var(--gold);
      color: var(--cream);
    }

    .outcome-banner {
      padding: 16px;
      border-radius: 16px;
      text-align: center;
      width: 100%;
      margin-bottom: 10px;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .outcome-banner.success {
      background: rgba(46, 204, 113, .2);
      border: 1px solid var(--success);
      color: #2ecc71;
    }

    .outcome-banner.danger {
      background: rgba(231, 76, 60, .2);
      border: 1px solid var(--danger);
      color: #e74c3c;
    }

    .role-reveal-tag {
      font-size: 1.3rem;
      font-weight: bold;
      margin-top: 6px;
    }

    /* Scorecard & Leaderboard */
    .scorecard-panel {
      width: 100%;
      margin-top: 10px;
    }

    .scorecard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .scorecard-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 4px;
      font-size: .88rem;
    }

    .scorecard-table th {
      text-align: left;
      padding: 6px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, .2);
      color: var(--gold);
      font-size: .75rem;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .scorecard-table td {
      padding: 8px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, .07);
      vertical-align: middle;
    }

    .scorecard-row.is-me {
      background: rgba(0, 210, 211, .1);
      font-weight: 600;
    }

    .score-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 10px;

      line-height: 1;

      padding: 0;
      transition: all 0.15s ease;

    .modal-close-btn:hover {
      background: rgba(231, 76, 60, .25);
      border-color: var(--danger);
      color: #ff7675;
      transform: scale(1.08);
    }

    .modal-close-btn:active {
      transform: scale(0.92);
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--gold);
      cursor: pointer;
      font-family: inherit;
      padding: 4px 8px;
      border-radius: 8px;

    .link-btn:hover {

    .score-btn-top {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: .78rem;
      background: rgba(232, 185, 58, .15);
      border: 1px solid var(--gold);
      color: var(--gold);
      cursor: pointer;
      font-weight: 600;
    }

    footer {
      margin-top: 20px;
      opacity: .55;
      font-size: .72rem;
      text-align: center;
    }

    /* ===== CHAT & VOICE ===== */
    .chat-box {
      width: 100%;
      max-width: 440px;
      margin-top: 14px;
      background: rgba(0, 0, 0, .35);
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 16px;
      overflow: hidden;
    }

    .chat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, .05);
      border-bottom: 1px solid rgba(255, 255, 255, .1);
    }

    .chat-head .chat-title {
      font-weight: 700;
      font-size: .85rem;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
    }

    .chat-voice-toggle {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 10px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, .25);
      background: rgba(255, 255, 255, .06);
      color: var(--cream);
      font-size: .78rem;
      cursor: pointer;
      transition: background .2s, border-color .2s;
      white-space: nowrap;
    }

    .chat-voice-toggle.on {
      background: linear-gradient(135deg, var(--cyan), #0984e3);
      color: #fff;
      border-color: var(--cyan);
    }

    .chat-voice-toggle:active {
      transform: scale(.96);
    }

    .chat-voice-toggle.speaker {
      background: none;
      border: none;
      font-size: 1.05rem;
      opacity: .85;
      padding: 4px 6px;
      min-width: 34px;
    }

    .voice-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 12px 4px;
    }

    .voice-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 9px;
      border-radius: 16px;
      font-size: .76rem;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .14);
      color: var(--cream);
    }

    .voice-chip.mic-on {
      border-color: var(--success);
      color: var(--success);
    }

    .voice-chip.speaking {
      border-color: var(--danger);
      color: var(--danger);
      box-shadow: 0 0 8px rgba(231, 76, 60, .4);
    }

    .voice-chip .speak-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--danger);
      animation: pulse .7s infinite;
    }

    .chat-msgs {
      max-height: 190px;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 10px 12px 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .chat-msgs,
    .chat-admin-players,
    .voice-chips {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .chat-msgs::-webkit-scrollbar,
    .chat-admin-players::-webkit-scrollbar,
    .voice-chips::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    .chat-msg {
      display: flex;
      align-items: flex-start;
      gap: 7px;
      font-size: .84rem;
      line-height: 1.35;
      animation: fadeIn .18s ease-out;
    }

    .chat-msg .chat-avatar {
      flex: 0 0 26px;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, .08);
      border-radius: 50%;
      font-size: 1rem;

    .chat-msg .chat-body {
      flex: 1;
      min-width: 0;

    .chat-msg .chat-name {
      font-weight: 700;
      font-size: .76rem;
      opacity: .85;

      overflow-wrap: break-word;
    }

    .chat-msg.sys .chat-text {
      opacity: .75;
      font-style: italic;
    }

    .chat-empty {
      text-align: center;
      opacity: .6;
      font-size: .78rem;
      padding: 8px 0;
    }

      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid rgba(255, 255, 255, .1);
    }

    .chat-input-row input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, .2);

      color: var(--cream);
      font-size: .9rem;
      outline: none;

      border-radius: 12px;

      font-weight: 700;
      font-size: .9rem;
      cursor: pointer;
    }

    .chat-input-row button:active {
      transform: scale(.96);
    }

    .chat-notice {

      font-size: .76rem;
      opacity: .85;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, .08);

      opacity: 1;
      border: 1px solid rgba(232, 185, 58, .3);
      border-radius: 12px;
      margin-top: 8px;
    }

    .chat-box.docked {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 440px;
      z-index: 60;
      background: rgba(8, 8, 8, .97);
      box-shadow: 0 -8px 30px rgba(0, 0, 0, .65);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .chat-box.docked .chat-msgs {

      min-height: 70px;
    }

      max-height: 12vh;
      overflow-y: auto;
    }

      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .chat-voice-toggle.off {
      background: rgba(255, 255, 255, .06);
      border-color: rgba(255, 255, 255, .25);
      color: var(--cream);
    }

    .chat-admin {
      padding: 6px 10px 8px;
      border-top: 1px solid rgba(255, 255, 255, .1);
      background: rgba(9, 132, 227, .08);
    }

    .chat-admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .chat-admin-title {
      font-size: .68rem;
      opacity: .7;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--cyan);
      margin: 0;
    }

    .chat-admin-toggle {
      font-size: .9rem;
      background: none;
      border: none;
      color: var(--cyan);
      opacity: .8;
      cursor: pointer;
      padding: 0 4px;
    }

    .chat-admin-toggle:active {
      transform: scale(.9);
    }

    .chat-admin-inner {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-admin-inner.closed {
      display: none;
    }

    .chat-admin-actions {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .chat-admin-actions button {
      padding: 4px 8px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, .2);
      background: rgba(255, 255, 255, .05);
      color: var(--cream);
      font-size: .7rem;
      cursor: pointer;
    }

    .chat-admin-actions button:active {
      transform: scale(.94);
      background: rgba(255, 255, 255, .12);
    }

    .chat-admin-actions button.red {
      border-color: var(--danger);
      color: var(--danger);
    }

    .chat-admin-players {
      max-height: 90px;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .chat-admin-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: .76rem;
    }

    .chat-admin-row .nm {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      opacity: .9;
    }

    .chat-admin-row button {
      border: none;
      background: rgba(255, 255, 255, .07);
      color: var(--cream);
      border-radius: 8px;
      font-size: .85rem;
      padding: 3px 6px;
      cursor: pointer;
      line-height: 1;
    }

    .chat-admin-row button.on {
      background: var(--danger);
    }

    .chat-admin-row button.offok {
      background: var(--success);
    }

    .chat-admin-row button:active {
      transform: scale(.9);
    }

    /* Keep the focused input visually stable when the IME suggestion bar appears */
    .chat-input-row input {
      -webkit-text-security: none !important;
    }

</head>

      // Sound Synth (Web Audio API)
      const audioCtx = (window.AudioContext || window.webkitAudioContext) ? new (window.AudioContext || window.webkitAudioContext)() : null;
      function playBeep(freq, type, dur) {
        if (!audioCtx) return;
        try {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq || 440, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + (dur || 0.15));
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(); osc.stop(audioCtx.currentTime + (dur || 0.15));
        } catch (e) { }
      }
      function vibrate(ms) {

      // ==========================================

      function el(tag, attrs, children) {
        const e = document.createElement(tag);
        if (attrs) for (const k in attrs) {
          if (k === "class") e.className = attrs[k];
          else if (k === "html") e.innerHTML = attrs[k];
          else if (k === "disabled") {
            if (attrs[k]) {
              e.setAttribute("disabled", "disabled");
              e.disabled = true;
            } else {
              e.removeAttribute("disabled");
              e.disabled = false;
            }
          }
          else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
          else e.setAttribute(k, attrs[k]);
        }
        (children || []).forEach(c => { if (c) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
        return e;
      }

      function generateRoomCode() {
        const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

        return code;

        return [];

      function saveUsedWord(word) {
        try {
          let used = getUsedWords();
          used = used.filter(w => w !== word);
          used.push(word);
          if (used.length > 70) used = used.slice(used.length - 70);
          localStorage.setItem(USED_WORDS_STORAGE_KEY, JSON.stringify(used));
        } catch (e) { }
      }

      function getRandomInt(min, max) {
        if (min >= max) return min;
        if (window.crypto && window.crypto.getRandomValues) {
          const arr = new Uint32Array(1);
          window.crypto.getRandomValues(arr);
          return min + (arr[0] % (max - min));
        }
        return min + Math.floor(Math.random() * (max - min));
      }

        const usedSet = new Set(used);

        // Filter candidate words from pool that have not been played recently
        let candidates = pool.filter(w => !usedSet.has(w.word));

        // If pool has run out of unplayed words, prune history so words cycle fresh
        if (candidates.length < Math.min(8, Math.max(2, Math.floor(pool.length / 2)))) {
          const trimmed = used.slice(-10);
          try { localStorage.setItem(USED_WORDS_STORAGE_KEY, JSON.stringify(trimmed)); } catch (e) { }
          const trimmedSet = new Set(trimmed);
          candidates = pool.filter(w => !trimmedSet.has(w.word));
          if (candidates.length === 0) candidates = pool;
        }

        // Pick secret word with high entropy
        const secretIndex = getRandomInt(0, candidates.length);
        const secret = candidates[secretIndex];

        // Pick decoy word from the same category that is distinct from secret
        const sameCatWords = WORDS.filter(w => w.cat === secret.cat && w.word !== secret.word);
        let decoyCandidates = sameCatWords.filter(w => !usedSet.has(w.word));
        if (decoyCandidates.length === 0) decoyCandidates = sameCatWords;

        const decoy = decoyCandidates.length > 0
          ? decoyCandidates[getRandomInt(0, decoyCandidates.length)]
          : secret;

        saveUsedWord(secret.word);
        saveUsedWord(decoy.word);

        return { secret, decoy };
      }

      function fetchWikipediaThumbnail(word, callback) {
        try {
          const controller = (typeof AbortController !== 'undefined') ? new AbortController() : null;
          const timeoutId = controller ? setTimeout(() => controller.abort(), 3500) : null;
          fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(word), controller ? { signal: controller.signal } : {})
            .then(r => r.ok ? r.json() : null)
            .then(d => {
              if (timeoutId) clearTimeout(timeoutId);
              if (d && d.thumbnail && d.thumbnail.source) callback(d.thumbnail.source);
              else callback(null);
            }).catch(() => {
              if (timeoutId) clearTimeout(timeoutId);
              callback(null);
            });
        } catch (e) { callback(null); }
      }

      // ==========================================
      // INTERNET (RELAY) TRANSPORT
      // Replaces PeerJS for internet mode: game data + chat + voice ride a single
      // WebSocket to a tiny relay server (server/relay.js), so no TURN is needed.
      // Works from any network. LAN mode keeps PeerJS.
      // ==========================================

      // 📍 Deploy server/relay.js (npm install ws && node relay.js) on Render/Railway/Fly/Glitch
      // and paste the wss:// URL here — or override per-session with  ?relay=wss://...
      const RELAY_URL = new URLSearchParams(window.location.search).get("relay") || "wss://imposter-relay.onrender.com";

      let relayWs = null;            // my single WebSocket to the relay
      let relayHostId = null;        // playerId of the current host (guests route "to" here)
      let relayVoiceConnected = false;

      function relaySendTo(targetId, payload){
        if (relayWs && relayWs.readyState === WebSocket.OPEN){
          try { relayWs.send(JSON.stringify({ p: payload, to: targetId })); } catch(e){}
        }
      }
      function relayBroadcast(payload){
        if (relayWs && relayWs.readyState === WebSocket.OPEN){
          try { relayWs.send(JSON.stringify({ p: payload })); } catch(e){}
        }
      }

      // A lightweight DataConnection-shaped object so ALL existing code that uses
      // hostConn / clientConns works unchanged. kind: "guest" (sends to relayHostId)
      // or "targ" (sends to a specific player).
      function makeRelayConn(peer, kind){
        const rc = {
          peer: peer,
          open: false,
          kind: kind,
          _cbs: {},
          send(payload){
            if (kind === "guest") relaySendTo(relayHostId, payload);
            else relaySendTo(peer, payload);
          },
          on(ev, fn){ (rc._cbs[ev] = rc._cbs[ev] || []).push(fn); return rc; },
          emit(ev){
            const arr = rc._cbs[ev] || [];
            const args = Array.prototype.slice.call(arguments, 1);
            arr.forEach(fn => { try { fn.apply(null, args); } catch(e){} });
          },
          close(){ rc.emit("close"); }
        };
        rc._markOpen = function(){ rc.open = true; rc.emit("open"); };
        return rc;
      }

      function teardownRelay(){
        relayVoiceChunks = {};
        relayVoiceConnected = false;
        if (relayWs){
          try { relayWs.onclose = null; relayWs.onmessage = null; relayWs.close(); } catch(e){}
        }
        relayWs = null;
        relayHostId = null;
        stopRelayVoice();
      }

      // Open a WS and register into a room.
      function openRelaySession(room, playerId, role, cbs){
        try { if (relayWs) { relayWs.onclose = null; try { relayWs.close(); } catch(e){} relayWs = null; } } catch(e){}
        let ws;
        try {
          ws = new WebSocket(RELAY_URL);
        } catch(e){
          netDiag("WebSocket constructor failed: " + (e && e.message));
          if (cbs.onError) cbs.onError("WebSocket unsupported");
          return null;
        }
        relayWs = ws;
        let tried = false;
        ws.onopen = () => {
          netDiag((role === "host" ? "Host" : "Client") + " relay socket open → " + RELAY_URL);
          try { ws.send(JSON.stringify({ type: "relay_join", room: room, playerId: playerId, role: role })); } catch(e){}
        };
        ws.onmessage = (ev) => {
          if (typeof ev.data === "string"){
            let m;
            try { m = JSON.parse(ev.data); } catch(e){ return; }
            if (m.type === "relay_hello") return;
            if (m.type === "relay_ok"){
              relayVoiceConnected = true;
              if (!tried){ tried = true; cbs.onOpen && cbs.onOpen(m); }
              return;
            }
            if (m.type === "relay_peers"){
              const host = (m.peers || []).find(x => x.role === "host");
              if (host) relayHostId = host.playerId;
              cbs.onPeers && cbs.onPeers(m.peers || []);
              return;
            }
            if (m.type === "relay_err"){
              netDiag("Relay error: " + (m.error || ""));
              if (cbs.onError) cbs.onError(m.error);
              return;
            }
            const payload = (m && "p" in m) ? m.p : m;
            if (payload && payload.type === "relay_peer"){
              if (cbs.onPeer) cbs.onPeer(payload, m.from);
              return;
            }
            if (cbs.onData) cbs.onData(payload, m.from);
            return;
          }
          // binary audio frame → [2-byte len][playerId][Int16 PCM]
          if (cbs.onBinary){
            try {
              const buf = ev.data instanceof ArrayBuffer ? ev.data : (typeof ev.data === "object" && ev.data) ? ev.data : null;
              cbs.onBinary(buf);
            } catch(e){}
          }
        };
        ws.onclose = () => {
          netDiag("Relay socket closed");
          relayVoiceConnected = false;
          if (cbs.onClose) cbs.onClose();
        };
        ws.onerror = () => {
          netDiag("Relay socket error — check that " + RELAY_URL + " is reachable");
          if (cbs.onError) cbs.onError("relay websocket error");
        };
        return ws;
      }

      // ---------- Host (internet mode) ----------
      function initInternetHost(){
        roomCode = generateRoomCode();
        myPlayerId = getOrCreatePersistentPlayerId();
        isHost = true;
        netStatus = "connecting";
        netStatusMsg = "Connecting to relay (" + RELAY_URL.replace(/^wss?:\/\//, "") + ")…";
        pushInGameState();
        render();

        const hostPlayerId = myPlayerId;
        const onData = (payload, from) => {
          if (!from || from === hostPlayerId) return;
          if (payload && payload.type === "relay_peer"){
            handleRelayPeerHost(payload);
            return;
          }
          let conn = clientConns.get(from);
          if (!conn){
            conn = makeRelayConn(from, "targ");
            conn._markOpen();
            clientConns.set(from, conn);
          }
          handleHostReceivedData(from, payload, conn);
        };
        const onClose = () => {
          if (appMode !== "multiplayer" || !isHost) return;
          netStatus = "connecting";
          netStatusMsg = "Relay connection lost — reconnecting…";
          render();
          setTimeout(() => {
            if (appMode === "multiplayer" && isHost && roomCode && !relayWs){
              setupInner();
            }
          }, 1500);
        };
        const setupInner = () => {
          openRelaySession(roomCode, hostPlayerId, "host", {
            onOpen: () => {
              netStatus = "connected";
              netStatusMsg = "Room Live! (relay)";
              gameState.players = [{
                id: myPlayerId, connId: "host", name: (myPlayerName || "Host").trim(), avatar: myAvatar,
                isHost: true, online: true, ready: false, alive: true, votesReceived: 0,
                score: 0, roundsSurvived: 0, gamesWon: 0, joinedAt: Date.now()
              }];
              startHeartbeat();
              addSystemChat("Internet room " + roomCode + " is live!");
              // Start relay voice for host
              setupRelayVoice();
              render();
            },
            onData: onData,
            onClose: onClose,
            onPeer: handleRelayPeerHost,
            onPeers: (peers) => {},
            onBinary: (buf) => {
              const parsed = parseRelayAudio(buf);
              if (parsed) {
                netDiag("Audio frame from " + parsed.playerId + " (" + parsed.pcm.length + " samples)");
                queueRelayAudio(parsed.playerId, parsed.pcm);
              }
            },
            onError: (e) => { netDiag("Host relay error: " + e); }
          });
        };
        setupInner();
      }

      // Host-side relay roster bookkeeping: track connected players so the lobby
      // reflects reality even before the JOIN handshake completes.
      function handleRelayPeerHost(p){
        if (!isHost) return;
        if (p.action === "join"){
          let conn = clientConns.get(p.playerId);
          if (!conn){
            conn = makeRelayConn(p.playerId, "targ");
            conn._markOpen();
            clientConns.set(p.playerId, conn);
          }
          const pl = gameState.players.find(x => x.id === p.playerId);
          if (pl && pl.online === false){
            pl.online = true;
            broadcastGameState();
            render();
          }
        } else if (p.action === "leave"){
          clientConns.delete(p.playerId);
          const pl = gameState.players.find(x => x.id === p.playerId);
          if (pl){
            pl.online = false;
            pl.connId = null;
            broadcastGameState();
            render();
          }
        }
      }

      // ---------- Client (internet mode) ----------
      function initInternetClient(joinCode){
        roomCode = joinCode.toUpperCase().trim();
        myPlayerId = getOrCreatePersistentPlayerId();
        isHost = false;
        isInternetMode = true;
        netStatus = "connecting";
        netStatusMsg = "Connecting to relay (" + RELAY_URL.replace(/^wss?:\/\//, "") + ")…";
        pushInGameState();
        render();

        const guestId = myPlayerId;
        const onData = (payload, from) => {
          if (payload && payload.type === "relay_peer"){
            handleRelayPeerGuest(payload);
            return;
          }
          handleClientReceivedData(payload);
        };
        const onClose = () => {
          if (appMode !== "multiplayer" || isHost || !roomCode) return;
          netStatus = "connecting";
          netStatusMsg = "Relay connection lost — reconnecting…";
          render();
          triggerClientAutoReconnect();
        };
        const setupInner = () => {
          openRelaySession(roomCode, guestId, "guest", {
            onOpen: () => {
              netStatus = "connected";
              netStatusMsg = "Connected to relay!";
              reconnectAttempts = 0;
              if (reconnectTimer){ clearTimeout(reconnectTimer); reconnectTimer = null; }
              startClientHeartbeat();
              if (!hostConn){ hostConn = makeRelayConn(relayHostId || "host", "guest"); }
              hostConn._markOpen();
              hostConn.send({
                type: "JOIN",
                id: myPlayerId,
                name: (myPlayerName || "Player").trim(),
                avatar: myAvatar
              });
              // Start relay voice for client
              setupRelayVoice();
              render();
            },
            onData: onData,
            onClose: onClose,
            onPeers: (peers) => {
              const host = peers.find(x => x.role === "host");
              if (host) relayHostId = host.playerId;
            },
            onPeer: handleRelayPeerGuest,
            onBinary: (buf) => {
              const parsed = parseRelayAudio(buf);
              if (parsed) {
                netDiag("Audio frame from " + parsed.playerId + " (" + parsed.pcm.length + " samples)");
                queueRelayAudio(parsed.playerId, parsed.pcm);
              }
            },
            onError: (e) => {
              netStatus = "error";
              netStatusMsg = "Cannot reach relay (" + RELAY_URL.replace(/^wss?:\/\//, "") + "). Launch server/relay.js and set RELAY_URL.";
              render();
              triggerClientAutoReconnect();
            }
          });
        };
        setupInner();
      }

      // Guest: react to relay peer changes (mainly host leaving → migration)
      function handleRelayPeerGuest(p){
        if (isHost) return;
        if (p.action === "leave" && p.playerId === relayHostId && !hostMigrationInProgress){
          netDiag("Host left the relay — starting migration election");
          if (heartbeatInterval){ clearInterval(heartbeatInterval); heartbeatInterval = null; }
          triggerHostMigrationElection();
        }
      }

      // Override election for relay mode: become host over the relay (no PeerJS)
      function becomeRelayHost(){
        netStatus = "connecting";
        netStatusMsg = "Becoming new host…";
        render();
        isHost = true;
        hostMigrationInProgress = false;
        reconnectAttempts = 0;
        relayHostId = myPlayerId;
        if (heartbeatInterval){ clearInterval(heartbeatInterval); heartbeatInterval = null; }

        // Re-crown: me host, everyone else guest (mirrors becomeHost() for PeerJS)
        gameState.players.forEach(p => { p.isHost = (p.id === myPlayerId); if (p.isHost) p.connId = "host"; });
        if (!gameState.players.find(p => p.id === myPlayerId)){
          gameState.players.push({ id: myPlayerId, connId: "host", name: (myPlayerName || "Host").trim(), avatar: myAvatar, isHost: true, online: true, ready: false, alive: true, votesReceived: 0, score: 0, roundsSurvived: 0, gamesWon: 0, joinedAt: Date.now() });
        }
        clientConns = new Map();

        netStatus = "connected";
        netStatusMsg = "You are now the host!";
        relayBroadcast({ type: "HOST_MIGRATION", newHostId: myPlayerId, gameState: gameState });
        relayBroadcast({ type: "STATE_SYNC", state: gameState });
        startHeartbeat();
        addSystemChat("Host migrated! The game continues.");
        render();
      }

      function initHostRoom(opts) {
        opts = opts || {};
        isHost = true;
        isInternetMode = (opts.mode === "internet");
        if (isInternetMode){
          return initInternetHost();
        }
        roomCode = generateRoomCode();
        myPlayerId = getOrCreatePersistentPlayerId();
        netStatus = "connecting";
        netStatusMsg = "Setting up LAN room...";
        pushInGameState();
        render();

        const peerId = "imposter-p2p-" + roomCode.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();

        netDiag("Creating host peer (lan/STUN) id=" + peerId);
        if (!peerReady()) {
          netStatus = "error";
          netStatusMsg = "PeerJS not loaded (" + (window.peerJsFailed ? "all CDNs failed" : "still loading...") + "). Reload after a few seconds.";
          render();
          return;
        }
        if (peer) { try { peer.destroy(); } catch (e) { } }
        peer = new Peer(peerId, getPeerOpts("lan"));

        peer.on('open', (id) => {
          netDiag("Host peer OPENED — connected to signaling broker, id=" + id);
          netStatus = "connected";
          netStatusMsg = "Room Live!";
          gameState.players = [{
            id: myPlayerId,
            connId: "host",
            name: (myPlayerName || "Host").trim(),
            avatar: myAvatar,
            isHost: true,
            online: true,
            ready: false,
            alive: true,
            votesReceived: 0,
            score: 0,
            roundsSurvived: 0,
            gamesWon: 0,
            joinedAt: Date.now()
          }];
          startHeartbeat();
          addSystemChat("Room " + roomCode + " is live! Invite friends with the room code or QR.");
          render();
        });

        peer.on('connection', (conn) => {
          clientConns.set(conn.peer, conn);
          netDiag("Incoming connection from " + conn.peer + " (ICE: " + (conn.peerConnection ? conn.peerConnection.iceConnectionState : "?") + ")");

          conn.on('data', (data) => {
            handleHostReceivedData(conn.peer, data, conn);
          });

          conn.on('open', () => {
            netDiag("DataConnection OPENED from " + conn.peer);
            clientConns.set(conn.peer, conn);
          });

          conn.on('close', () => {
            netDiag("DataConnection closed: " + conn.peer);
            clientConns.delete(conn.peer);
            // Mark player as offline, but preserve their score, role, alive status & voting history
            const p = gameState.players.find(x => x.connId === conn.peer);
            if (p) {
              p.online = false;
              p.connId = null;
              broadcastGameState();
              render();
            }
          });

          conn.on('error', (err) => {
            netDiag("Conn error from " + conn.peer + ": " + (err && (err.type || err.message || err)));
            console.warn("Host connection error with peer:", conn.peer, err);
          });
          if (conn.peerConnection) {
            const rtc = conn.peerConnection;
            rtc.oniceconnectionstatechange = () => {
              netDiag("Host ICE state (" + conn.peer + "): " + (rtc ? rtc.iceConnectionState : "disposed"));
            };
            rtc.onicecandidate = (ev) => {
              if (ev.candidate && ev.candidate.candidate) {
                const c = ev.candidate;
                const src = (c.url && c.url.includes("turn")) ? c.url.split("/")[2] || "turn" : (c.url && c.url.includes("stun")) ? "stun" : "host";
                netDiag("Candidate (" + conn.peer + "): type=" + (c.type || "?") + " src=" + src + " proto=" + (c.protocol || "?"));
              }
            };
          }
        });

        peer.on('call', (call) => {
          // Inbound WebRTC audio: answer, then play the caller's stream
          voiceCallMine[call.peer] = false;
          voiceCallAnsweredLive[call.peer] = !!voiceStream;
          registerVoiceCall(call.peer, call);
          try { call.answer(voiceStream || new MediaStream()); } catch (e) { }
        });

        peer.on('disconnected', () => {
          // Host: try reconnecting a few times, then end game
          netDiag("Host peer DISCONNECTED from broker — attempting reconnect");
          if (peer && !peer.destroyed) {
            netStatus = "connecting";
            netStatusMsg = "Host connection lost — reconnecting...";
            render();
            let attempts = 0;
            const tryReconnect = () => {
              attempts++;
              if (attempts > 5 || !peer || peer.destroyed) {
                netStatus = "error";
                netStatusMsg = "Host connection lost — game over.";
                render();
                return;
              }
              try { peer.reconnect(); } catch (e) { }
              setTimeout(tryReconnect, 2000);
            };
            tryReconnect();
          }
        });

        peer.on('error', (err) => {
          netDiag("Host peer ERROR: " + (err.type || "") + " " + (err.message || ""));
          // If another peer took our host ID (host migration happened while we were offline),
          // gracefully downgrade to a client and rejoin the same room.
          if (err.type === "unavailable-id") {
            netStatus = "connecting";
            netStatusMsg = "Host role moved — rejoining as player...";
            render();
            becomeClientAndRejoin();
            return;
          }
          netStatus = "error";
          netStatusMsg = "Room error: " + (err.message || err.type);
          render();
        });
      }

      // Old host lost its canonical peer ID — rejoin the room as a normal client
      function becomeClientAndRejoin() {
        isHost = false;
        hostMigrationInProgress = true;
        migrationReconnectElected = electNewHost() || { id: "host", connId: "host" };
        if (peer) { try { peer.destroy(); } catch (e) { } }
        connectToNewHost(migrationReconnectElected);
      }

      function initClientJoin(targetCode, opts) {
        opts = opts || {};
        isHost = false;
        isInternetMode = (opts.mode === "internet");
        if (isInternetMode){
          return initInternetClient(targetCode.toUpperCase().trim());
        }
        roomCode = targetCode.toUpperCase().trim();
        myPlayerId = getOrCreatePersistentPlayerId();
        netStatus = "connecting";
        netStatusMsg = "Connecting to LAN room " + roomCode + "...";
        pushInGameState();
        render();

        netDiag("Joining room " + roomCode + " as lan/STUN");
        if (!peerReady()) {
          netStatus = "error";
          netStatusMsg = "PeerJS not loaded (" + (window.peerJsFailed ? "all CDNs failed" : "still loading...") + "). Reload after a few seconds.";
          render();
          return;
        }
        if (peer) { try { peer.destroy(); } catch (e) { } }
        peer = new Peer(null, getPeerOpts(isInternetMode ? "internet" : "lan"));

        peer.on('open', (id) => {
          netDiag("Client peer OPENED (signaling ok), connecting to host...");
          connectToHost();
        });

        peer.on('call', (call) => {
          // Inbound WebRTC audio: answer, then play the caller's stream
          voiceCallMine[call.peer] = false;
          voiceCallAnsweredLive[call.peer] = !!voiceStream;
          registerVoiceCall(call.peer, call);
          try { call.answer(voiceStream || new MediaStream()); } catch (e) { }
        });

        peer.on('disconnected', () => {
          netDiag("Client peer DISCONNECTED from broker — reconnecting");
          if (peer && !peer.destroyed) {
            try { peer.reconnect(); } catch (e) { }
          }
        });

        peer.on('error', (err) => {
          netDiag("Client peer ERROR: " + (err.type || "") + " " + (err.message || ""));
          netStatus = "error";
          netStatusMsg = "Connection error: " + (err.message || err.type);
          render();
          triggerClientAutoReconnect();
        });
      }

      function connectToHost() {
        const targetPeerId = "imposter-p2p-" + roomCode.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
        if (hostConn) { try { hostConn.close(); } catch (e) { } }
        netDiag("Dialing host " + targetPeerId);

        hostConn = peer.connect(targetPeerId, { reliable: true });
        if (hostConn.peerConnection) {
          hostConn.peerConnection.oniceconnectionstatechange = () => {
            netDiag("Client ICE state: " + (hostConn.peerConnection ? hostConn.peerConnection.iceConnectionState : "disposed"));
          };
        }

        hostConn.on('open', () => {
          netDiag("DataConnection OPENED to host — sending JOIN");
          netStatus = "connected";
          netStatusMsg = "Connected!";
          reconnectAttempts = 0;
          if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }

          // Send join handshake with persistent identity
          hostConn.send({
            type: "JOIN",
            id: myPlayerId,
            name: (myPlayerName || "Player").trim(),
            avatar: myAvatar
          });
          render();
        });

        hostConn.on('data', (data) => {
          handleClientReceivedData(data);
        });

        hostConn.on('close', () => {
          netDiag("DataConnection to host closed");
          netStatus = "connecting";
          netStatusMsg = "Connection lost. Reconnecting...";
          render();
          triggerClientAutoReconnect();
        });

        hostConn.on('error', (err) => {
          netDiag("DataConnection to host ERROR: " + (err && (err.type || err.message || err)));
          triggerClientAutoReconnect();
        });
      }

      function triggerClientAutoReconnect() {
        if (appMode !== "multiplayer" || isHost || !roomCode) return;
        if (reconnectTimer) return;

        reconnectAttempts++;
        if (reconnectAttempts > 5 && !hostMigrationInProgress) {
          if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
          if (gameState.players.length > 0) {
            // Too many reconnection failures — host is likely dead, trigger migration
            triggerHostMigrationElection();
          } else {
            // We never successfully joined — host unreachable (usually mode mismatch on NAT)
            netStatus = "error";
            netStatusMsg = "Can't reach the host. Make sure LAN/Internet mode matches the room, then try again.";
            render();
          }
          return;
        }
        if (reconnectAttempts > 25) {
          netStatus = "error";
          netStatusMsg = "Disconnected from room " + roomCode;
          render();
          return;
        }

        netStatus = "connecting";
        netStatusMsg = hostMigrationInProgress
          ? "Connecting to new host (attempt " + reconnectAttempts + ")..."
          : "Reconnecting to Host (attempt " + reconnectAttempts + ")...";
        render();

        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          if (appMode === "multiplayer" && !isHost && roomCode) {
            if (hostMigrationInProgress && migrationReconnectElected) {
              // During migration: keep trying the new host
              connectToNewHost(migrationReconnectElected);
            } else if (peer && !peer.destroyed && peer.open) {
              connectToHost();
            } else {
              initClientJoin(roomCode);
            }
          }
        }, Math.min(2500, 1000 + reconnectAttempts * 200));
      }

      // ==========================================
      // HOST MIGRATION — when host drops, surviving clients elect a new one
      // ==========================================

      // Deterministic election: earliest joinedAt wins (then lowest playerId as tiebreak)
      function electNewHost() {
        const candidates = gameState.players.filter(p => p.online !== false && p.id !== myPlayerId);
        if (candidates.length === 0) return null;
        candidates.sort((a, b) => {
          const ja = a.joinedAt || 0, jb = b.joinedAt || 0;
          if (ja !== jb) return ja - jb;
          return (a.id || "").localeCompare(b.id || "");
        });
        return candidates[0];
      }

      // Client detects host is likely dead — run election and either become host or reconnect
      function triggerHostMigrationElection() {
        if (hostMigrationInProgress) return;
        hostMigrationInProgress = true;
        const elected = electNewHost();
        if (!elected) {
          netStatus = "error";
          netStatusMsg = "No host available — returning to menu.";
          render();
          setTimeout(() => exitToMenu(false), 2000);
          return;
        }
        if (elected.id === myPlayerId) {
          migrationReconnectElected = null;
          if (isInternetMode){
            becomeRelayHost();
          } else {
            becomeHost();
          }
        } else {
          migrationReconnectElected = elected;
          netStatus = "connecting";
          netStatusMsg = "Host lost — reconnecting to new host...";
          render();
          if (isInternetMode){
            // For relay: we just wait for relay_peer leave notification to switch
            // The new host already has the same room code, our relay socket stays open
            // We just need to point hostConn to the new host
            hostConn = makeRelayConn(elected.id, "guest");
            hostConn._markOpen();
            hostConn.send({
              type: "JOIN",
              id: myPlayerId,
              name: (myPlayerName || "Player").trim(),
              avatar: myAvatar
            });
            relayHostId = elected.id;
            hostMigrationInProgress = false;
            reconnectAttempts = 0;
            netStatus = "connected";
            netStatusMsg = "Reconnected to new host!";
            render();
          } else {
            connectToNewHost(elected);
          }
        }
      }

      // I was elected host: destroy current peer, create canonical host peer, take over
      function becomeHost(attempt) {
        attempt = attempt || 0;
        netStatus = "connecting";
        netStatusMsg = attempt > 0 ? "Becoming host (retry " + attempt + ")..." : "Becoming new host...";
        render();

        const peerId = hostPeerId();

        // Destroy old peer
        if (peer) { try { peer.destroy(); } catch (e) { } peer = null; }

        // Clear client connection state (but keep identity & room)
        hostConn = null;
        clientConns = new Map();
        reconnectAttempts = 0;
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
        if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }

        peer = new Peer(peerId, getPeerOpts(isInternetMode ? "internet" : "lan"));

        peer.on('open', () => {
          isHost = true;
          hostMigrationInProgress = false;
          netStatus = "connected";
          netStatusMsg = "You are now the host!";

          // Mark myself as host in game state (and de-crown everyone else)
          gameState.players.forEach(p => {
            p.isHost = (p.id === myPlayerId);
            if (p.isHost) p.connId = "host";
          });
          if (!gameState.players.find(p => p.id === myPlayerId)) {
            gameState.players.push({
              id: myPlayerId,
              connId: "host",
              name: (myPlayerName || "Host").trim(),
              avatar: myAvatar,
              isHost: true,
              online: true,
              ready: false,
              alive: true,
              votesReceived: 0,
              score: 0,
              roundsSurvived: 0,
              gamesWon: 0,
              joinedAt: Date.now()
            });
          }

          // Notify all surviving clients
          clientConns.forEach((conn) => {
            if (conn && conn.open) {
              try {
                conn.send({
                  type: "HOST_MIGRATION",
                  newHostId: myPlayerId,
                  gameState: gameState
                });
              } catch (e) { }
            }
          });

          startHeartbeat();
          reconcileVoiceMesh();
          addSystemChat("Host migrated! The game continues.");
          render();
        });

        peer.on('connection', (conn) => {
          clientConns.set(conn.peer, conn);
          conn.on('data', (data) => {
            handleHostReceivedData(conn.peer, data, conn);
          });
          conn.on('close', () => {
            clientConns.delete(conn.peer);
            // Mark player offline
            const p = gameState.players.find(x => x.connId === conn.peer);
            if (p) p.online = false;
            broadcastGameState();
            render();
          });
        });

        peer.on('disconnected', () => {
          // Try to reconnect to PeerJS server
          if (peer && !peer.destroyed) {
            try { peer.reconnect(); } catch (e) { }
          }
        });

        peer.on('error', (err) => {
          if (err.type === "unavailable-id" && attempt < 10) {
            // Old host's peer ID still on PeerJS server — retry after delay
            setTimeout(() => becomeHost(attempt + 1), 3000);
            return;
          }
          netStatus = "error";
          netStatusMsg = "Host migration error: " + (err.message || err.type);
          render();
        });
      }

      // Client: reconnect to the newly elected host (their canonical peerId)
      function connectToNewHost(elected) {
        // Preserve my identity through reconnection
        const savedId = myPlayerId;
        const savedName = myPlayerName;
        const savedAvatar = myAvatar;

        const doConnect = () => {
          const newHostPeerId = "imposter-p2p-" + roomCode.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
          hostConn = peer.connect(newHostPeerId, { reliable: true });

          hostConn.on('open', () => {
            netStatus = "connected";
            netStatusMsg = "Connected to new host!";
            hostMigrationInProgress = false;
            migrationReconnectElected = null;
            reconnectAttempts = 0;
            // Restore identity
            myPlayerId = savedId;
            myPlayerName = savedName;
            myAvatar = savedAvatar;
            hostConn.send({
              type: "JOIN",
              id: myPlayerId,
              name: (myPlayerName || "Player").trim(),
              avatar: myAvatar
            });
            render();
          });

          hostConn.on('data', (data) => {
            handleClientReceivedData(data);
          });

          hostConn.on('close', () => {
            netStatus = "connecting";
            netStatusMsg = "Lost connection to new host...";
            render();
            triggerClientAutoReconnect();
          });

          hostConn.on('error', () => {
            triggerClientAutoReconnect();
          });
        };

        // Reuse existing peer if open, otherwise create new one
        if (peer && !peer.destroyed && peer.open) {
          doConnect();
        } else {
          if (peer && !peer.destroyed) { try { peer.destroy(); } catch (e) { } }
          peer = new Peer(null, getPeerOpts(isInternetMode ? "internet" : "lan"));

          peer.on('open', () => {
            doConnect();
          });

          peer.on('call', (call) => {
            voiceCallMine[call.peer] = false;
            voiceCallAnsweredLive[call.peer] = !!voiceStream;
            registerVoiceCall(call.peer, call);
            try { call.answer(voiceStream || new MediaStream()); } catch (e) { }
          });

          peer.on('error', (err) => {
            netStatus = "error";
            netStatusMsg = "Reconnection error: " + (err.message || err.type);
            render();
            triggerClientAutoReconnect();
          });
        }
      }

      // Handle HOST_MIGRATION message from old host or new host
      function handleHostMigration(data) {
        hostMigrationInProgress = false;
        gameState = data.gameState || gameState;
        netStatus = "connected";
        netStatusMsg = "Host migrated — game continues!";
        render();
      }

      // Host: Process incoming messages from clients
      function handleHostReceivedData(peerId, data, conn) {
        if (data.type === "JOIN") {
          const incomingId = data.id || peerId;
          const incomingName = (data.name || "Player").trim();
          const normName = incomingName.toLowerCase();

          // 1. Check if this is an existing player rejoining strictly by persistent player id
          let existing = gameState.players.find(p => p.id === incomingId);

          // Fallback: match offline player with identical name (in case storage was wiped)
          if (!existing) {
            existing = gameState.players.find(p => !p.online && p.name && p.name.trim().toLowerCase() === normName);
            if (existing) {
              const oldId = existing.id;
              existing.id = incomingId;
              // Re-map imposterIds, votes, and survival counts to keep role & points intact
              if (gameState.imposterIds) {
                gameState.imposterIds = gameState.imposterIds.map(id => id === oldId ? incomingId : id);
              }
              if (gameState.votes && gameState.votes[oldId]) {
                gameState.votes[incomingId] = gameState.votes[oldId];
                delete gameState.votes[oldId];
              }
              if (gameState.imposterSurvivalCount && gameState.imposterSurvivalCount[oldId] !== undefined) {
                gameState.imposterSurvivalCount[incomingId] = gameState.imposterSurvivalCount[oldId];
                delete gameState.imposterSurvivalCount[oldId];
              }
            }
          }

          if (existing) {
            // RE-ATTACH EXISTING PLAYER WITH PRESERVED SCORES, POINTS & ROLE
            existing.connId = peerId;
            existing.name = incomingName;
            if (data.avatar) existing.avatar = data.avatar;
            existing.online = true;

            clientConns.set(peerId, conn);

            // Send state sync
            conn.send({ type: "STATE_SYNC", state: gameState });

            // Restore chat history so rejoining players don't miss the conversation
            conn.send({ type: "CHAT_HISTORY", messages: chatMessages });

            // If game is in progress, re-send their private role card so their screen recovers immediately!
            if (gameState.screen !== "lobby") {
              const isImp = (gameState.imposterIds || []).includes(existing.id);
              const card = {
                role: isImp ? "imposter" : "crew",
                word: isImp ? gameState.decoyWord : gameState.secretWord,
                emoji: isImp ? gameState.decoyEmoji : gameState.secretEmoji,
                category: gameState.secretCategory,
                imageUrl: isImp ? gameState.decoyImageUrl : gameState.secretImageUrl,
                revealed: existing.ready || false
              };
              conn.send({ type: "PRIVATE_CARD", card: card });
            }

            broadcastGameState();
            render();
            return;
          }

          // 2. NEW PLAYER: Check if username is already taken by an active connected player
          const activeConflict = gameState.players.find(p => p.online && p.name && p.name.trim().toLowerCase() === normName);
          if (activeConflict) {
            conn.send({
              type: "JOIN_REJECT",
              reason: "The username \"" + incomingName + "\" is already taken in this room. Please choose another username."
            });
            return;
          }

          // 3. Register New Player
          const isGameActive = gameState.screen !== "lobby";
          gameState.players.push({
            id: incomingId,
            connId: peerId,
            name: incomingName,
            avatar: data.avatar || "👤",
            isHost: false,
            online: true,
            ready: isGameActive,
            alive: !isGameActive, // Spectator if joined mid-match
            votesReceived: 0,
            score: 0,
            roundsSurvived: 0,
            gamesWon: 0,
            joinedAt: Date.now()
          });

          clientConns.set(peerId, conn);
          conn.send({ type: "STATE_SYNC", state: gameState });
          conn.send({ type: "CHAT_HISTORY", messages: chatMessages });
          playBeep(600, 'sine', 0.1);
          addSystemChat((incomingName || "A player") + " joined the lobby.");
          broadcastGameState();
          render();

        } else if (data.type === "UPDATE_AVATAR") {
          const p = gameState.players.find(x => x.id === data.id);
          if (p && data.avatar) {
            p.avatar = data.avatar;
            broadcastGameState();
            render();
          }
        } else if (data.type === "PLAYER_READY") {
          const p = gameState.players.find(x => x.id === data.id);
          if (p) p.ready = true;
          broadcastGameState();
          render();
        } else if (data.type === "CAST_VOTE") {
          handlePlayerVote(data.voterId, data.targetId);
        } else if (data.type === "CHAT") {
          netDiag("Host received CHAT from " + data.id);
          if (gameState.chatEnabled === false) return;
          if (gameState.hostMuteChat && gameState.hostMuteChat[data.id]) return;
          const sender = gameState.players.find(x => x.id === data.id);
          const msg = data.msg || {};
          appendChat({
            playerId: data.id,
            playerName: sender ? sender.name : (msg.playerName || "Player"),
            avatar: sender ? sender.avatar : (msg.avatar || "👤"),
            text: (data.text || msg.text || "").toString().slice(0, 300),
            ts: Date.now()
          });
          sendChatBroadcast(chatMessages[chatMessages.length - 1]);
          playBeep(520, 'sine', 0.05);
          render();
        } else if (data.type === "VOICE_STATE") {
          voiceStates[data.id] = data.on;
          if (!isInternetMode){
            broadcastVoiceState(data.id, data.on);
            reconcileVoiceMesh();
          }
          render();
        } else if (data.type === "PING") {
          try { conn.send({ type: "PONG" }); } catch (e) { }
        }
      }

      // Client: Process incoming messages from host
      function handleClientReceivedData(data) {
        if (data.type === "STATE_SYNC") {
          gameState = data.state;
          startClientHeartbeat();
          if (gameState.screen === "lobby") {
            myPrivateCard = {
              role: "crew",
              word: "",
              emoji: "🥥",
              category: "",
              imageUrl: null,
              revealed: false
            };
          }
          // Sync local player's registered vote from host authoritative registry
          if (gameState.screen === "vote") {
            myVotedId = (gameState.votes && gameState.votes[myPlayerId]) ? gameState.votes[myPlayerId] : null;
          } else {
            myVotedId = null;
          }
          // Host force-mute is authoritative: who currently on mic must go quiet
          if (gameState.hostMuteMic && gameState.hostMuteMic[myPlayerId]) {
            forceMicOffLocal();
          }
          render();
        } else if (data.type === "PRIVATE_CARD") {
          myPrivateCard = data.card;
          myVotedId = null;
          render();
        } else if (data.type === "UPDATE_CARD_IMAGE") {
          if (myPrivateCard && data.imageUrl) {
            myPrivateCard.imageUrl = data.imageUrl;
            render();
          }
        } else if (data.type === "JOIN_REJECT") {
          alert(data.reason || "Could not join room.");
          exitToMenu(false);
        } else if (data.type === "ANNOUNCE_BEEP") {
          playBeep(data.freq || 520, 'sine', 0.18);
          vibrate(50);
        } else if (data.type === "PING") {
          if (hostConn && hostConn.open) {
            try { hostConn.send({ type: "PONG" }); } catch (e) { }
          }
        } else if (data.type === "PONG") {
          missedPongs = 0;
        } else if (data.type === "HOST_MIGRATION") {
          // Host has migrated — reconnect to the new host
          handleHostMigration(data);
        } else if (data.type === "CHAT_BROADCAST") {
          netDiag("Client received CHAT_BROADCAST");
          appendChat(data.msg);
          if (data.msg && !data.msg.sys && !chatHasFocus) playBeep(560, 'sine', 0.05);
          render();
        } else if (data.type === "CHAT_HISTORY") {
          chatMessages = (data.messages || []).slice(-MAX_CHAT);
          render();
        } else if (data.type === "VOICE_STATE") {
          const changed = voiceStates[data.id] !== data.on;
          voiceStates[data.id] = data.on;
          if (changed && !isInternetMode){
            reconcileVoiceMesh();
            render();
          }
        } else if (data.type === "FORCE_MUTE_MIC") {
          voiceStates[myPlayerId] = false;
          forceMicOffLocal();
          render();
        } else if (data.type === "CHAT_CLEAR") {
          chatMessages = [];
          render();
        }
      }

      function broadcastGameState() {
        const payload = { type: "STATE_SYNC", state: gameState };
        clientConns.forEach(conn => {
          if (conn && conn.open) {
            try { conn.send(payload); } catch (e) { }
          }
        });
      }

      function sendToPlayer(playerId, payload) {
        const p = gameState.players.find(x => x.id === playerId);
        if (!p) return;
        if (p.isHost) {
          if (payload.type === "PRIVATE_CARD") myPrivateCard = payload.card;
          else if (payload.type === "UPDATE_CARD_IMAGE" && myPrivateCard) myPrivateCard.imageUrl = payload.imageUrl;
        } else if (p.connId && clientConns.has(p.connId)) {
          const conn = clientConns.get(p.connId);
          if (conn && conn.open) {
            try { conn.send(payload); } catch (e) { }
          }
        }
      }

      // ==========================================
      // TEXT CHAT & VOICE (PeerJS)
      // ==========================================

      // ---------- Text Chat (host-relayed) ----------
      function appendChat(msg) {
        if (!msg) return;
        chatMessages.push(msg);
        if (chatMessages.length > MAX_CHAT) chatMessages = chatMessages.slice(-MAX_CHAT);
      }

      function sendChatBroadcast(msg) {
        netDiag("sendChatBroadcast to " + clientConns.size + " conns");
        const payload = { type: "CHAT_BROADCAST", msg: msg };
        clientConns.forEach(conn => {
          if (conn && conn.open) {
            try { conn.send(payload); } catch (e) { }
          }
        });
      }

      function sendChat(raw) {
        const text = (raw || "").trim().slice(0, 300);
        if (!text) return;
        if (appMode !== "multiplayer") return;
        if (gameState.chatEnabled === false) {
          playBeep(200, 'square', 0.1);
          render(); // shows "chat paused" notice
          return;
        }
        if (gameState.hostMuteChat && gameState.hostMuteChat[myPlayerId]) {
          playBeep(200, 'square', 0.1);
          render(); // shows "you are muted from chat" notice
          return;
        }
        const me = gameState.players.find(p => p.id === myPlayerId);
        const msg = {
          playerId: myPlayerId,
          playerName: me ? me.name : (myPlayerName || "You"),
          avatar: me ? me.avatar : myAvatar,
          text: text,
          ts: Date.now()
        };
        chatDraft = "";
        playBeep(660, 'sine', 0.05);
        if (isHost) {
          appendChat(msg);
          sendChatBroadcast(msg);
