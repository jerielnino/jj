          render();
        } else if (hostConn && hostConn.open) {
          try { hostConn.send({ type: "CHAT", msg: msg }); } catch (e) { }
          // Guest send doesn't re-render immediately, so recover the keyboard on our own.
          if (isTouchDevice()) reopenChatKeyboard();
        } else {
          playBeep(300, 'square', 0.1);
        }
      }

      function addSystemChat(text) {
        const sys = {
          sys: true,
          playerId: null,
          playerName: "System",
          avatar: "🛎️",
          text: text,
          ts: Date.now()
        };
        appendChat(sys);
        sendChatBroadcast(sys);
      }

      // ---------- Voice (WebRTC mesh over the existing peers) ----------
      function hostPeerId() {
        return "imposter-p2p-" + roomCode.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
      }

      function playerPeerId(p) {
        if (!p) return null;
        return p.isHost ? hostPeerId() : (p.connId || null);
      }

      function applyVoiceMute() {
        if (!voiceStream) return;
        const suspended = appMode === "multiplayer" && gameState.screen === "card";
        const want = voiceUiOn && !suspended;
        voiceStream.getAudioTracks().forEach(t => { t.enabled = want; });
      }

      function armMic(on) {
        if (appMode !== "multiplayer") return;
        if (on && gameState.hostMuteMic && gameState.hostMuteMic[myPlayerId]) {
          playBeep(200, 'square', 0.12);
          render(); // shows the "muted by host" notice
          return;
        }
        if (on) {
          if (!voiceStream) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
              alert("Microphone not supported in this browser.");
              return;
            }
            navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } })
              .then(s => {
                voiceStream = s;
                voiceUiOn = true;
                voiceStates[myPlayerId] = true;
                if (isInternetMode){
                  setupRelayVoice();
                  // Notify others via relay
                  if (isHost) relayBroadcast({ type: "VOICE_STATE", id: myPlayerId, on: true });
                  else if (hostConn) hostConn.send({ type: "VOICE_STATE", id: myPlayerId, on: true });
                } else {
                  setupVoiceAnalysis();
                  applyVoiceMute();
                  notifyVoiceState(true);
                  reconcileVoiceMesh();
                  if (isHost) broadcastVoiceState(myPlayerId, true);
                }
                render();
              })
              .catch(err => {
                alert("Microphone access denied: " + ((err && err.message) || "unknown error"));
              });
          } else {
            voiceUiOn = true;
            voiceStates[myPlayerId] = true;
            if (isInternetMode){
              setupRelayVoice();
              if (isHost) relayBroadcast({ type: "VOICE_STATE", id: myPlayerId, on: true });
              else if (hostConn) hostConn.send({ type: "VOICE_STATE", id: myPlayerId, on: true });
            } else {
              applyVoiceMute();
              setupVoiceAnalysis();
              notifyVoiceState(true);
              reconcileVoiceMesh();
              if (isHost) broadcastVoiceState(myPlayerId, true);
            }
            render();
          }
        } else {
          voiceUiOn = false;
          voiceStates[myPlayerId] = false;
          if (isInternetMode){
            stopRelayVoice();
            if (isHost) relayBroadcast({ type: "VOICE_STATE", id: myPlayerId, on: false });
            else if (hostConn) hostConn.send({ type: "VOICE_STATE", id: myPlayerId, on: false });
          } else {
            applyVoiceMute();
            notifyVoiceState(false);
            if (isHost) broadcastVoiceState(myPlayerId, false);
          }
          render();
        }
      }

      function notifyVoiceState(on) {
        if (appMode !== "multiplayer" || isHost) return;
        if (hostConn && hostConn.open) {
          try { hostConn.send({ type: "VOICE_STATE", id: myPlayerId, on: !!on }); } catch (e) { }
        }
      }

      function broadcastVoiceState(id, on) {
        const payload = { type: "VOICE_STATE", id: id, on: !!on };
        clientConns.forEach(conn => {
          if (conn && conn.open) {
            try { conn.send(payload); } catch (e) { }
          }
        });
      }

      // Call ownership rules:
      //  * The *designated initiator* for a pair is the lower player id when both parties
      //    are on mic, otherwise the only party with mic on. Only that side opens a call,
      //    so each pair has exactly one WebRTC call (no double audio).
      //  * Calls are never rebuilt on mute/unmute (muted tracks = silence). But if I
      //    answered an inbound call while my mic was off (dark direction), tearing it
      //    down forces the designated initiator to re-establish a call I can answer live.
      //  * Closing a call re-runs reconcile on both ends so they re-negotiate promptly.
      function reconcileVoiceMesh() {
        if (appMode !== "multiplayer") return;
        if (!peer || peer.destroyed || !peer.open) return;
        if (!voiceUiOn || !voiceStream) return; // muted players never initiate
        const me = gameState.players.find(p => p.id === myPlayerId);
        if (!me) return;
        gameState.players.forEach(p => {
          if (p.id === myPlayerId) return;
          if (p.online === false) return;
          const pid = playerPeerId(p);
          if (!pid) return;
          const theirVoiceOn = voiceStates[p.id] === true;
          const iAmDesignated = !theirVoiceOn || myPlayerId < p.id;
          const existing = voiceCalls[pid];
          let canOpen = !existing;
          if (existing) {
            if (voiceCallMine[pid] === true) return;                 // I initiated: keep
            if (voiceCallAnsweredLive[pid] === true) return;         // duplex passive call: keep
            // Dark passive call (I answered while muted, now I can speak) — force re-negotiation
            teardownVoice(pid);
            canOpen = true;
          }
          if (!canOpen) return;
          if (!iAmDesignated) return;   // designated initiator is them: they will call us
          try {
            const call = peer.call(pid, voiceStream);
            voiceCallMine[pid] = true;
            registerVoiceCall(pid, call);
          } catch (e) { }
        });
      }

      function registerVoiceCall(pid, call) {
        voiceCalls[pid] = call;
        call.on("stream", (stream) => {
          bindRemoteAudio(pid, stream);
        });
        call.on("close", () => { teardownVoice(pid); reconcileVoiceMesh(); });
        call.on("error", () => { teardownVoice(pid); reconcileVoiceMesh(); });
      }

      function bindRemoteAudio(pid, stream) {
        let el = remoteAudioEls[pid];
        if (!el) {
          el = document.createElement("audio");
          el.autoplay = true;
          el.style.display = "none";
          document.body.appendChild(el);
          remoteAudioEls[pid] = el;
        }
        try { el.srcObject = stream; } catch (e) { }
        el.volume = speakerOn ? 1 : 0;
        attachVoiceAnalyser(pid, stream);
      }

      // Lightweight live "speaking" detection per remote stream
      function setupVoiceAnalysis() {
        if (!voiceCtx) {
          try { voiceCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { }
        }
        if (!voiceSpeakTimer && voiceCtx) {
          voiceSpeakTimer = setInterval(() => {
            let voiceDirty = false;
            for (const pid in voiceAnalysers) {
              const a = voiceAnalysers[pid];
              if (!a) continue;
              try {
                const d = new Uint8Array(a.frequencyBinCount);
                a.getByteFrequencyData(d);
                let sum = 0;
                for (let i = 0; i < d.length; i++) sum += d[i];
                const speaking = sum > 3000;
                if (voiceSpeaking[pid] !== speaking) { voiceSpeaking[pid] = speaking; voiceDirty = true; }
              } catch (e) { }
            }
            if (voiceDirty) render();
          }, 250);
        }
        if (voiceCtx && voiceCtx.state === "suspended") { try { voiceCtx.resume(); } catch (e) { } }
        // Also start relay voice playback scheduler if in internet mode
        if (!relayVoiceScheduler && isInternetMode) {
          relayVoiceScheduler = setInterval(() => {
            try { playRelayAudio(); } catch (e) { }
          }, 50);
        }
      }

      function attachVoiceAnalyser(pid, stream) {
        if (!voiceCtx) return;
        try {
          const src = voiceCtx.createMediaStreamSource(stream);
          const an = voiceCtx.createAnalyser();
          an.fftSize = 512;
          src.connect(an);
          // analyser is not connected to a destination; the hidden <audio> element drives playback
          voiceAnalysers[pid] = { src: src, an: an };
        } catch (e) { }
      }

      function teardownVoice(pid) {
        if (voiceCalls[pid]) {
          try { voiceCalls[pid].close(); } catch (e) { }
        }
        delete voiceCalls[pid];
        delete voiceCallMine[pid];
        delete voiceCallAnsweredLive[pid];
        const el = remoteAudioEls[pid];
        if (el) { try { el.srcObject = null; } catch (e) { } el.remove(); }
        delete remoteAudioEls[pid];
        delete voiceSpeaking[pid];
        delete voiceAnalysers[pid];
      }

      function closeAllVoiceCalls() {
        for (const pid in voiceCalls) {
          teardownVoice(pid);
        }
        voiceCalls = {};
        voiceCallMine = {};
        voiceCallAnsweredLive = {};
      }

      // ==========================================
      // RELAY VOICE (Internet mode)
      // Captures mic via ScriptProcessor → Int16 PCM frames → binary WS frames.
      // Playback: per-player FIFO → AudioContext scheduled buffers.
      // ==========================================

      let relayVoiceProc = null;
      let relayVoiceChunks = {};      // { playerId: [Int16Array, ...] }
      let relayVoiceBuffers = {};     // { playerId: AudioBufferSourceNode }
      let relayVoiceSchedules = {};   // { playerId: next playback time }
      let relayVoiceRunning = false;
      let relayVoiceInputBuf = null;

      function setupRelayVoice(){
        if (relayVoiceRunning) return;
        if (!voiceCtx){
          try { voiceCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
        }
        if (!voiceCtx) return;
        if (!voiceStream){
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
          navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } })
            .then(s => {
              voiceStream = s;
              applyVoiceMute();
              setupVoiceAnalysis();
              startRelayVoiceCapture();
            })
            .catch(err => { netDiag("Mic access denied: " + err); });
          return;
        }
        applyVoiceMute();
        setupVoiceAnalysis();
        startRelayVoiceCapture();
      }

      function startRelayVoiceCapture(){
        if (relayVoiceProc) return;
        const src = voiceCtx.createMediaStreamSource(voiceStream);
        relayVoiceProc = voiceCtx.createScriptProcessor(4096, 1, 1);
        src.connect(relayVoiceProc);
        relayVoiceProc.connect(voiceCtx.destination); // keep graph alive
        relayVoiceProc.onaudioprocess = (ev) => {
          if (!relayVoiceConnected || !relayWs || relayWs.readyState !== WebSocket.OPEN) return;
          const input = ev.inputBuffer.getChannelData(0);
          const pcm = new Int16Array(input.length);
          for (let i = 0; i < input.length; i++){
            const s = Math.max(-1, Math.min(1, input[i]));
            pcm[i] = s < 0 ? s * 32768 : s * 32767;
          }
          relayWs.send(pcm.buffer, { binary: true });
        };
        relayVoiceRunning = true;
        netDiag("Relay voice capture started");
      }

      function stopRelayVoice(){
        if (relayVoiceProc){
          relayVoiceProc.disconnect();
          relayVoiceProc.onaudioprocess = null;
          relayVoiceProc = null;
        }
        relayVoiceRunning = false;
        relayVoiceChunks = {};
        netDiag("Relay voice stopped");
      }

      // Parse binary frame: [2-byte len][playerId utf8][Int16 PCM]
      function parseRelayAudio(buf){
        if (!(buf instanceof ArrayBuffer) || buf.byteLength < 3) return null;
        const view = new DataView(buf);
        const nameLen = view.getUint16(0);
        if (buf.byteLength < 2 + nameLen) return null;
        const nameBytes = new Uint8Array(buf, 2, nameLen);
        const playerId = new TextDecoder("utf-8").decode(nameBytes);
        const pcmStart = 2 + nameLen;
        const pcmBytes = new Uint8Array(buf, pcmStart);
        const pcm = new Int16Array(pcmBytes.buffer, pcmBytes.byteOffset, pcmBytes.byteLength / 2);
        return { playerId, pcm };
      }

      function queueRelayAudio(playerId, pcm){
        if (playerId === myPlayerId) return; // ignore self
        if (!relayVoiceChunks[playerId]) relayVoiceChunks[playerId] = [];
        relayVoiceChunks[playerId].push(pcm);
        if (!relayVoiceSchedules[playerId]) relayVoiceSchedules[playerId] = voiceCtx.currentTime + 0.1;
      }

      function playRelayAudio(){
        if (!voiceCtx || voiceCtx.state !== "running") return;
        const now = voiceCtx.currentTime;
        for (const pid in relayVoiceChunks){
          const q = relayVoiceChunks[pid];
          if (!q.length) continue;
          let nextTime = relayVoiceSchedules[pid];
          if (nextTime > now + 0.2) nextTime = now + 0.1;
          while (q.length && nextTime < now + 0.5){
            const pcm = q.shift();
            const buf = voiceCtx.createBuffer(1, pcm.length, voiceCtx.sampleRate);
            const ch = buf.getChannelData(0);
            for (let i = 0; i < pcm.length; i++) ch[i] = pcm[i] / 32768;
            const src = voiceCtx.createBufferSource();
            src.buffer = buf;
            src.connect(voiceCtx.destination);
            src.start(nextTime);
            nextTime += buf.duration;
            relayVoiceBuffers[pid] = src;
          }
          relayVoiceSchedules[pid] = nextTime;
        }
      }

      function stopRelayVoicePlayer(playerId){
        if (relayVoiceBuffers[playerId]){  // fixed: was pid
          try { relayVoiceBuffers[playerId].stop(); } catch(e){}
        }
        relayVoiceChunks[playerId] = [];
        relayVoiceSchedules[playerId] = 0;
      }

      function teardownComms() {
        chatMessages = [];
        chatDraft = "";
        chatHasFocus = false;
        chatScrollSticky = true;
        chatScrollTop = 0;
        chatBoxEl = null;
        voiceStates = {};
        closeAllVoiceCalls();
        if (voiceStream) {
          try { voiceStream.getAudioTracks().forEach(t => t.stop()); } catch (e) { }
          voiceStream = null;
        }
        voiceUiOn = false;
        speakerOn = true;
        voiceSpeaking = {};
        voiceAnalysers = {};
        if (voiceSpeakTimer) { clearInterval(voiceSpeakTimer); voiceSpeakTimer = null; }
        if (relayVoiceScheduler) { clearInterval(relayVoiceScheduler); relayVoiceScheduler = null; }
        stopRelayVoice();
        if (voiceCtx) { try { voiceCtx.close(); } catch (e) { } voiceCtx = null; }
      }

      // ---------- Host Admin (moderation) ----------
      function toggleHostMute(kind, id) {
        if (!isHost) return;
        const map = kind === "mic" ? "hostMuteMic" : "hostMuteChat";
        gameState[map] = gameState[map] || {};
        gameState[map][id] = !gameState[map][id];
        // Actively silence the target the moment they are mic-muted
        if (kind === "mic" && gameState[map][id]) {
          const target = gameState.players.find(p => p.id === id);
          if (target && !target.isHost && target.connId && clientConns.has(target.connId)) {
            const conn = clientConns.get(target.connId);
            if (conn && conn.open) {
              try { conn.send({ type: "FORCE_MUTE_MIC" }); } catch (e) { }
            }
          }
        }
        broadcastGameState();
        render();
      }

      function hostSetAll(kind, on) {
        if (!isHost) return;
        const map = kind === "mic" ? "hostMuteMic" : "hostMuteChat";
        gameState[map] = gameState[map] || {};
        gameState.players.forEach(p => {
          if (!p.isHost) gameState[map][p.id] = on;
        });
        if (kind === "mic" && on) {
          clientConns.forEach(conn => {
            if (conn && conn.open) {
              try { conn.send({ type: "FORCE_MUTE_MIC" }); } catch (e) { }
            }
          });
        }
        broadcastGameState();
        render();
      }

      function hostClearChat() {
        if (!isHost) return;
        chatMessages = [];
        const payload = { type: "CHAT_CLEAR" };
        clientConns.forEach(conn => {
          if (conn && conn.open) {
            try { conn.send(payload); } catch (e) { }
          }
        });
        render();
      }

      function hostToggleChatEnabled() {
        if (!isHost) return;
        gameState.chatEnabled = !(gameState.chatEnabled !== false);
        broadcastGameState();
        render();
      }

      // Force my mic off when the host mutes me (keeps stream so I can still hear)
      function forceMicOffLocal() {
        if (voiceUiOn) {
          voiceUiOn = false;
          voiceStates[myPlayerId] = false;
          applyVoiceMute();
          notifyVoiceState(false);
        }
      }

      // ---------- Mobile keyboard handling (Visual Viewport API) ----------
      function isTouchDevice() {
        return ('ontouchstart' in window) ||
          (navigator.maxTouchPoints > 0) ||
          /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || "");
      }

      function kbBarrierHeight() {
        const vv = window.visualViewport;
        if (vv) {
          // Layout height hidden at the bottom of the screen (keyboard + browser chrome)
          return Math.max(0, (window.innerHeight) - (vv.offsetTop + vv.height));
        }
        return 0;
      }

      // Keep the chat input visible above the on-screen keyboard while it's focused.
      // NOTE: we deliberately avoid position:fixed + visualViewport math — on several Android
      // builds it reports ~0 offset, so a fixed chat box ends up UNDER the keyboard's
      // suggestion/toolbar bar and the input disappears. Focusing the input instead lets the
      // browser scroll it into view natively (accounting for the IME and its suggestion bar).
      function applyDock(el, docked) {
        if (!el) return;
        if (docked) keepChatInputVisible();
      }

      function keepChatInputVisible() {
        if (!chatInputEl || !chatInputEl.isConnected) return;
        if (chatInputEl.style.display === "none") return;
        // Re-focusing both re-opens the mobile keyboard after an IME hide-on-send and scrolls
        // the input above the keyboard natively — no manual scroll math to get wrong.
        try { chatInputEl.focus(); }
        catch (e) { try { chatInputEl.scrollIntoView(false); } catch (_) { } }
      }

      // Android IMEs often hide the keyboard on send while KEEPING focus on the input, so we
      // can't detect it via activeElement. Retry the focus over ~400ms so the keyboard reliably
      // returns even if the IME hides a beat after the send. Stops if the user moves away.
      function reopenChatKeyboard() {
        let tries = 0;
        const attempt = () => {
          if (!chatWantsFocus || !chatInputEl || !chatInputEl.isConnected) return;
          if (chatInputEl.style.display === "none") return;
          try { chatInputEl.focus(); } catch (_) { }
          if (++tries < 4) setTimeout(attempt, 90 + tries * 60);
        };
        attempt();
      }

      function refreshChatDock() {
        applyDock(chatBoxEl, !!(chatHasFocus && isTouchDevice()));
      }

      function updateKbBarrier() {
        const next = kbBarrierHeight();
        if (Math.abs(next - kbPx) > 2) {
          kbPx = next;
          refreshChatDock();
        }
      }

      // Watch the visual viewport so the chat box floats above the on-screen keyboard
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", updateKbBarrier);
        window.visualViewport.addEventListener("scroll", updateKbBarrier);
      }
      window.addEventListener("resize", updateKbBarrier);

      // ---------- Chat Panel UI ----------
      // Swap the *content* of a persistent panel section without remaking the container,
      // so the focused <input> (in the input slot) keeps its identity across renders.
      function setSlot(slot, content) {
        slot.innerHTML = "";
        if (content) slot.appendChild(content);
      }

      function renderChatPanel() {
        if (appMode !== "multiplayer" || gameState.screen === "card") {
          // anti-leak: no chat while viewing your secret card. The panel is a persistent child
          // of #app, so when chat isn't shown we MUST detach it explicitly (the focused input
          // being removed is fine here — the user left the chat context anyway).
          if (chatPanelEl && chatPanelEl.parentNode) chatPanelEl.parentNode.removeChild(chatPanelEl);
          chatPanelEl = null;
          return null;
        }

        const titles = {
          lobby: "Lobby",
          discuss: "Discussion",
          vote: "Voting",
          voteTie: "Tie Break",
          roundResult: "Round Result",
          results: "Results"
        };
        const title = titles[gameState.screen] || "Game";

        // DOM-persistent panel: the skeleton is built ONCE; later renders only swap the
        // (unfocused) inner sections. The <input> in the input slot survives every render,
        // so on mobile the IME never re-initializes and its suggestion bar stays out of the
        // way of the text you're typing.
        let box = chatPanelEl;
        if (!box) {
          box = el("div", { class: "chat-box" });
          chatPanelEl = box;
          box.appendChild(el("div", { class: "ch-head-slot" }));
          box.appendChild(el("div", { class: "ch-chip-slot" }));
          box.appendChild(el("div", { class: "ch-msgs-slot" }));
          box.appendChild(el("div", { class: "ch-admin-slot" }));
          box.appendChild(el("div", { class: "ch-pause-slot" }));
          // Persistent input row: built ONCE here and never removed from the DOM afterwards.
          // Renders only toggle its visibility and value, so a focused <input> is never
          // detached — no blur, no IME re-initialization — and the keyboard's suggestion bar
          // stays out of the way of the text you're typing.
          const inputRow = el("div", { class: "chat-input-row" });
          if (!chatInputEl) {
            chatInputEl = el("input", {
              type: "text",
              placeholder: "Type a message…",
              maxlength: "300",
              oninput: (e) => { chatDraft = e.target.value; },
              // NOTE: never call render() from focus handlers — the panel is DOM-persistent
              // now, but rebuilding mid-focus still disturbs the mobile keyboard.
              onfocus: () => {
                chatHasFocus = true;
                chatWantsFocus = true;               // user is composing — keep keyboard after sends
                if (chatBlurTimer) { clearTimeout(chatBlurTimer); chatBlurTimer = null; }
                setTimeout(refreshChatDock, 150);
              },
              onblur: () => {
                chatHasFocus = false;
                // Give the send/render path a short grace to restore focus before deciding the
                // user really moved away. If focus isn't back within ~400ms, stop auto-restoring.
                if (chatBlurTimer) clearTimeout(chatBlurTimer);
                chatBlurTimer = setTimeout(() => { chatWantsFocus = false; }, 400);
                setTimeout(refreshChatDock, 250);
              },
              onkeydown: (e) => { if (e.key === "Enter") { sendChat(chatInputEl.value); } }
            });
            // Kill the on-screen suggestion / quick-type bar so it can't sit over the text
            chatInputEl.setAttribute("autocomplete", "off");
            chatInputEl.setAttribute("autocorrect", "off");
            chatInputEl.setAttribute("autocapitalize", "off");
            chatInputEl.setAttribute("spellcheck", "false");
            chatInputEl.setAttribute("inputmode", "text");
            chatInputEl.setAttribute("enterkeyhint", "send");
          }
          chatInputEl.value = chatDraft;
          inputRow.appendChild(chatInputEl);
          inputRow.appendChild(el("button", { onclick: () => sendChat(chatInputEl.value) }, [document.createTextNode("Send ➤")]));
          box.appendChild(inputRow);
          box.appendChild(el("div", { class: "ch-note-slot" }));
        }
        chatBoxEl = box;

        // On mobile, keep the focused chat input visible above the on-screen keyboard (native
        // scroll-into-view, no fixed positioning — see keepChatInputVisible above).
        applyDock(box, !!(chatHasFocus && isTouchDevice()));

        // Header row: title + voice controls
        {
          const slot = box.querySelector(".ch-head-slot");
          const head = el("div", { class: "chat-head" });
          head.appendChild(el("div", { class: "chat-title" }, [document.createTextNode("💬 " + title + " Chat")]));

          const vbar = el("div", { style: "display:flex; align-items:center; gap:6px;" });
          // Voice controls only in internet mode (irrelevant over LAN)
          if (isInternetMode) {
            vbar.appendChild(el("button", {
              class: "chat-voice-toggle speaker",
              title: speakerOn ? "Speakers on — tap to mute" : "Speakers muted — tap to unmute",
              onclick: () => {
                speakerOn = !speakerOn;
                for (const pid in remoteAudioEls) {
                  try { remoteAudioEls[pid].volume = speakerOn ? 1 : 0; } catch (e) { }
                }
                render();
              }
            }, [document.createTextNode(speakerOn ? "🔊" : "🔇")]));
            const hostMicMuted = gameState.hostMuteMic && gameState.hostMuteMic[myPlayerId];
            vbar.appendChild(el("button", {
              class: "chat-voice-toggle" + (hostMicMuted ? " muted" : (voiceUiOn ? " on" : "")),
              title: hostMicMuted ? "Your mic is muted by the host" : (voiceUiOn ? "Mic is live — tap to mute" : "Mic is off — tap to unmute"),
              onclick: () => armMic(!voiceUiOn)
            }, [document.createTextNode("🎤 " + (hostMicMuted ? "Host" : (voiceUiOn ? "On" : "Off")))]));
          }
          head.appendChild(vbar);
          setSlot(slot, head);
        }

        // Live mic chips (who is talking) — internet mode only
        {
          const slot = box.querySelector(".ch-chip-slot");
          if (isInternetMode) {
            const chips = el("div", { class: "voice-chips" });
            let anyVoice = false;
            gameState.players.forEach(p => {
              if (p.online === false) return;
              const on = voiceStates[p.id] === true;
              const iAm = p.id === myPlayerId;
              if (!on && !voiceUiOn) return;
              anyVoice = true;
              const speaking = voiceSpeaking[playerPeerId(p)] === true;
              const chip = el("div", { class: "voice-chip" + (speaking ? " speaking" : "") + (iAm || on ? " mic-on" : "") }, [
                document.createTextNode(p.avatar + " " + (p.name || "?") + (iAm ? " (You)" : ""))
              ]);
              if (speaking) chip.appendChild(el("span", { class: "speak-dot" }));
              chips.appendChild(chip);
            });
            if (!anyVoice) {
              chips.appendChild(el("div", { class: "chat-empty" }, [
                document.createTextNode("No one on mic yet. Tap 🎤 Off to start talking.")
              ]));
            }
            setSlot(slot, chips);
          } else {
            setSlot(slot, null);
          }
        }

        // Messages
        {
          const slot = box.querySelector(".ch-msgs-slot");
          const list = el("div", { class: "chat-msgs" });
          list.addEventListener("scroll", () => {
            const nearBottom = list.scrollTop + list.clientHeight >= list.scrollHeight - 16;
            chatScrollSticky = nearBottom;
            if (!nearBottom) chatScrollTop = list.scrollTop;
          });
          if (chatMessages.length === 0) {
            list.appendChild(el("div", { class: "chat-empty" }, [document.createTextNode("No messages yet. Say hi! 👋")]));
          } else {
            chatMessages.forEach(m => {
              const row = el("div", { class: "chat-msg" + (m.sys ? " sys" : "") });
              row.appendChild(el("span", { class: "chat-avatar" }, [document.createTextNode(m.avatar || "👤")]));
              const body = el("div", { class: "chat-body" });
              body.appendChild(el("div", { class: "chat-name" + (m.playerId === myPlayerId ? " me" : "") }, [
                document.createTextNode(m.playerName || "Player")
              ]));
              body.appendChild(el("div", { class: "chat-text" }, [document.createTextNode(m.text)]));
              row.appendChild(body);
              list.appendChild(row);
            });
          }
          setSlot(slot, list);
        }

        // Host admin strip — compact icon chips, collapsible
        {
          const slot = box.querySelector(".ch-admin-slot");
          if (isHost) {
            const admin = el("div", { class: "chat-admin" });

            const header = el("div", { class: "chat-admin-header" });
            header.appendChild(el("span", { class: "chat-admin-title" }, [document.createTextNode("🛠 Host Controls")]));
            const toggle = el("button", {
              class: "chat-admin-toggle",
              title: adminOpen ? "Collapse host controls" : "Expand host controls",
              onclick: () => {
                adminOpen = !adminOpen;
                const inner = admin.querySelector(".chat-admin-inner");
                if (inner) inner.classList.toggle("closed", !adminOpen);
                toggle.textContent = adminOpen ? "▾" : "▸";
                toggle.title = adminOpen ? "Collapse host controls" : "Expand host controls";
              }
            }, [document.createTextNode(adminOpen ? "▾" : "▸")]);
            header.appendChild(toggle);
            admin.appendChild(header);

            const inner = el("div", { class: "chat-admin-inner" + (adminOpen ? "" : " closed") });

            const actions = el("div", { class: "chat-admin-actions" });
            // Mic controls only in internet mode
            if (isInternetMode) {
              actions.appendChild(el("button", { title: "Mute all mics", onclick: () => hostSetAll("mic", true) }, [document.createTextNode("🔇")]));
              actions.appendChild(el("button", { title: "Unmute all mics", onclick: () => hostSetAll("mic", false) }, [document.createTextNode("🔊")]));
            }
            actions.appendChild(el("button", { title: "Block all chat", onclick: () => hostSetAll("chat", true) }, [document.createTextNode("⛔")]));
            actions.appendChild(el("button", { title: "Unblock all chat", onclick: () => hostSetAll("chat", false) }, [document.createTextNode("💬")]));
            actions.appendChild(el("button", { class: "red", title: "Clear chat", onclick: hostClearChat }, [document.createTextNode("🗑")]));
            actions.appendChild(el("button", {
              style: "border-color:var(--gold); color:var(--gold);",
              title: gameState.chatEnabled === false ? "Resume chat" : "Pause chat",
              onclick: hostToggleChatEnabled
            }, [document.createTextNode(gameState.chatEnabled === false ? "▶" : "⏸")]));
            inner.appendChild(actions);

            const rows = el("div", { class: "chat-admin-players" });
            gameState.players.forEach(p => {
              if (p.isHost || p.online === false) return;
              const micMuted = gameState.hostMuteMic && gameState.hostMuteMic[p.id];
              const chatMuted = gameState.hostMuteChat && gameState.hostMuteChat[p.id];
              const row = el("div", { class: "chat-admin-row" });
              row.appendChild(el("span", { class: "nm" }, [
                document.createTextNode((p.avatar || "👤") + " " + (p.name || "Player"))
              ]));
              // Mic toggle only in internet mode
              if (isInternetMode) {
                row.appendChild(el("button", {
                  class: micMuted ? "on" : "offok",
                  title: "Toggle mic for " + p.name,
                  onclick: () => toggleHostMute("mic", p.id)
                }, [document.createTextNode(micMuted ? "🔇" : "🎤")]));
              }
              row.appendChild(el("button", {
                class: chatMuted ? "on" : "offok",
                title: "Toggle chat for " + p.name,
                onclick: () => toggleHostMute("chat", p.id)
              }, [document.createTextNode(chatMuted ? "⛔" : "💬")]));
              rows.appendChild(row);
            });
            inner.appendChild(rows);
            admin.appendChild(inner);
            setSlot(slot, admin);
          } else {
            setSlot(slot, null);
          }
        }

        // Input row — the SAME row persists across renders; we only toggle its visibility when
        // chat is paused or I am blocked. Never re-parent the <input> while the user is typing:
        // detaching it fires blur, which makes the mobile keyboard's suggestion bar jump over
        // the text being composed.
        {
          const chatPaused = gameState.chatEnabled === false;
          const chatBlockedMe = gameState.hostMuteChat && gameState.hostMuteChat[myPlayerId];
          const inputRow = box.querySelector(".chat-input-row");
          if (inputRow && chatInputEl) {
            chatInputEl.value = chatDraft;
            inputRow.style.display = (chatPaused || chatBlockedMe) ? "none" : "";
          }
          const pauseSlot = box.querySelector(".ch-pause-slot");
          if (chatPaused) {
            setSlot(pauseSlot, el("div", { class: "chat-notice warn" }, [
              document.createTextNode("💬 Chat is paused by the host.")
            ]));
          } else if (chatBlockedMe) {
            setSlot(pauseSlot, el("div", { class: "chat-notice warn" }, [
              document.createTextNode("💬 You were muted from chat by the host.")
            ]));
          } else {
            setSlot(pauseSlot, null);
          }
        }

        setSlot(box.querySelector(".ch-note-slot"), el("div", { class: "chat-notice" }, [
          document.createTextNode("Chat is seen by everyone · mics start OFF to avoid echo 🔊")
        ]));

        // Keep scroll pinned to bottom unless the user scrolled up
        {
          const slot = box.querySelector(".ch-msgs-slot");
          requestAnimationFrame(() => {
            const list = slot.firstChild;
            if (list) {
              if (chatScrollSticky) list.scrollTop = list.scrollHeight;
              else list.scrollTop = chatScrollTop || 0;
            }
          });
        }

        // If the user was mid-composition, keep the input focused and the keyboard up after the
        // send — even though the IME often hides itself a beat later while keeping focus.
        if (chatWantsFocus && chatInputEl &&
          gameState.chatEnabled !== false &&
          !(gameState.hostMuteChat && gameState.hostMuteChat[myPlayerId])) {
          reopenChatKeyboard();
        }

        return box;
      }

      // ==========================================
      // MULTIPLAYER GAME FLOW (Authoritative on Host)
      // ==========================================
      function hostStartMultiplayerGame() {
        const activePlayers = gameState.players.filter(p => p.online !== false);
        if (activePlayers.length < 3) {
          alert("Need at least 3 online players to start!");
          return;
        }

        // Smart non-repeating random word pair selection
        const { secret, decoy } = pickSecretAndDecoy();

        // Randomize first clue giver from active online players
        const firstP = activePlayers[getRandomInt(0, activePlayers.length)];
        gameState.firstPlayerName = firstP ? firstP.name : "First Player";

        // Pick imposters randomly from ACTIVE players ONLY using unbiased Fisher-Yates shuffle
        const shuffledActive = [...activePlayers];
        for (let i = shuffledActive.length - 1; i > 0; i--) {
          const j = getRandomInt(0, i + 1);
          [shuffledActive[i], shuffledActive[j]] = [shuffledActive[j], shuffledActive[i]];
        }
        const maxAllowedImposters = Math.max(1, Math.floor((activePlayers.length - 1) / 2));
        const imposterCount = Math.min(Math.max(1, gameState.numImposters || 1), maxAllowedImposters);
        const chosenImposters = shuffledActive.slice(0, imposterCount).map(p => p.id);
        gameState.imposterIds = chosenImposters;
        const imposterIds = new Set(chosenImposters);

        gameState.secretWord = secret.word;
        gameState.secretEmoji = secret.emoji;
        gameState.secretCategory = secret.cat;
        gameState.secretImageUrl = null;
        gameState.decoyWord = decoy.word;
        gameState.decoyEmoji = decoy.emoji;
        gameState.decoyImageUrl = null;
        gameState.winner = null;
        gameState.gameOverReason = null;
        gameState.voteOutcome = null;
        gameState.roundNumber = 1;
        gameState.votes = {};
        gameState.voteRoundId = 1;
        gameState.imposterSurvivalCount = {};

        // Reset round properties: only active online players are alive
        gameState.players.forEach(p => {
          const isOnline = p.online !== false;
          p.ready = false;
          p.alive = isOnline;
          p.votesReceived = 0;
          p.score = p.score || 0;
          p.roundsSurvived = p.roundsSurvived || 0;
          p.gamesWon = p.gamesWon || 0;
        });

        myVotedId = null;
        gameState.screen = "card";

        // Instantly set Host's own private card
        const isHostImp = imposterIds.has(myPlayerId);
        myPrivateCard = {
          role: isHostImp ? "imposter" : "crew",
          word: isHostImp ? decoy.word : secret.word,
          emoji: isHostImp ? decoy.emoji : secret.emoji,
          category: secret.cat,
          imageUrl: null,
          revealed: false
        };

        // Instantly send private cards to all connected players synchronously
        gameState.players.forEach(p => {
          if (p.isHost) return;
          const isImp = imposterIds.has(p.id);
          sendToPlayer(p.id, {
            type: "PRIVATE_CARD",
            card: {
              role: isImp ? "imposter" : "crew",
              word: isImp ? decoy.word : secret.word,
              emoji: isImp ? decoy.emoji : secret.emoji,
              category: secret.cat,
              imageUrl: null,
              revealed: false
            }
          });
        });

        // Broadcast state sync and render immediately
        broadcastGameState();
        render();

        // Fetch images in the background asynchronously without blocking gameplay
        fetchWikipediaThumbnail(secret.word, (secImg) => {
          if (secImg && gameState.secretWord === secret.word) {
            gameState.secretImageUrl = secImg;
            if (!isHostImp && myPrivateCard) myPrivateCard.imageUrl = secImg;
            gameState.players.forEach(p => {
              if (!p.isHost && !imposterIds.has(p.id)) {
                sendToPlayer(p.id, { type: "UPDATE_CARD_IMAGE", imageUrl: secImg });
              }
            });
            if (gameState.screen === "results") broadcastGameState();
            render();
          }
        });

        fetchWikipediaThumbnail(decoy.word, (decImg) => {
          if (decImg && gameState.decoyWord === decoy.word) {
            gameState.decoyImageUrl = decImg;
            if (isHostImp && myPrivateCard) myPrivateCard.imageUrl = decImg;
            gameState.players.forEach(p => {
              if (!p.isHost && imposterIds.has(p.id)) {
                sendToPlayer(p.id, { type: "UPDATE_CARD_IMAGE", imageUrl: decImg });
              }
            });
            if (gameState.screen === "results") broadcastGameState();
            render();
          }
        });
      }

      function markMyCardReady() {
        myPrivateCard.revealed = true;
        vibrate(40);
        playBeep(640, 'triangle', 0.1);
        if (isHost) {
          const me = gameState.players.find(p => p.id === myPlayerId);
          if (me) me.ready = true;
          broadcastGameState();
          render();
        } else if (hostConn && hostConn.open) {
          hostConn.send({ type: "PLAYER_READY", id: myPlayerId });
          render();
        }
      }

      function hostProceedToDiscussion() {
        if (gameState.screen === "voteTie" || gameState.screen === "roundResult") {
          gameState.roundNumber = (gameState.roundNumber || 1) + 1;
        }
        gameState.screen = "discuss";
        gameState.timerSeconds = 0;
        gameState.timerRunning = true;
        gameState.votes = {};
        gameState.players.forEach(p => p.votesReceived = 0);
        myVotedId = null;
        startSyncTimer();
        broadcastGameState();
        render();
      }

      function startSyncTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          if (gameState.timerRunning && gameState.screen === "discuss") {
            gameState.timerSeconds++;
            const disp = document.getElementById("timerVal");
            if (disp) disp.textContent = formatTime(gameState.timerSeconds);
            // Sync timer periodically
            if (gameState.timerSeconds % 4 === 0 && isHost) broadcastGameState();
          }
        }, 1000);
      }

      function hostProceedToVoting() {
        if (timerInterval) clearInterval(timerInterval);
        gameState.timerRunning = false;
        gameState.votes = {};
        gameState.voteRoundId = (gameState.voteRoundId || 0) + 1;
        gameState.players.forEach(p => p.votesReceived = 0);
        gameState.screen = "vote";
        myVotedId = null;
        broadcastGameState();
        render();
      }

      // Authoritative Single-Vote Enforcement on Host
      function handlePlayerVote(voterId, targetId) {
        if (!isHost) return;
        const voter = gameState.players.find(p => p.id === voterId);
        const target = gameState.players.find(p => p.id === targetId);

        // Only alive voters and alive targets are accepted
        if (voter && voter.alive && target && target.alive) {
          gameState.votes = gameState.votes || {};

          // Overwrite/register voter's single selection
          gameState.votes[voterId] = targetId;

          // Recalculate votesReceived for all players
          gameState.players.forEach(p => {
            p.votesReceived = Object.values(gameState.votes).filter(tid => tid === p.id).length;
          });

          playBeep(480, 'sine', 0.08);
          broadcastGameState();
          render();
        }
      }

      function castVoteOnPhone(targetId) {
        const me = gameState.players.find(p => p.id === myPlayerId);
        if (!me || !me.alive) return; // Spectators/Eliminated cannot vote

        // Allow changing vote or selecting new target
        myVotedId = targetId;
        vibrate(40);
        playBeep(700, 'sine', 0.12);

        if (isHost) {
          handlePlayerVote(myPlayerId, targetId);
        } else if (hostConn && hostConn.open) {
          hostConn.send({ type: "CAST_VOTE", voterId: myPlayerId, targetId: targetId });
        }
        render();
      }

      // ==========================================
      // VOTE OUTCOME (Authoritative on Host)
      // Maximum voted person is ejected (Plurality)
      // Surviving Imposter gets +10 points per round!
      // ==========================================
      function hostCalculateVoteOutcome() {
        if (!isHost) return;
        const alivePlayers = gameState.players.filter(p => p.online !== false && p.alive);
        const totalVotes = Object.keys(gameState.votes || {}).length;
        const maxVotes = Math.max(...alivePlayers.map(p => p.votesReceived || 0), 0);

        // Players tied for the maximum votes (must have at least 1 vote)
        const topPlayers = (totalVotes > 0 && maxVotes > 0)
          ? alivePlayers.filter(p => (p.votesReceived || 0) === maxVotes)
          : [];

        gameState.imposterSurvivalCount = gameState.imposterSurvivalCount || {};

        if (topPlayers.length !== 1) {
          // TIE or 0 votes => NO EJECTION!
          // Silently track survival count for alive imposters (revealed/scored only at game end)
          const aliveImposters = alivePlayers.filter(p => (gameState.imposterIds || []).includes(p.id));
          aliveImposters.forEach(imp => {
            gameState.imposterSurvivalCount[imp.id] = (gameState.imposterSurvivalCount[imp.id] || 0) + 1;
          });

          gameState.voteOutcome = {
            ejected: false,
            isTie: topPlayers.length > 1,
            total: totalVotes,
            maxVotes: maxVotes,
            topNames: topPlayers.map(p => p.name),
            scoreEvents: [],
            aliveCount: alivePlayers.length
          };
          gameState.screen = "voteTie";
        } else {
          // Single player has highest votes => EJECTED!
          const accused = topPlayers[0];
          const wasImposter = (gameState.imposterIds || []).includes(accused.id);
          accused.alive = false;

          const aliveAfter = gameState.players.filter(p => p.online !== false && p.alive);
          const aliveImpostersAfter = aliveAfter.filter(p => (gameState.imposterIds || []).includes(p.id));
          const remainingImposters = aliveImpostersAfter.length;

          // Silently track survival count for surviving imposters
          aliveImpostersAfter.forEach(imp => {
            gameState.imposterSurvivalCount[imp.id] = (gameState.imposterSurvivalCount[imp.id] || 0) + 1;
          });

          gameState.voteOutcome = {
            ejected: true,
            name: accused.name,
            avatar: accused.avatar,
            wasImposter: wasImposter,
            remainingImposters: remainingImposters,
            aliveCount: aliveAfter.length,
            maxVotes: maxVotes,
            totalVotes: totalVotes,
            scoreEvents: []
          };

          if (remainingImposters === 0) {
            // All imposters caught => Crew Win!
            gameState.gameOverReason = "crewWin";
            gameState.winner = "crew";
            gameState.screen = "results";

            const scoreEvents = [];

            // Award crew victory points
            const crewMembers = gameState.players.filter(p => !(gameState.imposterIds || []).includes(p.id));
            crewMembers.forEach(c => {
              c.score = (c.score || 0) + 10;
              c.gamesWon = (c.gamesWon || 0) + 1;
              scoreEvents.push({
                id: c.id,
                name: c.name,
                avatar: c.avatar,
                pts: 10,
                reason: "Crew Victory 🛡️"
              });
            });

            // Award earlier round survival points to imposters now that match has ended
            const imposterPlayers = gameState.players.filter(p => (gameState.imposterIds || []).includes(p.id));
            imposterPlayers.forEach(imp => {
              const survivedCount = gameState.imposterSurvivalCount[imp.id] || 0;
              if (survivedCount > 0) {
                imp.roundsSurvived = (imp.roundsSurvived || 0) + survivedCount;
                imp.score = (imp.score || 0) + (survivedCount * 10);
                scoreEvents.push({
                  id: imp.id,
                  name: imp.name,
                  avatar: imp.avatar,
                  pts: survivedCount * 10,
                  reason: "Survived " + survivedCount + " Round" + (survivedCount > 1 ? "s" : "") + " as Imposter 🤫"
                });
              }
            });

            gameState.voteOutcome.scoreEvents = scoreEvents;

          } else if (aliveAfter.length <= remainingImposters * 2) {
            // Parity reached => Imposters Win!
            gameState.gameOverReason = "floorReached";
            gameState.winner = "imposter";
            gameState.screen = "results";

            const scoreEvents = [];

            const imposterPlayers = gameState.players.filter(p => (gameState.imposterIds || []).includes(p.id));
            imposterPlayers.forEach(imp => {
              const survivedCount = gameState.imposterSurvivalCount[imp.id] || 0;
              if (survivedCount > 0) {
                imp.roundsSurvived = (imp.roundsSurvived || 0) + survivedCount;
                imp.score = (imp.score || 0) + (survivedCount * 10);
                scoreEvents.push({
                  id: imp.id,
                  name: imp.name,
                  avatar: imp.avatar,
                  pts: survivedCount * 10,
                  reason: "Survived " + survivedCount + " Round" + (survivedCount > 1 ? "s" : "") + " as Imposter 🤫"
                });
              }

              // Match victory bonus for surviving imposters
              if (aliveImpostersAfter.some(a => a.id === imp.id)) {
                imp.score = (imp.score || 0) + 10;
                imp.gamesWon = (imp.gamesWon || 0) + 1;
                scoreEvents.push({
                  id: imp.id,
                  name: imp.name,
                  avatar: imp.avatar,
                  pts: 10,
                  reason: "Imposter Match Victory 🏆"
                });
              }
            });

            gameState.voteOutcome.scoreEvents = scoreEvents;

          } else {
            // Continue to next discussion round
            gameState.screen = "roundResult";
          }
        }

        broadcastGameState();
        render();
      }

      // ==========================================
      // RENDER UI SCREENS
      // ==========================================
      function render() {
        const app = document.getElementById("app");
        const screen = document.getElementById("screen");
        // The chat panel and footer live directly under #app and are NEVER cleared here, so a
        // focused chat <input> keeps its DOM identity (and the mobile IME keeps its state)
        // across every render. Only the game/menu content inside #screen is rebuilt.
        screen.innerHTML = "";

        // App Header
        const h1 = el("h1", {}, [
          el("img", { class: "header-icon", src: MASCOT_IMG, alt: "Icon" }),
          document.createTextNode("Imposter")
        ]);
        screen.appendChild(h1);
        screen.appendChild(el("div", { class: "subtitle" }, [document.createTextNode("Multiplayer LAN / Web Party Game")]));

        // Top Bar if in room
        if (appMode === "multiplayer" && roomCode) {
          const topBar = el("div", { class: "top-bar" });

          const netBadge = el("div", { class: "net-badge " + (netStatus === "connected" ? "online" : netStatus === "connecting" ? "connecting" : "error") }, [
            el("div", { class: "dot" }),
            document.createTextNode(roomCode + " · " + (isHost ? "Host" : "Player"))
          ]);
          topBar.appendChild(netBadge);

          const rightControls = el("div", { style: "display:flex; align-items:center; gap:6px;" });

          // Show Manual Reconnect Button if network is in error or connecting state
          if (!isHost && (netStatus === "error" || netStatus === "connecting")) {
            const reconBtn = el("button", {
              class: "reconnect-btn-top",
              onclick: () => {
                triggerClientAutoReconnect();
              }
            }, [document.createTextNode("⚡ Reconnect")]);
            rightControls.appendChild(reconBtn);
          }

          // Quick Scorecard Button
          const scoreBtn = el("button", {
            class: "score-btn-top",
            onclick: () => {
              showScoreModal = !showScoreModal;
              render();
            }
          }, [document.createTextNode("🏆 Scores")]);
          rightControls.appendChild(scoreBtn);

          // Leave room button
          rightControls.appendChild(el("button", { onclick: () => exitToMenu(true) }, [document.createTextNode("✕ Leave")]));
          topBar.appendChild(rightControls);

          screen.appendChild(topBar);

          // Live status message (why things are connecting / failing)
          if (netStatusMsg && (netStatus === "connecting" || netStatus === "error")) {
            const statusStrip = el("div", {
              style: "width:100%; padding:8px 10px; margin-top:6px; border-radius:10px; font-size:.78rem; text-align:center; background:" + (netStatus === "error" ? "rgba(231,76,60,0.15);" : "rgba(232,185,58,0.12);") + "color:var(--cream);"
            }, [document.createTextNode((isInternetMode ? "🌐 " : "📶 ") + netStatusMsg)]);
            screen.appendChild(statusStrip);
          }

          // Diagnostics toggle (shows the net log so we can see where a join fails)
          screen.appendChild(el("button", {
            class: "link-btn",
            style: "color:var(--cyan); font-size:.72rem; margin-top:6px; align-self:flex-start;",
            onclick: () => { showNetDiag = !showNetDiag; render(); }
          }, [document.createTextNode(showNetDiag ? "🔽 Hide connection log" : "🔍 Connection log (" + netLog.length + ")")]));
          if (showNetDiag) {
            const diagBox = el("div", { style: "width:100%; margin-top:4px; padding:8px; border-radius:10px; background:var(--black-soft); font-size:.68rem; font-family:monospace; color:var(--cream); line-height:1.5; max-height:40vh; overflow:auto;" });
            netLog.forEach(l => {
              diagBox.appendChild(el("div", {}, [document.createTextNode(l)]));
            });
            if (!window.peerJsLoaded && !window.peerJsFailed) diagBox.appendChild(el("div", { style: "color:var(--gold)" }, [document.createTextNode("⏳ PeerJS library still loading…")]));
            if (window.peerJsFailed) diagBox.appendChild(el("div", { style: "color:var(--danger)" }, [document.createTextNode("⛔ PeerJS library failed to load from all CDNs.")]));
            diagBox.appendChild(el("div", { style: "opacity:.6; margin-top:4px" }, [document.createTextNode(navigator.userAgent)]));
            screen.appendChild(diagBox);
          }
        }

        if (appMode === "menu") renderMenu(screen);
        else if (appMode === "multiplayer") {
          if (gameState.screen === "lobby") renderLobby(screen);
          else if (gameState.screen === "card") renderMultiplayerCard(screen);
          else if (gameState.screen === "discuss") renderMultiplayerDiscuss(screen);
          else if (gameState.screen === "vote") renderMultiplayerVote(screen);
          else if (gameState.screen === "voteTie") renderMultiplayerVoteTie(screen);
          else if (gameState.screen === "roundResult") renderMultiplayerRoundResult(screen);
          else if (gameState.screen === "results") renderMultiplayerResults(screen);
        }

        // Keep voice state in sync (auto-mute during private card reveal) and show chat.
        // renderChatPanel() returns null (and detaches any stale panel) whenever chat
        // shouldn't be shown — menu, or the secret-card reveal — so calling it on every
        // render keeps the persistent panel from lingering after leaving a room.
        if (appMode === "multiplayer") {
          applyVoiceMute();
          reconcileVoiceMesh();
        }
        const chatPanel = renderChatPanel();
        // Persistent child of #app (never cleared), so the focused input survives renders
        if (chatPanel) app.appendChild(chatPanel);

        // Render modals
        const emojiModal = renderEmojiModal();
        if (emojiModal) screen.appendChild(emojiModal);

        const scoreModal = renderScoreModal();
        if (scoreModal) screen.appendChild(scoreModal);

        // Footer — persistent too, appended after the chat panel to preserve visual order
        if (!appFooterEl) {
          appFooterEl = el("footer", {}, [document.createTextNode("Imposter · Kerala Themed Multiplayer & Offline Game")]);
        }
        app.appendChild(appFooterEl);
      }

      function exitToMenu(confirmFirst) {
        if (confirmFirst && appMode === "multiplayer" && roomCode) {
          if (!confirm("Are you sure you want to leave room " + roomCode + "?")) return;
        }
        if (heartbeatInterval) clearInterval(heartbeatInterval);
        if (reconnectTimer) clearTimeout(reconnectTimer);
        if (timerInterval) clearInterval(timerInterval);
        if (peer) { try { peer.destroy(); } catch (e) { } }
        clientConns.clear();
        teardownComms();
        appMode = "menu";
        roomCode = "";
        isHost = false;
        hostMigrationInProgress = false;
        migrationReconnectElected = null;
        missedPongs = 0;
        showScoreModal = false;
        showEmojiModal = false;
        myPrivateCard = {
          role: "crew",
          word: "",
          emoji: "🥥",
          category: "",
          imageUrl: null,
          revealed: false
        };
        render();
      }

      // ---------- Multiplayer Lobby Screen ----------
      function renderLobby(app) {
        const screen = el("div", { class: "screen" });

        // Room info box
        const roomBox = el("div", { class: "room-code-box", style: "width:100%" });
        roomBox.appendChild(el("div", { style: "font-size:.8rem; text-transform:uppercase; opacity:.8" }, [document.createTextNode("Room Code")]));
        roomBox.appendChild(el("div", { class: "room-code-text" }, [document.createTextNode(roomCode)]));

        // Mode badge
        const modeBadge = el("div", { style: "font-size:.72rem; margin-top:4px; opacity:.8;" }, [
          document.createTextNode(isInternetMode ? "🌐 Internet Play" : "📶 LAN Only")
        ]);
        roomBox.appendChild(modeBadge);

        // QR Code Container
        const qrDiv = el("div", { id: "qrcodeContainer" });
        roomBox.appendChild(qrDiv);
        setTimeout(() => {
          qrDiv.innerHTML = "";
          const modeParam = isInternetMode ? "&mode=internet" : "";
          const joinUrl = window.location.origin + window.location.pathname + "?room=" + encodeURIComponent(roomCode) + modeParam;
          if (window.QRCode) {
            new QRCode(qrDiv, { text: joinUrl, width: 140, height: 140 });
          }
        }, 100);

        // Copy invite link button
        roomBox.appendChild(el("button", {
          class: "link-btn",
          style: "margin-top:6px; color:var(--gold); font-size:.85rem;",

            const modeParam = isInternetMode ? "&mode=internet" : "";
            const joinUrl = window.location.origin + window.location.pathname + "?room=" + encodeURIComponent(roomCode) + modeParam;
            navigator.clipboard.writeText(joinUrl).then(() => alert("Invite link copied to clipboard!"));

        screen.appendChild(roomBox);

        // Players in lobby

        pHeader.appendChild(el("button", {

        playerPanel.appendChild(pHeader);

        const pGrid = el("div", { class: "player-lobby-grid" });
        gameState.players.forEach(p => {
          const isMe = p.id === myPlayerId;

          const pill = el("div", {
            class: "player-pill" + (p.isHost ? " is-host" : "") + (isMe ? " is-me" : "") + (!isOnline ? " offline" : ""),
            style: isMe ? "cursor:pointer;" : "",
            title: isMe ? "Tap to change your avatar" : "",
            onclick: isMe ? () => { showEmojiModal = true; render(); } : null
          });

          pill.appendChild(el("span", { class: "player-avatar" }, [document.createTextNode(p.avatar || "👤")]));

            document.createTextNode(p.name + (isMe ? " (You)" : ""))

                e.stopPropagation();
                gameState.players = gameState.players.filter(x => x.id !== p.id);
                if (p.connId && clientConns.has(p.connId)) {
                  try { clientConns.get(p.connId).close(); } catch (err) { }
                  clientConns.delete(p.connId);

                broadcastGameState();
                render();

          const onlineCount = gameState.players.filter(p => p.online !== false).length;
          const maxImpAllowed = Math.max(1, Math.floor((onlineCount - 1) / 2));
          if (gameState.numImposters > maxImpAllowed) gameState.numImposters = maxImpAllowed;
          if (gameState.numImposters < 1) gameState.numImposters = 1;

          settingsPanel.appendChild(el("label", {}, [document.createTextNode("Number of Imposters")]));

              onclick: () => { gameState.categoryFilter = cat; broadcastGameState(); render(); }
            }, [document.createTextNode(cat)]));
          });
          settingsPanel.appendChild(chipRow);

          screen.appendChild(settingsPanel);

          // Start button
          const canStart = onlineCount >= 3;
          const startBtn = el("button", {
            class: "primary",
            onclick: hostStartMultiplayerGame,

          }, [document.createTextNode(canStart ? ("🚀 Start Multiplayer Game (" + onlineCount + " Players) ▶") : ("Waiting for Players (" + onlineCount + "/3 Joined)"))]);
          screen.appendChild(startBtn);

          waitBox.appendChild(el("div", { style: "font-weight:600; margin-top:8px; color:var(--gold)" }, [document.createTextNode("Waiting for Host to start...")]));
          screen.appendChild(waitBox);
        }

        app.appendChild(screen);
      }

        // Card Container
